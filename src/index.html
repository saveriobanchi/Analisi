<!--
  DIRECTION CARD — Monte Analisi
  Concept: l'esame è una montagna; la mappa è una carta topografica notturna generata da una vera f(x,y),
           e il sentiero CAI bianco-rosso sale per 10 rifugi (i capitoli) fino a Cima Esame, 3300 m = 33/33.
  Borrowed from: night canvas + uppercase condensed signage (SpaceX language); tactile bevelled chrome and
           amber forward cues (Nintendo 2001 language); visible grid and hard borders (brutalism, ui-ux-pro-max).
  Palette: night #0B151C, paper #ECEFE8, ink #13202A, segnavia red #D7261E, signal amber #F2A516, lake blue #1F6FB2.
  Type: Bodoni Moda (display, italic numerals) / Schibsted Grotesk (text) / Barlow Condensed (signage) / JetBrains Mono (data).
  Signature move: mappa viva con lettura GPS x, y, z = f(x,y) e freccia del gradiente sotto il dito.
  Richness: cartiglio, scala, rosa dei venti a ∇, curva 1600 m = soglia 16/33, timbri dei rifugi nel libretto.
  Motion: Jakub primary (polish 200-400ms), Jhey secondary (timbro che cade al completamento).
-->
