<title>Monte Analisi</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Gioco di preparazione all'esame scritto di Analisi Matematica 2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,500..800;1,6..96,500..800&family=Barlow+Condensed:wght@500;600;700&family=Schibsted+Grotesk:ital,wght@0,400..700;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
<!--
  DIRECTION CARD — Monte Analisi
  Concept: l'esame è una montagna; la mappa è una carta topografica notturna generata da una vera f(x,y),
           e il sentiero CAI bianco-rosso sale per 10 rifugi (i capitoli) fino a Cima Esame, 3300 m = 33/33.
  Borrowed from: night canvas + uppercase condensed signage (SpaceX language); tactile bevelled chrome and
           amber forward cues (Nintendo 2001 language); visible grid and hard borders (brutalism, ui-ux-pro-max).
  Palette: night #0B151C, paper #ECEFE8, ink #13202A, segnavia red #D7261E, signal amber #F2A516, lake blue #1F6FB2.
  Type: Bodoni Moda (display, italic numerals) / Schibsted Grotesk (text) / Barlow Condensed (signage) / JetBrains Mono (data).
  Signature move: mappa viva con lettura GPS x, y, z = f(x,y) e freccia del gradiente sotto il dito.
  Richness: cartiglio, scala, rosa dei venti a ∇, curva 1600 m = soglia 16/33, timbri dei rifugi nel libretto.
  Motion: Jakub primary (polish 200-400ms), Jhey secondary (timbro che cade al completamento).
-->
<style>
/* Layout: rail di navigazione a sinistra (desktop) o barra in basso (telefono); la mappa notturna è la cornice
   drammatica, le superfici di studio sono carta chiara e calma, con griglia millimetrata e bordi netti. */
:root{
  --night:#0B151C; --night-2:#12222C; --night-line:#23404E; --night-ink:#DCE7EA; --night-muted:#8FA6B0;
  --paper:#ECEFE8; --sheet:#FAFBF8; --sheet-2:#F2F4EF; --ink:#13202A; --muted:#55626B; --line:#C5CDC3; --line-2:#DCE2D9;
  --grid:rgba(19,32,42,.055);
  --red:#D7261E; --red-ink:#A51B14; --red-soft:#F8E1DD;
  --amber:#F2A516; --amber-ink:#7A4E00; --amber-soft:#FCEFCF;
  --blue:#1F6FB2; --blue-soft:#DCEAF6;
  --ok:#1C7E4E; --ok-soft:#DCF0E3; --bad:#C2302A; --bad-soft:#F9E0DD;
  --shadow:#13202A;
  --f-display:"Bodoni Moda","Bodoni 72","Didot",Georgia,serif;
  --f-text:"Schibsted Grotesk","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-sign:"Barlow Condensed","Arial Narrow","Roboto Condensed",sans-serif-condensed,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:4px; --rail:232px;
  --ease:cubic-bezier(.2,.8,.2,1);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0E1A21; --sheet:#14232C; --sheet-2:#192B35; --ink:#E4ECEE; --muted:#97A8B0; --line:#2A4352; --line-2:#21374A;
  --grid:rgba(220,231,234,.04);
  --red:#FF5446; --red-ink:#FF8A7E; --red-soft:#3B1D1B;
  --amber:#F6B23A; --amber-ink:#FFD58A; --amber-soft:#33280F;
  --blue:#62B2F0; --blue-soft:#14304A;
  --ok:#43C98B; --ok-soft:#12332A; --bad:#FF6B5F; --bad-soft:#3A1C1B;
  --shadow:#000000; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0E1A21; --sheet:#14232C; --sheet-2:#192B35; --ink:#E4ECEE; --muted:#97A8B0; --line:#2A4352; --line-2:#21374A;
  --grid:rgba(220,231,234,.04);
  --red:#FF5446; --red-ink:#FF8A7E; --red-soft:#3B1D1B;
  --amber:#F6B23A; --amber-ink:#FFD58A; --amber-soft:#33280F;
  --blue:#62B2F0; --blue-soft:#14304A;
  --ok:#43C98B; --ok-soft:#12332A; --bad:#FF6B5F; --bad-soft:#3A1C1B;
  --shadow:#000000; color-scheme:dark}

*,*::before,*::after{box-sizing:border-box}
[hidden]:not([hidden=until-found i]){display:none!important}
.prose,.blk-b,.qcard,.feedback,.ex-steps,.stack,.wrap,.panel,.blocks,.quiz,.lessons,.review,.controls,.th-card,.result,.next-card{grid-template-columns:minmax(0,1fr)}
.chart-host{min-width:0;width:100%}
html{-webkit-text-size-adjust:100%}
body{background:var(--paper);color:var(--ink);font:400 16px/1.6 var(--f-text);-webkit-font-smoothing:antialiased;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;min-height:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--sheet)}
a{color:var(--blue)}
button{font:inherit;color:inherit}
:focus-visible{outline:2.5px solid var(--blue);outline-offset:2px;border-radius:2px}
h1,h2,h3,h4{margin:0;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}
.ico{width:1.25em;height:1.25em;flex:none;vertical-align:-.25em}
.ico.big{width:40px;height:40px;color:var(--red)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
mjx-container{max-width:100%}
mjx-container[display="true"]{overflow-x:auto;overflow-y:hidden;padding:.2em 0;margin:.4em 0!important}
mjx-container:not([display]) svg{vertical-align:-.25em}
.math-pending{opacity:.6}

/* ---------- app frame ---------- */
.app{min-height:100%}
.rail{display:none}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--sheet);border-bottom:1.5px solid var(--ink);
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink)}
.brand-t{font:600 19px/1 var(--f-display);letter-spacing:.005em;white-space:nowrap}
.brand-t b{font-weight:800}
.brand-t em{font-style:italic;font-weight:500}
.segnavia{display:inline-grid;grid-template-rows:1fr 1fr 1fr;width:22px;height:22px;border:1.5px solid var(--ink);border-radius:2px;overflow:hidden;flex:none}
.segnavia i{display:block;background:var(--red)}
.segnavia i:nth-child(2){background:#fff}
.top-stats{display:flex;gap:8px;align-items:center}
.stat-chip{display:inline-flex;align-items:center;gap:5px;font:600 13px/1 var(--f-mono);padding:6px 8px;border:1.5px solid var(--line);border-radius:var(--r);background:var(--sheet-2);white-space:nowrap;font-variant-numeric:tabular-nums}
.stat-chip .ico{color:var(--red)}
.stat-chip.streak .ico{color:var(--amber)}
.icon-btn{display:inline-grid;place-items:center;width:40px;height:40px;border:1.5px solid var(--line);border-radius:var(--r);background:var(--sheet);cursor:pointer}
.icon-btn:hover{border-color:var(--ink)}
.view{display:block;outline:none;padding-block:20px 110px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1120px;margin:0 auto;display:grid;gap:22px;min-width:0}
.wrap.narrow{max-width:760px}
.wrap.mid{max-width:920px}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--sheet);border-top:1.5px solid var(--ink);
  display:grid;grid-template-columns:repeat(5,1fr);
  padding:4px max(6px,env(safe-area-inset-right,0px)) calc(4px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px))}
.tabbar a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 2px 6px;text-decoration:none;color:var(--muted);
  font:600 12px/1.1 var(--f-sign);letter-spacing:.06em;text-transform:uppercase;border-radius:var(--r);min-height:48px;justify-content:center}
.tabbar a .ico{width:24px;height:24px}
.tabbar a[aria-current="page"]{color:var(--ink);background:var(--sheet-2)}
.tabbar a[aria-current="page"] .ico{color:var(--red)}

@media (min-width:960px){
  .app{display:grid;grid-template-columns:var(--rail) minmax(0,1fr)}
  .topbar,.tabbar{display:none}
  body::before{background:var(--paper)}
  .rail{display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh;height:100dvh;overflow-y:auto;
    background:var(--sheet);border-right:1.5px solid var(--ink);padding:calc(18px + env(safe-area-inset-top,0px)) 14px 16px max(14px,env(safe-area-inset-left,0px))}
  .rail .brand{padding:4px 6px 14px;border-bottom:1.5px solid var(--line)}
  .rail .brand-t{font-size:22px}
  .rail-nav{display:grid;gap:2px}
  .rail-nav a{display:flex;align-items:center;gap:10px;padding:10px 10px;border-radius:var(--r);text-decoration:none;color:var(--muted);
    font:600 15px/1 var(--f-sign);letter-spacing:.07em;text-transform:uppercase;border:1.5px solid transparent}
  .rail-nav a .ico{width:22px;height:22px}
  .rail-nav a:hover{color:var(--ink);background:var(--sheet-2)}
  .rail-nav a[aria-current="page"]{color:var(--ink);border-color:var(--ink);background:var(--paper);box-shadow:2px 2px 0 var(--shadow)}
  .rail-nav a[aria-current="page"] .ico{color:var(--red)}
  .rail-nav .badge{margin-left:auto}
  .rail-foot{margin-top:auto;display:grid;gap:8px}
  .view{padding-block:28px 64px;padding-left:32px;padding-right:max(32px,env(safe-area-inset-right,0px))}
}

/* ---------- type helpers ---------- */
.eyebrow{display:flex;align-items:center;gap:8px;font:600 13px/1 var(--f-sign);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.eyebrow::before{content:"";width:16px;height:6px;background:linear-gradient(90deg,var(--red) 0 33%,#fff 33% 66%,var(--red) 66%);border:1px solid var(--ink);flex:none}
.h-display{font:700 clamp(34px,5.4vw,60px)/1.02 var(--f-display);letter-spacing:-.02em}
.h-display em{font-style:italic;font-weight:600}
.h2{font:700 clamp(24px,3vw,32px)/1.12 var(--f-display)}
.h3{font:700 20px/1.25 var(--f-display)}
.lead{font-size:18px;color:var(--muted);max-width:64ch}
.muted{color:var(--muted)}
.small{font-size:14px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.sign{font:600 14px/1.1 var(--f-sign);letter-spacing:.1em;text-transform:uppercase}
.prose{display:grid;gap:12px;max-width:68ch;min-width:0}
.prose ul,.prose ol{margin:0;padding-left:1.3em;display:grid;gap:6px}
.prose b,.prose strong{font-weight:650}
.badge{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:var(--red);color:#fff;font:600 12px/1 var(--f-mono)}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:10px 18px;border:1.5px solid var(--ink);border-radius:var(--r);
  background:var(--sheet);color:var(--ink);font:650 15px/1.1 var(--f-text);text-decoration:none;cursor:pointer;
  box-shadow:0 3px 0 var(--shadow);transition:transform .12s var(--ease),box-shadow .12s var(--ease),background .15s}
.btn:hover{background:var(--sheet-2)}
.btn:active{transform:translateY(3px);box-shadow:0 0 0 var(--shadow)}
.btn.primary{background:var(--amber);color:#1B1300;border-color:#1B1300}
.btn.primary:hover{background:#FFB938}
.btn.dark{background:var(--ink);color:var(--paper)}
.btn.ghost{box-shadow:none;border-color:var(--line);background:transparent}
.btn.ghost:hover{border-color:var(--ink)}
.btn.small{min-height:38px;padding:7px 12px;font-size:14px}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none;box-shadow:0 3px 0 var(--shadow)}
.btn kbd{font:600 11px/1 var(--f-mono);padding:3px 5px;border:1px solid currentColor;border-radius:3px;opacity:.6}
.stack{display:grid;gap:16px;min-width:0}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.row.spread{justify-content:space-between}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 9px;border:1.5px solid var(--line);border-radius:999px;font:600 13px/1 var(--f-sign);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);background:var(--sheet)}
.chip.red{color:var(--red-ink);border-color:var(--red);background:var(--red-soft)}
.chip.ok{color:var(--ok);border-color:var(--ok);background:var(--ok-soft)}
.chip.amber{color:var(--amber-ink);border-color:var(--amber);background:var(--amber-soft)}
.chip.blue{color:var(--blue);border-color:var(--blue);background:var(--blue-soft)}

/* ---------- panels ---------- */
.panel{border:1.5px solid var(--ink);border-radius:var(--r);background:var(--sheet);padding:18px 20px;display:grid;gap:12px;min-width:0;align-content:start}
.panel.flat{border-color:var(--line)}
.panel.raised{box-shadow:4px 4px 0 var(--shadow)}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:14px}
.kpi{display:grid;gap:4px}
.kpi b{font:700 34px/1 var(--f-display);font-variant-numeric:tabular-nums}
.kpi span{font:600 13px/1.2 var(--f-sign);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}

/* ---------- map ---------- */
.map-frame{position:relative;border:1.5px solid var(--ink);border-radius:var(--r);background:var(--night);color:var(--night-ink);overflow:hidden;
  box-shadow:5px 5px 0 var(--shadow);isolation:isolate}
.map-canvas{display:block;width:100%;height:clamp(460px,64vh,680px);touch-action:pan-y}
.map-svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.map-svg .hit{pointer-events:auto;cursor:pointer}
.map-legend{position:absolute;left:12px;bottom:12px;z-index:2;background:rgba(11,21,28,.86);border:1px solid var(--night-line);border-radius:3px;padding:10px 12px;
  font:500 11.5px/1.45 var(--f-mono);color:var(--night-muted);max-width:min(300px,calc(100% - 24px));backdrop-filter:blur(3px)}
.map-legend b{display:block;font:700 15px/1.1 var(--f-display);color:var(--night-ink);margin-bottom:4px;letter-spacing:0}
.map-legend .lg{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.map-legend .lg span{display:inline-flex;align-items:center;gap:5px}
.map-legend .sw{width:16px;height:3px;display:inline-block}
.map-gps{position:absolute;right:12px;bottom:22px;z-index:2;font:500 12px/1.5 var(--f-mono);color:var(--night-ink);background:rgba(11,21,28,.86);
  border:1px solid var(--night-line);border-radius:3px;padding:8px 10px;min-width:170px;font-variant-numeric:tabular-nums}
.map-gps .k{color:var(--night-muted)}
.map-title{position:absolute;left:14px;top:12px;z-index:2;pointer-events:none}
.map-title .h-display{color:#fff;font-size:clamp(30px,4.6vw,54px);text-shadow:0 2px 0 rgba(0,0,0,.4)}
.map-title .eyebrow{color:var(--night-muted)}
.map-title .eyebrow::before{border-color:#fff}
@media (max-width:640px){
  .map-canvas{height:min(150vw,660px)}
  .map-title .eyebrow{display:none}
  .map-title .h-display{font-size:27px}
  .map-gps{bottom:12px;right:12px;min-width:0;font-size:11px}
  .map-legend{display:none}
}

/* waypoint list under map */
.trail{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,200px),1fr));gap:10px}
.wp{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;align-items:center;padding:12px 14px;border:1.5px solid var(--line);border-radius:var(--r);
  background:var(--sheet);text-decoration:none;color:var(--ink);transition:border-color .15s,transform .15s var(--ease)}
.wp:hover{border-color:var(--ink);transform:translateY(-2px)}
.wp .n{grid-row:span 2;font:italic 700 34px/1 var(--f-display);color:var(--red);min-width:36px;text-align:center}
.wp .t{font:650 15px/1.2 var(--f-text);min-width:0}
.wp .s{font:500 12px/1.2 var(--f-mono);color:var(--muted);display:flex;gap:8px;align-items:center}
.wp .bar{height:4px;border-radius:2px;background:var(--line-2);overflow:hidden;grid-column:1/-1;margin-top:4px}
.wp .bar i{display:block;height:100%;background:var(--ok)}

/* ---------- hero/today band ---------- */
.today{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px}
@media (max-width:820px){.today{grid-template-columns:minmax(0,1fr)}}
.next-card{display:grid;gap:12px;padding:20px;border:1.5px solid var(--ink);border-radius:var(--r);background:var(--sheet);box-shadow:4px 4px 0 var(--shadow)}
.next-card .h2{font-size:26px}
.quick{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.quick a{display:grid;gap:6px;padding:14px;border:1.5px solid var(--line);border-radius:var(--r);background:var(--sheet);text-decoration:none;color:var(--ink);min-height:96px;align-content:start}
.quick a:hover{border-color:var(--ink)}
.quick a .ico{width:26px;height:26px;color:var(--red)}
.quick a b{font:650 15px/1.2 var(--f-text)}
.quick a span{font-size:13px;color:var(--muted);line-height:1.35}

/* ---------- chapter page ---------- */
.ch-head{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 22px;align-items:end;padding-bottom:16px;border-bottom:1.5px solid var(--ink)}
.ch-num{grid-row:span 3;font:italic 700 clamp(88px,13vw,150px)/.8 var(--f-display);color:var(--red);letter-spacing:-.04em}
.ch-meta{display:flex;flex-wrap:wrap;gap:8px}
.info2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:14px}
.lessons{display:grid;gap:8px}
.lesson-row{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 14px;border:1.5px solid var(--line);border-radius:var(--r);
  background:var(--sheet);text-decoration:none;color:var(--ink)}
a.lesson-row:hover{border-color:var(--ink)}
.lesson-row .num{font:600 15px/1 var(--f-mono);display:grid;place-items:center;width:40px;height:40px;border:1.5px solid var(--ink);border-radius:50%}
.lesson-row.done .num{background:var(--ok);border-color:var(--ok);color:#fff}
.lesson-row.locked{opacity:.55}
.lesson-row.locked .num{border-style:dashed}
.lesson-row .tt{font:650 16px/1.25 var(--f-text)}
.lesson-row .gg{font-size:13.5px;color:var(--muted);line-height:1.35;margin-top:2px}
.stars{display:inline-flex;gap:1px;color:var(--line)}
.stars .on{color:var(--amber)}
.stars .ico{width:18px;height:18px}
.boss{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:16px;align-items:center;padding:18px 20px;border:1.5px solid var(--ink);border-radius:var(--r);
  background:var(--night);color:var(--night-ink);box-shadow:4px 4px 0 var(--shadow);text-decoration:none;position:relative;overflow:hidden}
.boss::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(-55deg,transparent 0 14px,rgba(255,255,255,.035) 14px 15px);pointer-events:none}
.boss .ico.big{width:42px;height:42px;color:var(--amber)}
.boss b{display:block;font:700 22px/1.15 var(--f-display);color:#fff}
.boss span{font-size:14px;color:var(--night-muted)}
.boss.locked{filter:saturate(.3);opacity:.7}
@media (max-width:560px){.boss{grid-template-columns:auto minmax(0,1fr)}.boss .btn{grid-column:1/-1}}

/* ---------- lesson ---------- */
.lesson-top{display:grid;gap:10px}
.tabs{display:flex;gap:0;border:1.5px solid var(--ink);border-radius:var(--r);overflow:hidden;width:max-content;max-width:100%;background:var(--sheet)}
.tabs button{padding:10px 18px;border:0;background:transparent;cursor:pointer;font:600 15px/1 var(--f-sign);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);min-height:44px}
.tabs button+button{border-left:1.5px solid var(--ink)}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--paper)}
.goal{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:start;padding:14px 16px;border:1.5px dashed var(--ink);border-radius:var(--r);background:var(--sheet)}
.goal .ico{width:26px;height:26px;color:var(--red)}
.blocks{display:grid;gap:16px}
.blk{border:1.5px solid var(--line);border-radius:var(--r);background:var(--sheet);min-width:0;overflow:hidden}
.blk-h{display:flex;align-items:center;gap:10px;padding:9px 14px;border-bottom:1.5px solid var(--line);background:var(--sheet-2)}
.blk-h .lab{font:700 13px/1 var(--f-sign);letter-spacing:.14em;text-transform:uppercase}
.blk-h .ttl{font:650 15.5px/1.25 var(--f-text);min-width:0}

#lesson 1.1 Norma, distanza e stime fondamentali
goal: Usare senza esitare $|x|\le r$ e $|xy|\le r^2/2$: sono gli attrezzi di quasi tutti i limiti.

::idea
In Analisi 2 un punto ha più coordinate: $(x,y)\in\mathbb R^2$, $(x,y,z)\in\mathbb R^3$. Tutto quello che diremo su limiti e continuità si basa su un'unica idea: **misurare quanto due punti sono vicini**. Lo strumento è la norma.

::def Norma, distanza, prodotto scalare
$$\|x\|=\sqrt{x_1^2+\dots+x_n^2},\qquad d(x,y)=\|x-y\|,\qquad x\cdot y=x_1y_1+\dots+x_ny_n .$$
Nel piano useremo sempre $r=\sqrt{x^2+y^2}$, la distanza dall'origine. Un **versore** è un vettore di norma 1: $v/\|v\|$.

::thm Disuguaglianza di Cauchy-Schwarz e proprietà della norma
$$|x\cdot y|\le \|x\|\,\|y\| ,$$
con uguaglianza solo per vettori paralleli. Inoltre $\|x\|\ge 0$ (e $=0$ solo per $x=0$), $\|\lambda x\|=|\lambda|\,\|x\|$, $\|x+y\|\le\|x\|+\|y\|$ (triangolare).

::table
Stima ¦ Perché vale ¦ A cosa serve
$|x|\le r,\ |y|\le r$ ¦ $x^2\le x^2+y^2$ ¦ $|x|^a|y|^b\le r^{a+b}$
$|xy|\le r^2/2$ ¦ $(|x|-|y|)^2\ge 0$ ¦ termini misti $xy$, $x^2y^2$
$\dfrac{x^2}{x^2+y^2}\le 1$ ¦ il numeratore è un pezzo del denominatore ¦ far sparire una frazione limitata
$r\le |x|+|y|\le\sqrt2\,r$ ¦ si eleva al quadrato ¦ denominatori con valori assoluti

::example base Maggiora $|x^2y|$ e $|x^3y^2|$ con una potenza di $r$.
+ Idea: ogni fattore $|x|$ o $|y|$ vale al massimo $r$: si contano i fattori.
+ Calcolo: $|x^2y|\le r^2\cdot r=r^3$, $\ |x^3y^2|\le r^5$.
= Regola: un monomio di grado $k$ è maggiorato da $r^k$.

::example medio Mostra che $\dfrac{|xy|}{\sqrt{x^2+y^2}}\le \dfrac r2$.
+ Calcolo: $\dfrac{|xy|}{r}\le\dfrac{r^2/2}{r}=\dfrac r2$.
= Quando $r\to0$ anche $r/2\to0$: hai appena dimostrato che $xy/\sqrt{x^2+y^2}\to0$ nell'origine. È così che si dimostra un limite.

::trap
- $\sqrt{x^2+y^2}$ non è $|x|+|y|$ né $x+y$. Vale solo la catena $r\le|x|+|y|\le\sqrt2\,r$.
- Le stime si fanno sui valori assoluti: per un limite serve $|xy|\le r^2/2$, non $xy\le r^2/2$.

#lesson 1.2 Insiemi aperti, chiusi, limitati, compatti
goal: Dato un insieme descritto da disuguaglianze, dire subito se è aperto, chiuso, limitato, compatto, e qual è la frontiera.

::idea
Per parlare di "vicino" serve la **palla** $B_r(P)=\{Q:\|Q-P\|<r\}$, un disco senza bordo. Guardando cosa contiene ogni piccola palla attorno a un punto, lo classifichi rispetto a un insieme $A$: dentro, fuori, sul bordo.

::def Punti interni, esterni, di frontiera, di accumulazione
$P$ è **interno** ad $A$ se una palla $B_r(P)$ sta tutta in $A$; **esterno** se una palla non tocca $A$; **di frontiera** se ogni palla contiene punti di $A$ e punti fuori da $A$ (insieme $\partial A$).
$P$ è **di accumulazione** per $A$ se ogni palla attorno a $P$ contiene punti di $A$ diversi da $P$. Un punto di $A$ non di accumulazione è **isolato**. I limiti si calcolano solo nei punti di accumulazione del dominio.

::def Aperto, chiuso, limitato, compatto
**Aperto**: ogni punto è interno. **Chiuso**: contiene tutta la frontiera (equivalente: il complementare è aperto; equivalente: contiene i limiti delle sue successioni convergenti). **Limitato**: sta in una palla $B_R(0)$. **Compatto**: chiuso e limitato.

::method Riconoscere la natura di un insieme
1. Disegna i bordi: sostituisci ogni disuguaglianza con un'uguaglianza.
2. Con funzioni continue: solo disuguaglianze strette ($<,>,\ne$) danno un aperto; solo larghe ($\le,\ge,=$) danno un chiuso; miste, di solito né l'uno né l'altro.
3. Limitato: cerca un cerchio che lo contenga. Rette o parabole senza restrizioni lo rendono illimitato.
4. Compatto = chiuso e limitato: è l'ipotesi di Weierstrass.

::example base $A=\{1\le x^2+y^2<4\}$.
+ Bordo: $x^2+y^2=1$ (inclusa) e $x^2+y^2=4$ (esclusa).
+ Natura: contiene una parte di frontiera e non l'altra: né aperto né chiuso. Limitato (raggio 2), quindi non compatto solo perché non chiuso.
= Né aperto né chiuso, limitato, non compatto.

::example esame $E=\{0<x^2+y^2\le 1\}$.
+ Frontiera: la circonferenza unitaria **e l'origine**: ogni palla attorno a $(0,0)$ contiene punti di $E$ e il punto $(0,0)\notin E$.
+ Natura: non chiuso (manca l'origine), non aperto (contiene la circonferenza).
= $(0,0)$ non sta in $E$ ma è di accumulazione: è la situazione tipica dei limiti in $(0,0)$ di funzioni non definite nell'origine.

::trap
- "Non aperto" non vuol dire "chiuso": un insieme può non essere né l'uno né l'altro; $\mathbb R^2$ e $\emptyset$ sono entrambe le cose.
- Un punto isolato sta nella frontiera: $\{(0,0)\}$ è chiuso e la sua frontiera è il punto stesso.

#lesson 1.3 Dominio e curve di livello
goal: Disegnare il dominio di una funzione di due variabili e capire la forma del grafico dalle curve di livello.

::idea
Il grafico di $f(x,y)$ è una superficie $z=f(x,y)$. Siccome disegnare superfici è difficile, si usano due strumenti piani, come in una carta topografica: il **dominio** e le **curve di livello**. La mappa di questa app è proprio questo: una vera $f(x,y)$ disegnata con le sue curve di livello.

::def Dominio e insieme di livello
Il dominio naturale è l'insieme dei punti in cui l'espressione ha senso. L'insieme di livello $c$ è
$$L_c=\{(x,y)\in A:\ f(x,y)=c\},$$
la "curva ad altezza $c$" proiettata sul piano.

::method Trovare e disegnare il dominio
1. Una condizione per pezzo: denominatore $\ne0$; radice di indice pari: argomento $\ge0$; logaritmo: argomento $>0$; $\arcsin,\arccos$: argomento in $[-1,1]$.
2. Per ogni condizione disegna la curva di bordo e scegli il lato provando un punto comodo, come l'origine.
3. Interseca le regioni. Bordo continuo se incluso, tratteggiato se escluso.
4. Concludi con la natura: aperto, chiuso, limitato, compatto.

::example medio $f(x,y)=\sqrt{4-x^2-y^2}+\ln(y-x^2)$.
+ Radice: $x^2+y^2\le4$: disco chiuso di raggio 2.
+ Logaritmo: $y>x^2$: sopra la parabola, parabola esclusa.
+ Intersezione: dentro il disco e sopra la parabola. Le curve si incontrano dove $y+y^2=4$, cioè $y=\frac{-1+\sqrt{17}}2$.
= Limitato; né aperto né chiuso (contiene l'arco di circonferenza ma non quello di parabola).

::example esame $f(x,y)=\arcsin(x^2+y^2-2)$: dominio e valori estremi.
+ Condizione: $-1\le x^2+y^2-2\le1 \iff 1\le x^2+y^2\le3$: corona circolare chiusa.
+ Natura: chiusa e limitata, quindi compatta; $f$ è continua.
= Weierstrass garantisce max e min: $\max f=\pi/2$ sulla circonferenza esterna, $\min f=-\pi/2$ su quella interna.

::note Cosa raccontano le curve di livello
Circonferenze concentriche: simmetria di rotazione. Curve che si addensano: superficie ripida. **Rette per l'origine** (come per $xy/(x^2+y^2)$, che vale $m/(1+m^2)$ su $y=mx$): la funzione dipende solo dalla direzione, segnale che il limite nell'origine non esiste.

::lab superfici f=xy path=line

#lesson 1.4 Il limite: definizione, restrizione, direzionali
goal: Capire cosa chiede la definizione di limite in più variabili e usare il teorema di restrizione.

::idea
In una variabile ci si avvicina a $x_0$ solo da destra o da sinistra. Nel piano ci si avvicina da **infinite direzioni e lungo infinite curve**. Il limite esiste quando la funzione si avvicina allo stesso valore comunque ci si avvicini: basta un percorso "ribelle" e il limite non esiste.

::def Limite finito
Sia $P_0$ di accumulazione per il dominio $A$ di $f$. $\lim_{P\to P_0}f(P)=l$ se
$$\forall\varepsilon>0\ \exists\delta>0:\ P\in A,\ 0<\|P-P_0\|<\delta\ \Rightarrow\ |f(P)-l|<\varepsilon .$$
La condizione riguarda **tutto il disco** attorno a $P_0$, non una retta. Il valore in $P_0$ non conta ($0<\|P-P_0\|$).

::thm Teorema di restrizione
Se $\lim_{P\to P_0}f(P)=l$ e $C$ è un sottoinsieme del dominio **di cui $P_0$ è punto di accumulazione**, allora anche $\lim_{P\to P_0,\,P\in C}f(P)=l$.
Conseguenza: se su due sottoinsiemi (due rette, una retta e una parabola) i limiti sono diversi, o su uno non esiste, il limite di $f$ non esiste.

::thm Confronto (carabinieri)
Se $|f(P)-l|\le g(P)$ vicino a $P_0$ e $g(P)\to0$, allora $f(P)\to l$. Caso molto usato: **limitata per infinitesima tende a 0**.

::def Limite direzionale
Per un versore $v$: $\lim_{t\to0}f(P_0+tv)$. È un limite in una variabile. Nell'origine si usano $v=(\cos\theta,\sin\theta)$ o le rette $y=mx$ e $x=0$.

::exam
L'errore più frequente del capitolo: "lungo tutte le rette il limite è $l$, quindi il limite è $l$". È **falso**: $\frac{x^2y}{x^4+y^2}$ tende a 0 lungo ogni retta ma vale $\frac12$ sulla parabola $y=x^2$. Uscito come Vero/Falso il 15 luglio 2026 (risposta: Falso). Altro classico (9 luglio 2025): il teorema di restrizione **senza** l'ipotesi "di accumulazione per $C$" è falso.

::lab superfici f=parab path=parab

#lesson 1.5 Leggere i gradi e dimostrare che un limite non esiste
goal: Prevedere in pochi secondi se un limite in $(0,0)$ esiste, e quando non esiste trovare due percorsi con valori diversi.

::idea
Quasi tutti i limiti d'esame sono rapporti $\frac00$. Vicino all'origine un monomio di grado $k$ si comporta come $r^k$: se il numeratore va a zero più in fretta del denominatore il rapporto tende a 0, altrimenti no. È solo una **previsione**, ma ti dice quale metodo usare.

::method Lettura dei gradi
1. Porta il punto nell'origine: per un limite in $(x_0,y_0)$ poni $u=x-x_0$, $v=y-y_0$.
2. Sostituisci gli equivalenti (argomento $\to0$): $\sin u\sim u$, $1-\cos u\sim u^2/2$, $e^u-1\sim u$, $\ln(1+u)\sim u$.
3. Confronta il grado $p$ del numeratore con $q$ del denominatore: $p>q$ probabilmente 0 (dimostralo con una stima); $p=q$ di solito non esiste (prova le rette); $p<q$ di solito infinito o non esiste.
4. Denominatori sbilanciati come $x^4+y^2$: dai **peso** 1 a $x$ e 2 a $y$. Se i pesi coincidono, la curva rivelatrice è $y=kx^2$. In generale con $x^{2a}+y^{2b}$ prova $y=kx^{a/b}$.

::method Dimostrare che non esiste: due percorsi
1. Assi: $y=0$ e $x=0$. Se danno valori diversi, hai finito.
2. Rette $y=mx$: se il risultato dipende da $m$, non esiste.
3. Se tutte le rette danno lo stesso valore ma i gradi pesati sono uguali, prova la curva dei pesi ($y=kx^2$, $x=ky^2$, $y=kx^3$).
4. Concludi citando la restrizione: "lungo $C_1$ vale $l_1$, lungo $C_2$ vale $l_2\ne l_1$: il limite non esiste".

::table
Limite in $(0,0)$ ¦ Gradi (pesi) ¦ Esito
$\dfrac{x^3}{x^2+y^2}$ ¦ 3 contro 2 ¦ 0 (stima $|x|$)
$\dfrac{xy}{x^2+y^2}$ ¦ 2 contro 2 ¦ non esiste ($m/(1+m^2)$)
$\dfrac{x^2y}{x^4+y^2}$ ¦ pesi 4 contro 4 ¦ non esiste ($y=kx^2$)
$\dfrac{y^2\ln(1+2|x|)}{x^2+y^2}$ ¦ 3 contro 2 ¦ 0
$\dfrac{1-\cos(x^2+y^2)}{(x^2+y^2)^2}$ ¦ $\frac{r^4/2}{r^4}$ ¦ $\frac12$

::example medio $\displaystyle\lim_{(x,y)\to(0,0)}\frac{x^2y}{x^4+y^2}$.
+ Assi: su $y=0$ e $x=0$ vale 0.
+ Rette: su $y=mx$: $\frac{mx^3}{x^4+m^2x^2}=\frac{mx}{x^2+m^2}\to0$. Tutte danno 0: non basta.
+ Pesi: $x$ peso 1, $y$ peso 2: tutto pesa 4. Su $y=kx^2$: $\frac{kx^4}{x^4+k^2x^4}=\frac{k}{1+k^2}$.
= Con $k=1$ vale $\frac12$, sugli assi 0: il limite non esiste.

::example esame 11 giugno 2025, n. 7: $f=\dfrac{x^2\sin y}{x^4+y^2}$. Il limite in $(0,0)$ vale: 0, $\frac12$, $-1$, nessuna.
+ Riconosci: $\sin y\sim y$: è l'esempio precedente travestito.
+ Percorsi: su $y=0$: 0. Su $y=x^2$: $\frac{x^2\sin x^2}{2x^4}=\frac12\cdot\frac{\sin x^2}{x^2}\to\frac12$.
= Non esiste: **Nessuna delle precedenti**. Trappola: $\frac12$ è il limite lungo una curva, non il limite.

::trap
- Un percorso solo non dimostra niente: dà al più il candidato.
- Nella curva $y=kx^2$ il parametro $k$ resta libero: è la dipendenza da $k$ che dimostra la non esistenza.
- La lettura dei gradi non è una dimostrazione: in multipla basta per scegliere, ma va confermata quando hai tempo.

#lesson 1.6 Dimostrare che un limite esiste: stime e polari
goal: Dimostrare che $f\to l$ con una maggiorazione $|f-l|\le g$, $g\to0$, diretta o in coordinate polari.

::idea
Per dimostrare l'esistenza bisogna controllare **tutti i punti vicini insieme**, non una curva alla volta. Lo strumento è il confronto: cerchi una funzione semplice, che dipende solo da $r$ o da una coordinata, che sta sopra $|f-l|$ e tende a 0.

::method Metodo A: stima diretta
1. Trova il candidato $l$ (gradi o un percorso).
2. Maggiora $|f-l|$ un pezzo alla volta con le stime di 1.1 e con $|\sin u|\le|u|$, $0\le1-\cos u\le u^2/2$, $0\le\ln(1+u)\le u$ per $u\ge0$.
3. Arriva a una funzione che tende a 0 ($r$, $|x|$, $\ln(1+2|x|)$) e concludi con il confronto.

::method Metodo B: coordinate polari, fatte bene
1. Poni $x=x_0+r\cos\theta$, $y=y_0+r\sin\theta$.
2. Riscrivi $f-l=F(r,\theta)$.
3. Trova $|F(r,\theta)|\le g(r)$ con $g(r)\to0$ **indipendente da $\theta$**. Allora il limite è $l$.
Se per ogni $\theta$ fissato $F\to0$ ma non hai una maggiorazione uniforme, hai solo calcolato i limiti direzionali: non hai dimostrato niente.

::example base $\displaystyle\lim_{(0,0)}\frac{x^3+y^3}{x^2+y^2}$ in polari.
+ Polari: $\frac{r^3(\cos^3\theta+\sin^3\theta)}{r^2}=r(\cos^3\theta+\sin^3\theta)$.
+ Stima: $|\cos^3\theta+\sin^3\theta|\le|\cos\theta|^3+|\sin\theta|^3\le\cos^2\theta+\sin^2\theta=1$.
= $|f|\le r\to0$, indipendente da $\theta$: il limite è 0.

::example esame 22 gennaio 2025, n. 7: $\displaystyle\lim_{(0,0)}\frac{e^{x-y}-x-1+y}{2|x|+|y|}$. Opzioni: non esiste, 0, $\frac12$, nessuna.
+ Riconosci: con $u=x-y$ il numeratore è $e^u-1-u\sim u^2/2$: grado 2 contro 1, ci aspettiamo 0.
+ Stima: per $|u|\le1$ vale $|e^u-1-u|\le u^2$, e $|u|\le|x|+|y|\le 2|x|+|y|$.
+ Conclusione: $|f|\le\frac{(|x|+|y|)^2}{|x|+|y|}=|x|+|y|\to0$.
= Risposta: **0**.

::example esame 5 febbraio 2025, n. 7: $\displaystyle\lim_{(1,0)}\frac{y^2\ln x+\sin((x-1)^2+y^2)}{(x-1)^2+y^2}$.
+ Trasla: $u=x-1$, $\rho^2=u^2+y^2$: diventa $\frac{y^2\ln(1+u)}{\rho^2}+\frac{\sin\rho^2}{\rho^2}$.
+ Primo pezzo: $\left|\frac{y^2\ln(1+u)}{\rho^2}\right|\le|\ln(1+u)|\to0$.
+ Secondo pezzo: $\frac{\sin\rho^2}{\rho^2}\to1$ (limite notevole).
= Il limite vale $0+1=$ **1**.

::trap
- Polari sbagliate: per $\frac{x^2y}{x^4+y^2}$ si ottiene $\frac{r\cos^2\theta\sin\theta}{r^2\cos^4\theta+\sin^2\theta}$, che per ogni $\theta$ fissato tende a 0, ma il limite non esiste: manca la maggiorazione uniforme.
- Per maggiorare una frazione ingrandisci il numeratore o rimpicciolisci il denominatore, mai il contrario.

::exam
Il procedimento completo, in ordine: sostituisci (se è continua nel punto, il limite è il valore); trasla e usa gli equivalenti; leggi i gradi; se prevedi che non esista: assi, rette, curva dei pesi; se prevedi $l$: stima o polari uniformi; se è un prodotto, cerca **limitata per infinitesima**.

#lesson 1.7 Continuità, funzioni a tratti, Weierstrass
goal: Studiare la continuità nel punto speciale di una funzione definita a tratti (anche con parametro) ed enunciare Weierstrass con le sue ipotesi.

::def Continuità
$f$ è continua in $P_0\in A$ se $P_0$ è isolato, oppure se $\lim_{P\to P_0}f(P)=f(P_0)$. È continua su $A$ se lo è in ogni punto.

::thm Funzioni combinate
Somme, prodotti, quozienti (dove il denominatore non si annulla) e composizioni di funzioni continue sono continue. Polinomi, esponenziali, logaritmi, funzioni trigonometriche, radici e loro combinazioni sono continue nel loro dominio.

::method Funzione definita a tratti: $f=g(x,y)$ fuori da $(0,0)$, $f(0,0)=a$
1. Fuori dall'origine $f=g$ è continua per le funzioni combinate.
2. Nell'origine calcola $\lim_{(0,0)}g$ con i metodi 1.5 e 1.6.
3. $f$ è continua in $(0,0)$ se e solo se il limite esiste **e vale $a$**. Con un parametro: $a$ deve essere uguale al limite.

::example esame 22 gennaio 2025, n. 8: $f=\dfrac{3y\sqrt{|xy|}}{|y|^3+2|x|}$, $f(0,0)=0$. È continua?
+ Assi: $f=0$ su entrambi: candidato 0.
+ Pesi: al denominatore $|y|^3$ e $|x|$: $x$ peso 3, $y$ peso 1. Il numeratore pesa $1+\frac{3+1}{2}=3$, come il denominatore: prova $x=y^3$.
+ Curva: su $x=y^3$: numeratore $3y\sqrt{y^4}=3y^3$, denominatore $3|y|^3$: $f=\pm1$.
= Lungo $x=y^3$ con $y>0$, $f\to1\ne0$: **non è continua**.

::thm Teorema di Weierstrass
Sia $K\subset\mathbb R^n$ **non vuoto, chiuso e limitato** (compatto) e $f:K\to\mathbb R$ **continua**. Allora $f$ ha massimo e minimo assoluti su $K$.

::table
Ipotesi che manca ¦ Controesempio ¦ Cosa succede
$K$ chiuso ¦ $x^2+y^2$ sul disco aperto $x^2+y^2<1$ ¦ si avvicina a 1 senza raggiungerlo
$K$ limitato ¦ $f=x$ su $x\ge0$ ¦ cresce senza limite
$f$ continua ¦ $1/(x^2+y^2)$, $f(0,0)=0$, disco chiuso ¦ illimitata vicino all'origine

::trap
- Il valore assegnato in $(0,0)$ non c'entra con il calcolo del limite: prima il limite di $g$, poi il confronto con $a$.
- "Continua lungo ogni retta" non vuol dire continua: $\frac{x^2y}{x^4+y^2}$ con $f(0,0)=0$.
- Weierstrass è sufficiente, non necessario: $e^{-x^2-y^2}$ ha massimo su tutto $\mathbb R^2$. E dice che max e min esistono, non dove sono.

#theory
?th
Q: Dai la definizione di limite per una funzione di due variabili e spiega come si dimostra che un limite non esiste.
A: Sia $f:A\subseteq\mathbb R^2\to\mathbb R$ e $P_0$ punto di accumulazione di $A$. Si dice che $\lim_{P\to P_0}f(P)=l$ se per ogni $\varepsilon>0$ esiste $\delta>0$ tale che per ogni $P\in A$ con $0<\|P-P_0\|<\delta$ si ha $|f(P)-l|<\varepsilon$.

Vale il **teorema di restrizione**: se il limite è $l$, allora per ogni $C\subseteq A$ di cui $P_0$ è punto di accumulazione anche il limite di $f$ ristretta a $C$ è $l$. Quindi, se si trovano due sottoinsiemi (due rette, una retta e una parabola) lungo i quali $f$ ha limiti diversi, il limite non esiste. Esempio: $\frac{xy}{x^2+y^2}$ vale $\frac{m}{1+m^2}$ sulla retta $y=mx$.

Il viceversa non vale: limiti uguali lungo tutte le rette non garantiscono l'esistenza. $\frac{x^2y}{x^4+y^2}$ tende a 0 lungo ogni retta ma vale $\frac12$ sulla parabola $y=x^2$.
K: Definizione con $\varepsilon$, $\delta$ e $0<\|P-P_0\|<\delta$, con $P_0$ di accumulazione
K: Enunciato del teorema di restrizione, con l'ipotesi "di accumulazione per $C$"
K: Esempio di non esistenza con due percorsi
K: Avvertenza: rette tutte uguali non bastano, con controesempio

?th
Q: Enuncia il teorema di Weierstrass e discuti le ipotesi.
A: Se $K\subset\mathbb R^n$ è non vuoto, chiuso e limitato e $f:K\to\mathbb R$ è continua, allora $f$ ammette massimo e minimo assoluti su $K$.

Nessuna ipotesi si può togliere: sul disco aperto $x^2+y^2<1$ la funzione $x^2+y^2$ non ha massimo (manca la chiusura); sul semipiano $x\ge0$ la funzione $x$ non ha massimo (manca la limitatezza); sul disco chiuso, $f=\frac{1}{x^2+y^2}$ con $f(0,0)=0$ non ha massimo (manca la continuità). La condizione è sufficiente ma non necessaria: $e^{-x^2-y^2}$ ha massimo su $\mathbb R^2$.
K: Ipotesi: $K$ non vuoto, chiuso, limitato; $f$ continua
K: Tesi: esistono massimo e minimo assoluti
K: Un controesempio per ogni ipotesi tolta
K: Osservazione: sufficiente ma non necessaria

?th
Q: Quando una funzione è continua? Come si studia la continuità di una funzione definita a tratti?
A: $f$ è continua in $P_0\in A$ se $P_0$ è isolato oppure se $\lim_{P\to P_0}f(P)=f(P_0)$. Somme, prodotti, quozienti con denominatore non nullo e composizioni di funzioni continue sono continue.

Per $f$ che vale $g$ fuori da $P_0$ e $a$ in $P_0$: fuori da $P_0$ è continua se lo è $g$ (funzioni combinate); in $P_0$ è continua se e solo se $\lim_{P\to P_0}g(P)$ esiste e vale $a$. Esempio: $\frac{\sin(x^2+y^2)}{x^2+y^2}$ con $f(0,0)=a$ è continua se e solo se $a=1$.
K: Definizione di continuità (con il caso del punto isolato)
K: Teorema delle funzioni combinate
K: Metodo: limite di $g$ nel punto confrontato con il valore assegnato
K: Esempio con parametro

#chapter 2
title: Derivate e differenziabilità
short: Differenziabilità
place: Forcella Schwarz

weight: 3
program: Derivate parziali; gradiente; derivate direzionali; differenziabilità e sue conseguenze; piano tangente; teorema del differenziale totale; derivate parziali di ordine superiore; teorema di Schwarz.
exam: È l'argomento **più frequente in assoluto**: circa un quesito su quattro nelle prove disponibili. In ogni prova c'è la funzione definita a tratti in $(0,0)$ ("continua? derivabile? differenziabile?"), quasi sempre un Vero/Falso sulle implicazioni, spesso un piano tangente o una derivata direzionale. Anche la domanda di teoria dell'esempio di gennaio 2026 era su questo capitolo.

#lesson 2.1 Derivate parziali
goal: Calcolare le derivate parziali con le regole di Analisi 1 nei punti normali e con la definizione nei punti speciali.

::idea
Blocca $y=y_0$ e fai variare solo $x$: $x\mapsto f(x,y_0)$ è una funzione di una variabile, il cui grafico è la **sezione** della superficie con il piano $y=y_0$. La sua derivata è la pendenza lungo l'asse $x$.

::def Derivate parziali e gradiente
$$\frac{\partial f}{\partial x}(x_0,y_0)=\lim_{t\to0}\frac{f(x_0+t,y_0)-f(x_0,y_0)}{t},\qquad \frac{\partial f}{\partial y}(x_0,y_0)=\lim_{t\to0}\frac{f(x_0,y_0+t)-f(x_0,y_0)}{t}.$$
$f$ è **derivabile** in $P_0$ se esistono finite entrambe. Il **gradiente** è $\nabla f(P_0)=(f_x(P_0),f_y(P_0))$.

::method Quale strada usare
1. Punto normale (vicino al punto vale un'unica formula derivabile): deriva rispetto a $x$ con $y$ costante, e viceversa.
2. Punto speciale (la formula cambia, ci sono $|\cdot|$, radici di zero): usa la definizione, cioè restringi $f$ agli assi. Nell'origine: $f_x(0,0)=\lim_{t\to0}\frac{f(t,0)-f(0,0)}{t}$.

::example medio $f=\dfrac{xy}{x^2+y^2}$, $f(0,0)=0$: esistono le parziali in $(0,0)$?
+ Assi: $f(t,0)=0$ e $f(0,t)=0$ per ogni $t$.
+ Definizione: $f_x(0,0)=\lim\frac{0-0}{t}=0$, e allo stesso modo $f_y(0,0)=0$.
= Derivabile con $\nabla f=(0,0)$, eppure **non continua** (capitolo 1). Derivabile non implica continua.

::example esame 15 luglio 2026, n. 10: $f=\dfrac{\cos(x^2+y^2)-1}{(4x^2+y^2)^{3/2}}$, $f(0,0)=0$. Esiste $f_x(0,0)$?
+ Asse x: $f(t,0)=\frac{\cos t^2-1}{8|t|^3}\sim\frac{-t^4/2}{8|t|^3}=-\frac{|t|}{16}$.
+ Rapporto: $\frac{f(t,0)}{t}\sim-\frac{|t|}{16t}$: $-\frac1{16}$ per $t>0$, $+\frac1{16}$ per $t<0$.
= $f_x(0,0)$ **non esiste**. La funzione è continua ($|f|\le\frac{r^4/2}{r^3}\to0$) ma ha una piega, come $|x|$ in una variabile.

::trap
- Nei punti speciali non derivi la formula e poi sostituisci: la formula vale solo fuori dal punto.
- Nella definizione al numeratore c'è $f(0,0)$, il **valore assegnato**, che non sempre è 0.
- Con un valore assoluto controlla separatamente $t\to0^+$ e $t\to0^-$.

#lesson 2.2 Derivate direzionali e gradiente
goal: Calcolare la derivata in una direzione qualunque, con la definizione oppure con il gradiente quando è lecito.

::idea
Le parziali sono le pendenze lungo gli assi. Da un punto ti puoi muovere in qualunque direzione $v$: la pendenza in quella direzione è la **derivata direzionale**. Si ottiene restringendo $f$ alla retta per $P_0$ di direzione $v$.

::def Derivata direzionale
Per un **versore** $v$ ($\|v\|=1$):
$$\frac{\partial f}{\partial v}(P_0)=\lim_{t\to0}\frac{f(P_0+tv)-f(P_0)}{t}=g'(0),\qquad g(t)=f(P_0+tv).$$

::thm Formula del gradiente (solo se $f$ è differenziabile in $P_0$)
$$\frac{\partial f}{\partial v}(P_0)=\nabla f(P_0)\cdot v .$$
La derivata direzionale è massima nella direzione del gradiente e vale $\|\nabla f(P_0)\|$; è nulla nelle direzioni ortogonali al gradiente, cioè tangenti alla curva di livello. **Il gradiente è ortogonale alle curve di livello.**

::example esame 1 luglio 2026, n. 7: $f=xe^{xy}-ye^x$, $w=(\frac35,\frac45)$. Quanto vale $\frac{\partial f}{\partial w}(-1,1)$?
+ Derivate: $f_x=e^{xy}+xye^{xy}-ye^x$, in $(-1,1)$: $e^{-1}-e^{-1}-e^{-1}=-\frac1e$. $\ f_y=x^2e^{xy}-e^x=e^{-1}-e^{-1}=0$.
+ Formula: $f\in C^1$, quindi $\frac{\partial f}{\partial w}=-\frac1e\cdot\frac35+0=-\frac{3}{5e}$.
= Opzioni: $\frac1{5e}$, $-\frac1{5e}$, $-\frac{12}{5e}$: **Nessuna delle precedenti**. Le sbagliate nascono da segni o componenti scambiate.

::example medio $f=\dfrac{x^2y}{x^2+y^2}$, $f(0,0)=0$: tutte le direzionali in $(0,0)$.
+ Definizione: con $v=(\cos\theta,\sin\theta)$: $\frac{f(t\cos\theta,t\sin\theta)}{t}=\cos^2\theta\sin\theta$.
+ Confronto: le parziali sono 0, quindi $\nabla f\cdot v=0$, ma per $\theta=\pi/4$ la derivata vale $\frac{1}{2\sqrt2}\ne0$.
= Esistono tutte le direzionali, ma la formula del gradiente fallisce: $f$ **non è differenziabile** in $(0,0)$.

::lab gradiente

::trap
- La direzione va normalizzata: con $(1,1)$ si usa $\frac{(1,1)}{\sqrt2}$.
- $\nabla f\cdot v$ si usa solo se $f$ è differenziabile; nei punti speciali torni alla definizione.

#lesson 2.3 Differenziabilità
goal: Capire cosa vuol dire differenziabile, verificarlo con il limite della definizione e conoscere le condizioni che lo garantiscono.

::idea
In una variabile derivabile vuol dire che il grafico, ingrandito, diventa una retta. In due variabili deve diventare **un piano, in tutte le direzioni insieme**. Le parziali guardano solo due direzioni: per questo non bastano.

::def Differenziabilità in $P_0=(x_0,y_0)$
$f$ è differenziabile in $P_0$ se è derivabile e
$$\lim_{(h,k)\to(0,0)}\frac{f(x_0+h,y_0+k)-f(x_0,y_0)-f_x(P_0)\,h-f_y(P_0)\,k}{\sqrt{h^2+k^2}}=0 .$$
Il numeratore è l'errore commesso sostituendo il piano tangente alla funzione: deve andare a zero **più in fretta** della distanza. La parte lineare $df(P_0)(h,k)=f_xh+f_yk$ è il **differenziale**.

::thm Conseguenze della differenziabilità
Se $f$ è differenziabile in $P_0$: è continua in $P_0$; è derivabile; ha tutte le derivate direzionali con $\frac{\partial f}{\partial v}=\nabla f\cdot v$; il grafico ha piano tangente.

::thm Teorema del differenziale totale
Se le derivate parziali esistono in un intorno di $P_0$ e sono continue in $P_0$, allora $f$ è differenziabile in $P_0$. In particolare **ogni $f\in C^1$ è differenziabile**: polinomi, esponenziali, seni e loro combinazioni lo sono dove sono definiti con le derivate.

::method Differenziabilità in un punto speciale
1. Se $f$ non è continua, non è differenziabile: fine.
2. Calcola $f_x(P_0)$, $f_y(P_0)$ con la definizione. Se una non esiste: non differenziabile.
3. Studia il limite di $R(h,k)=\dfrac{f(P_0+(h,k))-f(P_0)-f_xh-f_yk}{\sqrt{h^2+k^2}}$: tende a 0 (stima) oppure trovi una direzione in cui non tende a 0.
Scorciatoia per il no: se in una direzione $\frac{\partial f}{\partial v}(P_0)\ne\nabla f(P_0)\cdot v$, non è differenziabile.

::example medio $f=\sqrt{|xy|}$: differenziabile in $(0,0)$?
+ Continuità e parziali: $\sqrt{|xy|}\le\frac{r}{\sqrt2}\to0$; sugli assi è nulla: $\nabla f=(0,0)$.
+ Rapporto: $R=\frac{\sqrt{|hk|}}{\sqrt{h^2+k^2}}$; su $k=h$: $R=\frac{|h|}{\sqrt2|h|}=\frac1{\sqrt2}\not\to0$.
= Continua, derivabile, **non differenziabile**.

::example esame 25 giugno 2025, n. 8: $f=|x(y+1)|$. Quale è vera? derivabile in $(0,0)$ · differenziabile in $(0,-1)$ · derivabile ma non differenziabile in $(0,-1)$ · nessuna.
+ In (0,0): $f(t,0)=|t|$: $f_x(0,0)$ non esiste. La prima è falsa.
+ In (0,−1): $f(t,-1)=0$, $f(0,-1+t)=0$: $\nabla f=(0,0)$. Con $h=x$, $k=y+1$: $R=\frac{|h||k|}{\sqrt{h^2+k^2}}\le\frac r2\to0$.
= Risposta: **differenziabile in $(0,-1)$**. Il modulo crea una piega dove un solo fattore cambia segno; dove se ne annullano due il prodotto è "piccolo al quadrato".

::lab superfici f=dir path=line

#lesson 2.4 La mappa delle implicazioni
goal: Rispondere senza esitare ai Vero/Falso "se … allora …" e avere un controesempio per ogni freccia che manca.

::idea
Tutte le frecce partono da **differenziabile**, o ci arrivano da $C^1$. Nessuna si inverte, e tra "continua" e "derivabile" non c'è alcun legame. Tocca le frecce nel laboratorio qui sotto e verifica.

::lab implicazioni

::table
Affermazione ¦ Vera? ¦ Controesempio o motivo
differenziabile ⇒ continua, derivabile, tutte le direzionali ¦ Vera ¦ teorema
$C^1$ ⇒ differenziabile ¦ Vera ¦ differenziale totale
derivabile ⇒ continua ¦ Falsa ¦ $\frac{xy}{x^2+y^2}$, $f(0,0)=0$
continua ⇒ derivabile ¦ Falsa ¦ $\sqrt{x^2+y^2}$ oppure $|x|$
derivabile ⇒ differenziabile ¦ Falsa ¦ $\sqrt{|xy|}$
continua + derivabile + tutte le direzionali ⇒ differenziabile ¦ Falsa ¦ $\frac{x^2y}{x^2+y^2}$
tutte le direzionali, uguali a $\nabla f\cdot v$ ⇒ differenziabile ¦ Falsa ¦ $\frac{x^3y}{x^4+y^2}$: su $y=x^2$, $R\to\pm\frac12$
differenziabile ⇒ $C^1$ ¦ Falsa ¦ esistono controesempi (non serve costruirli)

::exam
Individua le due proprietà del "se … allora …" e cerca la freccia. Se non c'è, la risposta è Falso e devi saper dire il controesempio. Uscite esattamente: continua ⇒ derivabile (Falso, 11/6/2025), derivabile ⇒ continua (Falso, 11/6/2025), continua + derivabile + direzionali ⇒ differenziabile (Falso, 25/6/2025), differenziabile ⇒ direzionali (Vero, 25/6/2025).

#lesson 2.5 Piano tangente
goal: Scrivere l'equazione del piano tangente al grafico senza errori di calcolo.

::def Piano tangente al grafico in $(x_0,y_0,f(x_0,y_0))$, $f$ differenziabile
$$z=f(x_0,y_0)+f_x(x_0,y_0)\,(x-x_0)+f_y(x_0,y_0)\,(y-y_0).$$
Un vettore normale al piano (e al grafico) è $(f_x,f_y,-1)$.

::method
1. Calcola $f(x_0,y_0)$.
2. Calcola $f_x$, $f_y$ e valutale nel punto, un termine alla volta: molti termini si annullano.
3. Sostituisci nella formula e confronta con le opzioni.

::example esame 25 giugno 2025, fila A, n. 11: $f=y^3\sin(x^2+y^2)+x$, piano tangente in $(0,\sqrt\pi)$.
+ Valore: $f(0,\sqrt\pi)=\pi^{3/2}\sin\pi+0=0$.
+ $f_x$: $2xy^3\cos(x^2+y^2)+1$; in $x=0$ vale 1.
+ $f_y$: $3y^2\sin(x^2+y^2)+2y^4\cos(x^2+y^2)$; in $(0,\sqrt\pi)$: $0+2\pi^2\cos\pi=-2\pi^2$.
= $z=x-2\pi^2(y-\sqrt\pi)$.

::example base $f=xe^y$ in $(1,0)$.
+ Valori: $f=1$, $f_x=e^y=1$, $f_y=xe^y=1$.
= $z=1+(x-1)+y$, cioè $z=x+y$.

::trap
- Dimenticare il termine noto $f(x_0,y_0)$ o scrivere $x$ al posto di $(x-x_0)$.
- Usare la formula dove $f$ non è differenziabile: lì il piano tangente non esiste.

#lesson 2.6 Il quesito della funzione a tratti
goal: Rispondere con sicurezza al quesito presente in tutte le prove: continua? derivabile? differenziabile in $(0,0)$?

::idea
Il quesito ha sempre la stessa forma: $f=g(x,y)$ fuori dall'origine, $f(0,0)=a$, e quattro opzioni che combinano continuità, gradiente (spesso con il valore) e differenziabilità. Si risponde **in tre passi, in ordine**, fermandosi appena una proprietà fallisce.

::method Metodo in tre passi
1. **Continuità**: $\lim_{(0,0)}g=a$? Se no: non continua, quindi non differenziabile (la derivabilità va controllata a parte se un'opzione la nomina).
2. **Derivabilità**: $f_x(0,0)=\lim\frac{f(t,0)-a}{t}$, $f_y(0,0)=\lim\frac{f(0,t)-a}{t}$. Annota i valori: spesso un'opzione dice "$\nabla f(0,0)=\dots$".
3. **Differenziabilità**: studia $R(h,k)$. Per il no basta una direzione, di solito $k=h$ o $k=2h$.

::table
$d=p-q$ (gradi dopo gli equivalenti, con $a=0$) ¦ Di solito ¦ Esempio
$d\le0$ ¦ non continua ¦ $\frac{(x+y)^2}{x^2+y^2}$
$0<d<1$ ¦ continua, non differenziabile ($R\sim r^{d-1}$) ¦ $|xy|^{1/3}$
$d=1$ ¦ continua; derivabile; differenziabile quasi mai ¦ $\frac{x^5}{(x^2+3y^2)^2}$, $\sqrt{|xy|}$
$d>1$ ¦ differenziabile con $\nabla f=0$: basta $|f|\le Cr^d$ ¦ $\frac{x^3y^3-\ln(1+x^6)}{(4x^2+y^2)^2}$

::example medio 11 giugno 2025, A n. 10: $f=\dfrac{x^5}{(x^2+3y^2)^2}$, $f(0,0)=0$.
+ Continuità: $d=1$. $|x^5|\le r^5$, $(x^2+3y^2)^2\ge r^4$: $|f|\le r\to0$.
+ Parziali: $f(t,0)=t$: $f_x=1$. $f(0,t)=0$: $f_y=0$. $\nabla f=(1,0)$.
+ Differenziabilità: su $h=k=t$: $f(t,t)=\frac{t^5}{16t^4}=\frac t{16}$, il piano dà $t$: $R=\frac{t/16-t}{\sqrt2|t|}\not\to0$.
= **Continua ma non differenziabile.**

::example esame esempio gennaio 2026, n. 9: $f=\dfrac{\sin(x^2)y+x^3}{\sqrt{3x^2+y^2}}$, $f(0,0)=0$. Opzioni: non continua · $\nabla f=(\frac1{\sqrt3},0)$ · continua ma non differenziabile · nessuna.
+ Gradi: numeratore grado 3, denominatore 1: $d=2>1$.
+ Stima: $|\sin(x^2)y|\le r^3$, $|x^3|\le r^3$, $\sqrt{3x^2+y^2}\ge r$: $|f|\le2r^2$.
+ Conseguenze: $|f(t,0)/t|\le2|t|\to0$: $\nabla f=(0,0)$. $|R|\le2r\to0$: differenziabile.
= **Nessuna delle precedenti**: è differenziabile e nessuna opzione lo dice.

::example esame 9 luglio 2025, n. 12: $f=\dfrac{(x+y)^2}{x^2+y^2}$, $f(0,0)=1$. Opzioni: continua · non esistono le parziali · non differenziabile · nessuna.
+ Continuità: su $y=-x$ vale 0, su $y=0$ vale 1: non continua.
+ Parziali: $f(t,0)=1=f(0,0)$: $f_x(0,0)=0$; anche $f_y(0,0)=0$. Esistono.
= **Non differenziabile.** Il valore assegnato $a=1$ è decisivo: con $a=0$ le parziali non esisterebbero.

::trap
- Scegliere "continua e derivabile ma non differenziabile" senza aver controllato che le parziali esistano davvero.
- Se $f(t,t)$ coincide per caso con il piano, prova $k=2h$ o $k=-h$.
- In multipla "Nessuna delle precedenti" è giusta molto spesso: non scartarla per partito preso.

#lesson 2.7 Funzioni composte, derivate seconde, Schwarz
goal: Derivare $f$ lungo una curva con la regola della catena, calcolare l'Hessiana e sapere quando è simmetrica.

::thm Regola della catena lungo una curva
Se $\gamma(t)=(x(t),y(t))$ è derivabile in $t_0$ e $f$ è **differenziabile** in $\gamma(t_0)$, allora $g(t)=f(\gamma(t))$ è derivabile in $t_0$ e
$$g'(t_0)=\nabla f(\gamma(t_0))\cdot\gamma'(t_0)=f_x\,x'(t_0)+f_y\,y'(t_0).$$

::example medio 5 febbraio 2025, A n. 3 e B n. 5. Con $f\in C^1$: (A) $\gamma(t)=(2t+1,t^2)$, $g'(0)=2\partial_xf(1,0)$? (B) $\gamma(t)=((t-1)^2,3t-1)$, $g'(1)=2\partial_xf(0,2)+3\partial_yf(0,2)$?
+ A: $\gamma(0)=(1,0)$, $\gamma'(0)=(2,0)$: $g'(0)=2f_x(1,0)$. Vero.
+ B: $\gamma(1)=(0,2)$, $\gamma'(1)=(0,3)$: $g'(1)=3f_y(0,2)$. Falso: il termine $2\partial_xf$ sparisce perché $x'(1)=0$.
= A vero, B falso.

::def Derivate seconde e Hessiana
$$H_f(P)=\begin{pmatrix}f_{xx}&f_{xy}\\ f_{yx}&f_{yy}\end{pmatrix}.$$
$f\in C^2$ se tutte le derivate seconde esistono e sono continue.

::thm Teorema di Schwarz
Se $f_{xy}$ e $f_{yx}$ esistono in un intorno di $P$ e sono continue in $P$ (in particolare se $f\in C^2$), allora $f_{xy}(P)=f_{yx}(P)$: l'Hessiana è simmetrica.
Senza continuità può fallire: per $f=\frac{xy(x^2-y^2)}{x^2+y^2}$, $f(0,0)=0$, si ha $f_{xy}(0,0)=-1\ne f_{yx}(0,0)=1$.

::example base Hessiana di $f=x^3y-2y^2+e^x$.
+ Prime: $f_x=3x^2y+e^x$, $f_y=x^3-4y$.
+ Seconde: $f_{xx}=6xy+e^x$, $f_{xy}=f_{yx}=3x^2$, $f_{yy}=-4$.
= $H_f=\begin{pmatrix}6xy+e^x&3x^2\\3x^2&-4\end{pmatrix}$, simmetrica come previsto.

::trap
- $\nabla f$ va calcolato in $\gamma(t_0)$, $\gamma'$ in $t_0$.
- "Derivabile due volte in un punto ⇒ Hessiana simmetrica" è falso: serve la continuità delle miste.

#theory
?th
Q: Discuti le implicazioni tra continuità, derivabilità e differenziabilità. È vero che se esistono le derivate parziali in un punto allora $f$ è continua in quel punto?
A: Sia $f:A\to\mathbb R$, $A\subseteq\mathbb R^2$ aperto, $P_0\in A$. $f$ è **derivabile** in $P_0$ se esistono finite $f_x(P_0)$ e $f_y(P_0)$; è **differenziabile** se è derivabile e
$$\lim_{(h,k)\to(0,0)}\frac{f(x_0+h,y_0+k)-f(x_0,y_0)-f_x(P_0)h-f_y(P_0)k}{\sqrt{h^2+k^2}}=0.$$

**Implicazioni vere.** Se $f$ è differenziabile in $P_0$, allora è continua, derivabile, ammette tutte le derivate direzionali e $\frac{\partial f}{\partial v}(P_0)=\nabla f(P_0)\cdot v$. Se le parziali esistono in un intorno di $P_0$ e sono continue in $P_0$ (in particolare se $f\in C^1$), allora $f$ è differenziabile (teorema del differenziale totale).

**Implicazioni false.** Continuità e derivabilità non sono legate in nessun verso: $\sqrt{x^2+y^2}$ è continua in $(0,0)$ ma non derivabile; la derivabilità non implica la differenziabilità: $\sqrt{|xy|}$.

L'affermazione è **falsa**. Controesempio: $f=\frac{xy}{x^2+y^2}$, $f(0,0)=0$. Poiché $f(t,0)=f(0,t)=0$, si ha $f_x(0,0)=f_y(0,0)=0$; ma sulla retta $y=x$ vale $\frac12$, quindi $f$ non è continua. Le parziali guardano solo le due rette degli assi, la continuità riguarda tutti i punti vicini.
K: Definizioni di derivabile e differenziabile (con il limite del resto)
K: Conseguenze della differenziabilità, inclusa $\frac{\partial f}{\partial v}=\nabla f\cdot v$
K: Teorema del differenziale totale ($C^1$ ⇒ differenziabile)
K: Controesempi: $\sqrt{x^2+y^2}$ e $\sqrt{|xy|}$
K: Risposta "falso" con il controesempio $\frac{xy}{x^2+y^2}$ verificato

?th
Q: Enuncia il teorema di Schwarz.
A: Se $f$ ammette derivate seconde miste $f_{xy}$ e $f_{yx}$ in un intorno di $P_0$ e queste sono continue in $P_0$, allora $f_{xy}(P_0)=f_{yx}(P_0)$. In particolare, se $f\in C^2(A)$, la matrice Hessiana è simmetrica in ogni punto di $A$. Senza l'ipotesi di continuità la tesi può fallire: $f=\frac{xy(x^2-y^2)}{x^2+y^2}$, $f(0,0)=0$, ha $f_{xy}(0,0)=-1$ e $f_{yx}(0,0)=1$.
K: Ipotesi: miste esistenti in un intorno e continue in $P_0$
K: Tesi: $f_{xy}(P_0)=f_{yx}(P_0)$
K: Conseguenza: $C^2$ ⇒ Hessiana simmetrica
K: Controesempio senza continuità

?th
Q: Cosa dice il teorema del differenziale totale? Definisci il piano tangente al grafico.
A: Se $f$ ammette derivate parziali in un intorno di $P_0$, continue in $P_0$, allora $f$ è differenziabile in $P_0$. La condizione è sufficiente ma non necessaria. Se $f$ è differenziabile in $(x_0,y_0)$, il piano tangente al grafico nel punto $(x_0,y_0,f(x_0,y_0))$ è
$$z=f(x_0,y_0)+f_x(x_0,y_0)(x-x_0)+f_y(x_0,y_0)(y-y_0),$$
ed è il piano che approssima $f$ con errore $o(\sqrt{h^2+k^2})$.
K: Ipotesi: parziali in un intorno, continue nel punto
K: Tesi: differenziabile; sufficiente ma non necessaria
K: Formula del piano tangente con il termine noto
K: Il piano esiste solo dove $f$ è differenziabile

#chapter 3
title: Massimi e minimi
short: Massimi e minimi
place: Sella di Fermat
alt: 1300
weight: 1.6
program: Massimi e minimi relativi; condizione necessaria per i punti estremanti (teorema di Fermat); matrice hessiana (in due variabili); condizione sufficiente per i punti estremanti; ricerca di massimi e minimi assoluti in insiemi chiusi e limitati.
exam: In **tutte le prove** c'è almeno un quesito: trovare i punti critici e stabilirne la natura (il più frequente), una forma quadratica da classificare, oppure un Vero/Falso sulle definizioni. Nelle prove più recenti compaiono funzioni con **valori assoluti** e massimi e minimi su un **triangolo**.

#lesson 3.1 Definizioni, Fermat e punti critici
goal: Distinguere estremi locali e assoluti e trovare tutti i candidati: punti critici interni, punti non derivabili, frontiera.

::idea
Un massimo locale è la cima di una collina: basta che vicino non ci sia niente di più alto. Un massimo assoluto è il punto più alto di tutto il dominio. In cima a una collina liscia il piano tangente è orizzontale: in ogni direzione la pendenza è zero.

::def Massimo e minimo locale, assoluto, sella
$P_0\in A$ è di **massimo locale** per $f$ se esiste $r>0$ con $f(P)\le f(P_0)$ per ogni $P\in B_r(P_0)\cap A$ (minimo con $\ge$; **stretto** se la disuguaglianza è stretta per $P\ne P_0$). È di **massimo assoluto** se $f(P)\le f(P_0)$ per ogni $P\in A$. Un **punto di sella** è un punto critico che non è né di massimo né di minimo: in ogni intorno ci sono valori maggiori e minori.

::thm Teorema di Fermat
Sia $P_0$ **interno** ad $A$, di massimo o minimo locale per $f$, e sia $f$ **derivabile** in $P_0$. Allora $\nabla f(P_0)=0$.
Un punto in cui $f$ è derivabile e $\nabla f=0$ si chiama **critico** (o stazionario).

::method I candidati estremi
1. Punti critici interni: risolvi $f_x=0$, $f_y=0$.
2. Punti interni in cui $f$ non è derivabile (moduli, radici): Fermat non dice nulla, si studiano a parte.
3. Punti di frontiera, se il dominio la contiene: lì il gradiente non deve annullarsi.
Per il sistema: raccogli e usa l'annullamento del prodotto distinguendo i casi; ricava e sostituisci; con esponenziali ricorda $e^{(\dots)}\ne0$; somma o sottrai le equazioni.

::example esame 9 luglio 2025, A n. 8: punti critici di $f=e^{2x-2y}(x^2+y^2-3)$.
+ Derivate: $f_x=e^{2x-2y}\big(2(x^2+y^2-3)+2x\big)$, $f_y=e^{2x-2y}\big(-2(x^2+y^2-3)+2y\big)$.
+ Semplifica: $x^2+y^2-3+x=0$ e $-(x^2+y^2-3)+y=0$. Sommando: $x+y=0$.
+ Sostituisci: $2x^2-3+x=0\Rightarrow x=1$ oppure $x=-\frac32$.
= $(1,-1)$ e $(-\frac32,\frac32)$.

::exam
"$P_0$ è di massimo relativo se e solo se esiste $r$ tale che $f(P)>f(P_0)$ per ogni $P\in B_r(P_0)\cap\Omega$" è falso **due volte**: il verso è sbagliato e la disuguaglianza stretta non può valere in $P=P_0$ stesso (11 giugno 2025, entrambe le file).

::trap
- Fermat vale solo nei punti interni: su un insieme chiuso un estremo sul bordo può avere gradiente non nullo.
- $\nabla f=0$ non implica estremo: $x^2-y^2$ ha una sella nell'origine.
- Dividere per una variabile che può essere zero fa perdere soluzioni: raccogli.

#lesson 3.2 Forme quadratiche e matrici 2×2
goal: Classificare una matrice simmetrica 2×2 con determinante e primo elemento, anche con un parametro.

::idea
Vicino a un punto critico $f$ si comporta come una funzione di secondo grado, $q(h,k)=ah^2+2bhk+ck^2$. Il grafico è una coppa verso l'alto, una coppa verso il basso, una sella o una grondaia: classificare la forma vuol dire capire quale.

::def Forma quadratica associata a $H=\begin{pmatrix}a&b\\b&c\end{pmatrix}$
$q(h,k)=ah^2+2bhk+ck^2$. È **definita positiva** se $q>0$ per ogni $(h,k)\ne0$; **definita negativa** se $q<0$; **semidefinita** se $q\ge0$ (o $\le0$) e si annulla fuori dall'origine; **indefinita** se assume entrambi i segni.

::table
$\det H=ac-b^2$ ¦ $a$ ¦ Classe
$>0$ ¦ $>0$ ¦ definita positiva
$>0$ ¦ $<0$ ¦ definita negativa
$<0$ ¦ qualsiasi ¦ indefinita
$=0$ ¦ $a+c>0$ / $<0$ ¦ semidefinita positiva / negativa

::lab forme

::example esame 5 febbraio 2025, A n. 2 e B n. 3. (A) $a_{11}=4$, $a_{22}=9$, $\det\ne0$: definita positiva se e solo se $a_{12}<6$? (B) $a_{11}=-25$, $a_{22}=-4$: indefinita solo se $a_{12}>10$?
+ A: definita positiva $\iff 36-a_{12}^2>0\iff|a_{12}|<6$. Con $a_{12}=-7$: $a_{12}<6$ ma $\det=-13<0$. Falso.
+ B: indefinita $\iff100-a_{12}^2<0\iff|a_{12}|>10$. Con $a_{12}=-11$ è indefinita ma $a_{12}>10$ è falso. Falso.
= Il determinante contiene $a_{12}^2$: le condizioni corrette sono sempre su $|a_{12}|$.

::trap
- Il segno di $a$ conta solo se $\det>0$. Con $\det<0$ è indefinita qualunque sia $a$.

#lesson 3.3 Il test dell'Hessiana
goal: Stabilire la natura di ogni punto critico calcolando l'Hessiana nel punto.

::thm Condizione sufficiente ($f\in C^2$, $P_0$ interno, $\nabla f(P_0)=0$)
- $\det H_f(P_0)>0$ e $f_{xx}(P_0)>0$: **minimo** locale stretto.
- $\det H_f(P_0)>0$ e $f_{xx}(P_0)<0$: **massimo** locale stretto.
- $\det H_f(P_0)<0$: **sella**.
- $\det H_f(P_0)=0$: il test **non decide**.

::thm Condizione necessaria del secondo ordine
Se $P_0$ è di minimo locale (e $f\in C^2$), $H_f(P_0)$ è semidefinita positiva; se è di massimo, semidefinita negativa.

::example esame esempio gennaio 2026, n. 7: $f=y^3+x^2-6xy+3x+6y-10$. Opzioni: max in $(\frac{27}2,5)$, sella in $(\frac32,1)$ · ammette minimo assoluto · min in $(\frac{27}2,5)$, sella in $(\frac32,1)$ · nessuna.
+ Sistema: da $f_x=2x-6y+3=0$: $x=\frac{6y-3}2$. In $f_y=3y^2-6x+6=0$: $3y^2-18y+15=0\Rightarrow y=1,5$.
+ Hessiana: $H=\begin{pmatrix}2&-6\\-6&6y\end{pmatrix}$, $\det=12y-36$. In $y=1$: $-24$, sella. In $y=5$: $24>0$, $f_{xx}=2>0$, minimo.
+ Assoluto?: $f(0,y)=y^3+6y-10\to-\infty$ per $y\to-\infty$: nessun minimo assoluto.
= Risposta: **min in $(\frac{27}2,5)$, sella in $(\frac32,1)$**.

::note Scorciatoia nell'origine
Se $(0,0)$ è critico, l'Hessiana si legge dai termini di secondo grado $ax^2+2bxy+cy^2$: $H=\begin{pmatrix}2a&2b\\2b&2c\end{pmatrix}$. Esempio (11 giugno 2025): $x^2+xy+y^2-3x^2y^2$ dà $H=\begin{pmatrix}2&1\\1&2\end{pmatrix}$, minimo.

::trap
- Un minimo locale non è automaticamente assoluto: controlla il comportamento all'infinito.

#lesson 3.4 Casi dubbi e valori assoluti
goal: Stabilire la natura di un punto con determinante Hessiano nullo e trattare funzioni con valori assoluti.

::method Quando il test non decide: studio del segno
1. Scrivi $\Delta(P)=f(P)-f(P_0)$ e guarda vicino a $P_0$.
2. Se vedi $\Delta\ge0$ (quadrati, potenze pari, fattorizzazioni): minimo. Se $\Delta\le0$: massimo.
3. Se trovi due curve per $P_0$ su cui $\Delta$ ha segni opposti: sella. Prova assi, rette, curve dove si annulla un fattore.
4. Retta di punti critici (fattori come $x^2$): guarda il segno del fattore rimanente.

::example base $(0,0)$ per $f=x^4+y^4$, $g=x^2-y^4$, $h=x^2+y^3$.
+ f: $f\ge0=f(0,0)$: minimo stretto.
+ g: su $y=0$: $x^2>0$; su $x=0$: $-y^4<0$. Sella.
+ h: su $x=0$: $y^3$ cambia segno. Sella.
= Tutte e tre hanno $\det H(0,0)=0$: il test non poteva decidere.

::method Funzioni con valori assoluti
1. Nelle regioni in cui gli argomenti dei moduli hanno segno fisso, togli il modulo e cerca i punti critici.
2. Sulle curve di piega controlla con la definizione dove esistono le parziali: lì possono esserci altri punti critici.
3. Somme di quadrati come $(|x|-1)^2+\dots$: il minimo vale 0 dove tutti i quadrati si annullano, se un punto così esiste.

::example esame 5 febbraio 2025, A n. 8: quanti punti critici ha $f=|xy|(x+y-2)$?
+ Fuori dagli assi: $f=\pm xy(x+y-2)$: $y(2x+y-2)=0$, $x(x+2y-2)=0$ con $x,y\ne0$: $(\frac23,\frac23)$.
+ Asse x: in $(x_0,0)$ $f_x=0$; $\frac{f(x_0,t)}{t}=\frac{|x_0||t|(x_0+t-2)}{t}$ ha limite solo se $|x_0|(x_0-2)=0$: $x_0=0$ o $2$.
+ Asse y: allo stesso modo $(0,0)$ e $(0,2)$.
= $(0,0),(2,0),(0,2),(\frac23,\frac23)$: **4 punti critici**.

::trap
- Fermat non vede i punti non derivabili: $|x|+y^2$ ha minimo assoluto in $(0,0)$, che non è critico.
- Le rette non bastano: $f=x^2-3xy^2+2y^4=(x-y^2)(x-2y^2)$ ha minimo lungo ogni retta per l'origine ma è una sella (su $x=\frac32y^2$ è negativa).

#lesson 3.5 Massimi e minimi assoluti su un compatto
goal: Trovare massimo e minimo assoluti di una funzione continua su disco, rettangolo o triangolo.

::idea
Weierstrass garantisce che esistono. Possono stare dentro, in un punto critico, oppure sul bordo, dove il gradiente non è obbligato ad annullarsi. Si raccolgono tutti i candidati e si confrontano i valori: **non serve l'Hessiana**.

::method
1. Interno: punti critici dentro l'insieme (scarta quelli fuori), più eventuali punti di non derivabilità.
2. Frontiera: spezzala in pezzi e parametrizza: segmento $y=0$, $x\in[a,b]$; circonferenza $x=R\cos t$, $y=R\sin t$. Studia funzioni di una variabile su intervalli chiusi.
3. Includi sempre i vertici.
4. Confronta i valori: il più grande è il massimo, il più piccolo il minimo.

::example base $f=x^2+y^2-2x$ su $x^2+y^2\le4$.
+ Interno: $\nabla f=(2x-2,2y)=0\Rightarrow(1,0)$, $f=-1$.
+ Frontiera: $x=2\cos t$, $y=2\sin t$: $f=4-4\cos t\in[0,8]$.
= Minimo $-1$ in $(1,0)$; massimo $8$ in $(-2,0)$.

::example esame 15 luglio 2026, n. 13: $f=x^2-y^2+xy-x$ sul triangolo $x\ge0$, $y\ge0$, $x+y\le2$. Opzioni: non assume massimo sulla frontiera · $\min=-\frac15$, $\max=2$ · $\min=-2$, $\max=4$ · nessuna.
+ Interno: $2x+y-1=0$, $x-2y=0\Rightarrow(\frac25,\frac15)$, $f=-\frac15$.
+ Lato y = 0: $x^2-x$ su $[0,2]$: da $-\frac14$ a 2.
+ Lato x = 0: $-y^2$ su $[0,2]$: da $-4$ a 0.
+ Lato x + y = 2: $-x^2+5x-4$ su $[0,2]$, crescente: da $-4$ a 2.
= $\min=-4$ in $(0,2)$, $\max=2$ in $(2,0)$: **Nessuna delle precedenti**. La seconda opzione è la trappola di chi si ferma al punto critico interno.

::trap
- Dimenticare un vertice o un lato.
- Tenere un punto critico che sta fuori dall'insieme.
- Pensare che il minimo assoluto debba essere nel punto critico interno.

Q: Enuncia il teorema di Fermat in più variabili e spiega perché non dà una condizione sufficiente.
A: Sia $f:A\subseteq\mathbb R^n\to\mathbb R$ e $P_0$ un punto **interno** ad $A$ di massimo o di minimo locale per $f$. Se $f$ è **derivabile** in $P_0$, allora $\nabla f(P_0)=0$.

La condizione è solo necessaria: $f=xy$ (o $x^2-y^2$) ha $\nabla f(0,0)=0$, ma $(0,0)$ è una sella ($xy>0$ nel primo quadrante, $<0$ nel secondo). Per classificare un punto critico serve la condizione del secondo ordine; se $\det H=0$ si studia il segno di $f-f(P_0)$.

Le ipotesi contano: in un punto di frontiera ($f=x$ su $[0,1]^2$ ha minimo in $(0,0)$ con gradiente $(1,0)$) o in un punto non derivabile ($\sqrt{x^2+y^2}$ ha minimo in $(0,0)$) il gradiente può non essere nullo o non esistere.
K: Ipotesi: punto interno, estremo locale, $f$ derivabile
K: Tesi: $\nabla f(P_0)=0$
K: Controesempio al viceversa: una sella con gradiente nullo
K: Esempi che mostrano perché servono "interno" e "derivabile"

?th
Q: Enuncia la condizione sufficiente per gli estremi con la matrice Hessiana.
A: Sia $f\in C^2(A)$, $A$ aperto, $P_0\in A$ con $\nabla f(P_0)=0$. Se $H_f(P_0)$ è definita positiva ($\det>0$, $f_{xx}>0$), $P_0$ è di minimo locale stretto; se è definita negativa ($\det>0$, $f_{xx}<0$), di massimo locale stretto; se è indefinita ($\det<0$), è un punto di sella. Se $\det H_f(P_0)=0$ il test non permette di concludere: ad esempio $x^4+y^4$ (minimo) e $x^2-y^4$ (sella) hanno entrambe Hessiana con determinante nullo nell'origine.
K: Ipotesi: $f\in C^2$, punto critico interno
K: I tre casi con determinante e $f_{xx}$
K: Il caso $\det=0$: il test non decide, con esempi

?th
Q: Come si trovano massimo e minimo assoluti di una funzione su un insieme chiuso e limitato?
A: Se $f$ è continua e $K$ è compatto, massimo e minimo esistono per il teorema di Weierstrass. Si cercano i candidati: punti critici interni, punti interni di non derivabilità, punti della frontiera (estremi delle restrizioni di $f$ ai pezzi della frontiera, parametrizzati, vertici inclusi). Il massimo e il minimo assoluti sono il più grande e il più piccolo dei valori di $f$ nei candidati; non serve l'Hessiana.

K: Candidati: critici interni, non derivabili, frontiera con vertici

#lesson 4.1 Funzioni vettoriali e matrice jacobiana
goal: Riconoscere dominio e codominio di $F:\mathbb R^n\to\mathbb R^m$ e scrivere la Jacobiana senza confondere righe e colonne.

::idea
Una funzione vettoriale restituisce più numeri insieme: la velocità del vento in ogni punto, o le coordinate cartesiane date quelle polari. Limiti e continuità si studiano **componente per componente**. Mettendo un gradiente sotto l'altro si ottiene la Jacobiana, che fa il lavoro della derivata.

::def Funzione vettoriale, campo scalare, campo vettoriale
$F:A\subseteq\mathbb R^n\to\mathbb R^m$, $F=(F_1,\dots,F_m)$. Il dominio è l'intersezione dei domini delle componenti. Con $m=1$: **campo scalare**; con $m=n$: **campo vettoriale**; con $n=1$: **curva**. $F$ è continua se e solo se lo sono tutte le componenti.

::def Matrice jacobiana
$J_F(x_0)$ è la matrice $m\times n$ con $\frac{\partial F_i}{\partial x_j}(x_0)$ in riga $i$, colonna $j$: **righe = componenti, colonne = variabili**. La riga $i$ è $\nabla F_i$. Per $m=1$ è il gradiente; per $m=n$ è quadrata e il suo determinante si chiama **Jacobiano**. Se $F$ è differenziabile:
$$F(x_0+h)=F(x_0)+J_F(x_0)\,h+o(\|h\|).$$

::example base Jacobiana di $F(x,y)=(x^2y,\ e^{x+y},\ \sin(xy))$.
+ Formato: 3 componenti, 2 variabili: $3\times2$.
= $J_F=\begin{pmatrix}2xy&x^2\\e^{x+y}&e^{x+y}\\y\cos(xy)&x\cos(xy)\end{pmatrix}$.

::example medio $F(x,y)=(x^2-y^2,\ 2xy)$: Jacobiana e Jacobiano in $(1,1)$.
+ Jacobiana: $J=\begin{pmatrix}2x&-2y\\2y&2x\end{pmatrix}$, $\det J=4x^2+4y^2$.
= In $(1,1)$: $\det J=8$: vicino a $(1,1)$ le aree vengono moltiplicate circa per 8.

::trap
- Una funzione $\mathbb R^2\to\mathbb R^3$ ha Jacobiana $3\times2$, non $2\times3$.
- Il determinante esiste solo per Jacobiane quadrate.

#lesson 4.2 Regola della catena con le matrici
goal: Derivare una composizione con il prodotto delle Jacobiane e riconoscere i due casi più frequenti.

::thm Regola della catena
Se $f:\mathbb R^n\to\mathbb R^m$ è differenziabile in $x_0$ e $g:\mathbb R^m\to\mathbb R^p$ è differenziabile in $f(x_0)$, allora $g\circ f$ è differenziabile in $x_0$ e
$$J_{g\circ f}(x_0)=J_g\big(f(x_0)\big)\cdot J_f(x_0).$$
Formati: $(p\times n)=(p\times m)\cdot(m\times n)$. $J_g$ va calcolata nel **punto immagine** $f(x_0)$.

::method I due casi più frequenti
1. Campo scalare lungo una curva: $\frac{d}{dt}f(\gamma(t))=\nabla f(\gamma(t))\cdot\gamma'(t)$.
2. Cambio di variabili $F(u,v)=f(x(u,v),y(u,v))$: $F_u=f_x\,x_u+f_y\,y_u$, $\ F_v=f_x\,x_v+f_y\,y_v$.

::example medio $f(x,y)=(x+y,\ xy)$, $g(u,v)=u^2+v$: $\nabla(g\circ f)(1,2)$.
+ Punto immagine: $f(1,2)=(3,2)$.
+ Jacobiane: $J_g=(2u,\ 1)$ in $(3,2)$: $(6,1)$. $J_f=\begin{pmatrix}1&1\\y&x\end{pmatrix}$ in $(1,2)$: $\begin{pmatrix}1&1\\2&1\end{pmatrix}$.
+ Prodotto: $(6,1)\begin{pmatrix}1&1\\2&1\end{pmatrix}=(8,7)$.
= Controllo: $h=(x+y)^2+xy$, $h_x=2(x+y)+y=8$, $h_y=2(x+y)+x=7$.

::example esame In polari: $F(\rho,\theta)=f(\rho\cos\theta,\rho\sin\theta)$.
+ Catena: $x_\rho=\cos\theta$, $y_\rho=\sin\theta$, $x_\theta=-\rho\sin\theta$, $y_\theta=\rho\cos\theta$.
= $F_\rho=f_x\cos\theta+f_y\sin\theta$, $\ F_\theta=-f_x\rho\sin\theta+f_y\rho\cos\theta$.

::trap
- Calcolare $J_g$ nel punto di partenza invece che in $f(x_0)$.
- Moltiplicare nell'ordine sbagliato: prima la funzione esterna, poi l'interna.

#lesson 4.3 Coordinate polari ed ellittiche
goal: Descrivere dischi, corone e settori in polari, ricordare lo Jacobiano $\rho$ e adattarlo alle ellissi.

::idea
Un punto si individua con la distanza $\rho$ dall'origine e l'angolo $\theta$. I cerchi centrati nell'origine diventano $\rho=$ costante: un disco o una corona diventa un **rettangolo**. Ma le celle lontane dall'origine sono più grandi: per questo compare il fattore $\rho$.

::def Coordinate polari ed ellittiche
$$\Phi(\rho,\theta)=(\rho\cos\theta,\ \rho\sin\theta),\quad \rho\ge0,\ \theta\in[0,2\pi),\qquad \det J_\Phi=\rho .$$
Ellittiche: $\Phi(\rho,\theta)=(a\rho\cos\theta,\ b\rho\sin\theta)$, $\det J_\Phi=ab\rho$: trasformano $\frac{x^2}{a^2}+\frac{y^2}{b^2}\le r^2$ in $\rho\le r$.

::lab polari

::table
Insieme ¦ In polari
$x^2+y^2\le R^2$ ¦ $0\le\rho\le R$, $\theta\in[0,2\pi]$
$y\ge0$ ¦ $\theta\in[0,\pi]$
$x\ge0,\ y\ge x$ ¦ $\theta\in[\frac\pi4,\frac\pi2]$
$\lvert y\rvert<\lvert x\rvert$ ¦ $\theta\in(-\frac\pi4,\frac\pi4)\cup(\frac{3\pi}4,\frac{5\pi}4)$
$x^2+y^2\le2x$ ¦ $0\le\rho\le2\cos\theta$, $\theta\in[-\frac\pi2,\frac\pi2]$

::example esame 22 gennaio 2025, A n. 4 e B n. 2: $E_r=\{\frac{x^2}{9}+\frac{y^2}{4}\le r^2\}$, $B_r$ disco di raggio $r$. È corretta per $\lambda=6$ la formula $\iint_{E_2\setminus E_1}e^{\frac{x^2}9+\frac{y^2}4}=\lambda\iint_{B_2\setminus B_1}e^{x^2+y^2}$? (Fila B: $\frac{x^2}9+y^2$ e $\lambda=9$.)
+ Cambio: $x=3u$, $y=2v$: $\frac{x^2}9+\frac{y^2}4=u^2+v^2$, e $E_2\setminus E_1$ diventa $B_2\setminus B_1$.
+ Jacobiano: $\det\begin{pmatrix}3&0\\0&2\end{pmatrix}=6$: $dx\,dy=6\,du\,dv$.
= Fila A: Vero. Fila B: $x=3u$, $y=v$, Jacobiano 3: $\lambda=9$ è Falso.

::trap
- Dimenticare il fattore $\rho$ (o $ab\rho$): è l'errore più costoso negli integrali.
- Con $\frac{x^2}{9}$ il semiasse è 3, non 9: lo Jacobiano è $ab$, non $a^2b^2$.

#lesson 4.4 Coordinate cilindriche e sferiche
goal: Passare in cilindriche e sferiche, ricordare i due Jacobiani e descrivere cilindri, sfere e coni.

::def Cilindriche
$$(x,y,z)=(\rho\cos\theta,\ \rho\sin\theta,\ z),\qquad \det J=\rho .$$
Sono le polari nel piano $xy$, con $z$ invariata: adatte a cilindri e solidi di rotazione attorno all'asse $z$.

::def Sferiche
$$(x,y,z)=(r\sin\varphi\cos\theta,\ r\sin\varphi\sin\theta,\ r\cos\varphi),\qquad \det J=r^2\sin\varphi ,$$
con $r\ge0$, $\varphi\in[0,\pi]$ (angolo **dall'asse $z$** positivo), $\theta\in[0,2\pi)$. Adatte a sfere e coni con vertice nell'origine.

::example medio Il "cono gelato" $C=\{z\ge\sqrt{x^2+y^2},\ x^2+y^2+z^2\le4\}$.
+ Cono: in sferiche $\sqrt{x^2+y^2}=r\sin\varphi$, $z=r\cos\varphi$: $\cos\varphi\ge\sin\varphi\iff\varphi\le\frac\pi4$.
= $r\in[0,2]$, $\varphi\in[0,\frac\pi4]$, $\theta\in[0,2\pi)$.

::example base Cilindro e semisfera.
+ Cilindro: $\{x^2+y^2\le4,\ 0\le z\le3\}$: $\rho\in[0,2]$, $\theta\in[0,2\pi)$, $z\in[0,3]$.
+ Semisfera: $\{x^2+y^2+z^2\le1,\ z\ge0\}$: $r\in[0,1]$, $\varphi\in[0,\frac\pi2]$, $\theta\in[0,2\pi)$.
= In entrambi i casi gli estremi sono costanti: l'integrale si spezza in un prodotto.

::trap
- $\varphi$ va da 0 a $\pi$, non fino a $2\pi$: la metà inferiore è $\varphi\in[\frac\pi2,\pi]$.
- Alcuni testi scambiano i nomi $\varphi$ e $\theta$: guarda quale angolo parte dall'asse $z$.

#lesson 4.5 Gradiente, divergenza, rotore
goal: Calcolare i tre operatori e sapere sempre se il risultato è uno scalare o un vettore.

::idea
$\nabla=(\partial_x,\partial_y,\partial_z)$ si usa come un vettore "che deriva". Applicato a uno scalare dà il gradiente; prodotto scalare con un campo dà la **divergenza** (quanto il campo esce da un punto); prodotto vettoriale dà il **rotore** (quanto il campo fa girare).

::def I tre operatori
Gradiente (S → V): $\nabla f=(f_x,f_y,f_z)$. Divergenza (V → S): $\operatorname{div}F=P_x+Q_y+R_z$ per $F=(P,Q,R)$.
Rotore (V → V):
$$\operatorname{rot}F=\nabla\times F=(R_y-Q_z,\ P_z-R_x,\ Q_x-P_y).$$
Nel piano, con $F=(P,Q)$, il rotore è lo scalare $Q_x-P_y$. Laplaciano: $\Delta f=\operatorname{div}\nabla f=f_{xx}+f_{yy}+f_{zz}$. Per $f,F\in C^2$: $\operatorname{rot}(\nabla f)=0$, $\operatorname{div}(\operatorname{rot}F)=0$. Rotore nullo: **irrotazionale**.

::method Il "tipo" di un'espressione
1. Scrivi sotto ogni pezzo S (scalare) o V (vettore).
2. Regole: $\nabla(S)=V$, $\operatorname{div}(V)=S$, $\operatorname{rot}(V)=V$, $V\cdot V=S$, $S\,V=V$, $S\pm S=S$, $V\pm V=V$.
3. Operazioni illegali (div di uno scalare, $S+V$) rendono l'espressione priva di senso. Il vettore posizione $x=(x,y,z)$ è V con $\operatorname{div}x=3$.

::example esame 22 gennaio 2025, A n. 5 e B n. 1. (A) $\Phi=\operatorname{div}(\nabla f)-x\cdot\nabla f$: vale $\Phi:\mathbb R^3\to\mathbb R^3$? (B) $\Phi=x\cdot\nabla f+\operatorname{div}(x-\nabla f)$: vale $\Phi:\mathbb R^3\to\mathbb R$?
+ A: $\operatorname{div}\nabla f$ è S; $x\cdot\nabla f$ è V·V = S. S − S = S: scalare. Falso.
+ B: $x\cdot\nabla f$ è S; $x-\nabla f$ è V e la sua divergenza è S ($=3-\Delta f$). S + S = S. Vero.
= A falso, B vero.

::example esame 9 luglio 2025, A n. 9: $F=\Big(\frac{Ax-By}{x^2+y^2},\frac{Cx+Dy}{x^2+y^2}\Big)$ è irrotazionale quando?
+ Q_x: $\frac{C(y^2-x^2)-2Dxy}{(x^2+y^2)^2}$.
+ P_y: $\frac{B(y^2-x^2)-2Axy}{(x^2+y^2)^2}$.
+ Rotore: $Q_x-P_y=\frac{(C-B)(y^2-x^2)+2(A-D)xy}{(x^2+y^2)^2}$.
= Nullo ovunque se e solo se $A=D$ e $B=C$. Irrotazionale non vuol dire conservativo: capitolo 7.

::trap
- La divergenza è un numero: $\operatorname{div}(x,y,z)=3$, non $(1,1,1)$.
- Nel rotore la terza componente è $Q_x-P_y$, non $P_y-Q_x$.

#quiz
