?th
Q: Definisci la matrice jacobiana di una funzione vettoriale ed enuncia la regola della catena.
A: Sia $F:A\subseteq\mathbb R^n\to\mathbb R^m$, $F=(F_1,\dots,F_m)$, con componenti derivabili in $x_0$. La matrice jacobiana $J_F(x_0)$ è la matrice $m\times n$ il cui elemento $(i,j)$ è $\frac{\partial F_i}{\partial x_j}(x_0)$: la riga $i$ è il gradiente di $F_i$. Se $F$ è differenziabile, $F(x_0+h)=F(x_0)+J_F(x_0)h+o(\|h\|)$.

Regola della catena: se $f:\mathbb R^n\to\mathbb R^m$ è differenziabile in $x_0$ e $g:\mathbb R^m\to\mathbb R^p$ è differenziabile in $f(x_0)$, allora $g\circ f$ è differenziabile in $x_0$ e $J_{g\circ f}(x_0)=J_g(f(x_0))\,J_f(x_0)$. Caso particolare: $\frac{d}{dt}f(\gamma(t))=\nabla f(\gamma(t))\cdot\gamma'(t)$.
K: Jacobiana $m\times n$: righe = componenti, colonne = variabili
K: Approssimazione lineare con $o(\|h\|)$
K: Catena: prodotto $J_g(f(x_0))J_f(x_0)$ nell'ordine giusto, $J_g$ nel punto immagine
K: Caso particolare lungo una curva

?th
Q: Scrivi le coordinate polari, cilindriche e sferiche con i loro Jacobiani.
A: Polari: $(\rho\cos\theta,\rho\sin\theta)$, $\rho\ge0$, $\theta\in[0,2\pi)$, Jacobiano $\rho$. Cilindriche: $(\rho\cos\theta,\rho\sin\theta,z)$, Jacobiano $\rho$. Sferiche: $(r\sin\varphi\cos\theta,\ r\sin\varphi\sin\theta,\ r\cos\varphi)$ con $r\ge0$, $\varphi\in[0,\pi]$ angolo dall'asse $z$, $\theta\in[0,2\pi)$, Jacobiano $r^2\sin\varphi$. Ellittiche: $(a\rho\cos\theta,b\rho\sin\theta)$, Jacobiano $ab\rho$.
K: Polari con Jacobiano $\rho$
K: Cilindriche con Jacobiano $\rho$
K: Sferiche con Jacobiano $r^2\sin\varphi$ e $\varphi\in[0,\pi]$

?th
Q: Definisci gradiente, divergenza e rotore, indicando dominio e codominio.
A: Sia $f:\mathbb R^3\to\mathbb R$ derivabile e $F=(P,Q,R):\mathbb R^3\to\mathbb R^3$ derivabile.
$$\nabla f=(f_x,f_y,f_z):\mathbb R^3\to\mathbb R^3,\qquad \operatorname{div}F=P_x+Q_y+R_z:\mathbb R^3\to\mathbb R,$$
$$\operatorname{rot}F=(R_y-Q_z,\ P_z-R_x,\ Q_x-P_y):\mathbb R^3\to\mathbb R^3.$$
Se $f$ e $F$ sono $C^2$: $\operatorname{rot}\nabla f=0$ e $\operatorname{div}\operatorname{rot}F=0$.
K: Gradiente: scalare → vettore
K: Divergenza: vettore → scalare
K: Rotore con le tre componenti corrette
K: Le identità $\operatorname{rot}\nabla f=0$, $\operatorname{div}\operatorname{rot}F=0$

#lesson 5.1 Integrale doppio e teorema di Fubini
goal: Calcolare un integrale doppio su un rettangolo come due integrali in una variabile, uno dentro l'altro.

::idea
$\iint_D f\,dx\,dy$ è il **volume con segno** sotto il grafico di $f$ sopra $D$ (con $f=1$ è l'area di $D$). Si calcola a fette: fissi $x$, integri in $y$ la fetta, poi sommi le fette in $x$. Fubini dice che l'ordine non conta.

::thm Teorema di Fubini su un rettangolo
Se $f$ è continua su $R=[a,b]\times[c,d]$, allora
$$\iint_R f\,dx\,dy=\int_a^b\!\left(\int_c^d f(x,y)\,dy\right)dx=\int_c^d\!\left(\int_a^b f(x,y)\,dx\right)dy .$$
Se $f(x,y)=g(x)h(y)$, l'integrale è il prodotto $\int_a^b g\cdot\int_c^d h$.

::example base $\iint_{[0,1]\times[0,2]}(x+y)\,dx\,dy$.
+ Interno: $\int_0^2(x+y)\,dy=2x+2$.
+ Esterno: $\int_0^1(2x+2)\,dx=1+2$.
= Risultato: 3.

::example medio $\iint_{[0,1]^2}xe^{xy}\,dx\,dy$: quale ordine?
+ Scelta: integrando prima in $y$ la primitiva è immediata: $\int_0^1xe^{xy}\,dy=\big[e^{xy}\big]_0^1=e^x-1$.
+ Esterno: $\int_0^1(e^x-1)\,dx=e-2$.
= $e-2$. Con l'altro ordine servirebbe un'integrazione per parti: scegli l'ordine che rende facile l'integrale interno.

::trap
- Gli estremi dell'integrale interno possono dipendere dalla variabile esterna, mai il contrario.
- Il prodotto di integrali vale solo se l'integranda si separa **e** il dominio è un rettangolo.

#lesson 5.2 Domini normali e scambio dell'ordine
goal: Descrivere un dominio come normale rispetto a $x$ o a $y$, scrivere la formula di riduzione e saper scambiare l'ordine.

::def Dominio normale
$D$ è **normale rispetto all'asse $x$** (o $y$-semplice) se $D=\{a\le x\le b,\ g_1(x)\le y\le g_2(x)\}$ con $g_1\le g_2$ continue; **normale rispetto all'asse $y$** se $D=\{c\le y\le d,\ h_1(y)\le x\le h_2(y)\}$.

::thm Formula di riduzione
Se $f$ è continua su $D=\{a\le x\le b,\ g_1(x)\le y\le g_2(x)\}$:
$$\iint_D f\,dx\,dy=\int_a^b\left(\int_{g_1(x)}^{g_2(x)}f(x,y)\,dy\right)dx .$$
Con $f=1$: $\text{area}(D)=\int_a^b\big(g_2(x)-g_1(x)\big)\,dx$.

::lab fubini

::method Scambiare l'ordine di integrazione
1. Leggi il dominio dagli estremi e **disegnalo**.
2. Trova gli estremi in $y$ (minimo e massimo su tutto $D$).
3. Per $y$ fissato, leggi sul disegno da dove a dove va $x$: $h_1(y)\le x\le h_2(y)$.
4. Riscrivi l'integrale. Serve quando la primitiva nell'ordine dato non è elementare, come $e^{y^2}$.

::example esame $\displaystyle\int_0^1\!\int_x^1e^{y^2}\,dy\,dx$.
+ Problema: $e^{y^2}$ non ha primitiva elementare in $y$.
+ Dominio: $0\le x\le1$, $x\le y\le1$: il triangolo sopra la bisettrice. Per $y\in[0,1]$ fissato: $0\le x\le y$.
+ Scambio: $\int_0^1\!\int_0^ye^{y^2}\,dx\,dy=\int_0^1ye^{y^2}\,dy=\Big[\frac{e^{y^2}}2\Big]_0^1$.
= $\frac{e-1}{2}$.

::trap
- Nello scambio gli estremi cambiano: non basta invertire $dx\,dy$.
- In un dominio normale rispetto a $x$, $g_1$ è il bordo **inferiore** e $g_2$ quello superiore: disegna per non scambiarli.

#lesson 5.3 Cambio di variabili e coordinate polari
goal: Usare il cambio di variabili, soprattutto le polari, senza perdere lo Jacobiano e con gli angoli giusti.

::thm Formula del cambiamento di variabili
Sia $\Phi:D'\to D$ biiettiva, $C^1$, con $\det J_\Phi\ne0$ (salvo insiemi di area nulla). Allora
$$\iint_D f(x,y)\,dx\,dy=\iint_{D'}f\big(\Phi(u,v)\big)\,\big|\det J_\Phi(u,v)\big|\,du\,dv .$$
In polari $dx\,dy=\rho\,d\rho\,d\theta$; in ellittiche $dx\,dy=ab\rho\,d\rho\,d\theta$.

::method Integrale in polari
1. Disegna il dominio e traduci ogni condizione in condizioni su $\rho$ e $\theta$.
2. Sostituisci $x=\rho\cos\theta$, $y=\rho\sin\theta$: spesso $x^2+y^2$ diventa $\rho^2$.
3. Moltiplica per $\rho$.
4. Se gli estremi sono costanti e la funzione si separa, è un prodotto di due integrali.

::example esame 22 gennaio 2025, n. 9: $I=\iint_D\ln\big((x^2+y^2)^2\big)\,dx\,dy$, $D=\{1\le x^2+y^2\le4,\ |y|<|x|\}$.
+ Integranda: $\ln(\rho^4)=4\ln\rho$.
+ Angoli: $|y|<|x|$ sono due settori di ampiezza $\frac\pi2$ ciascuno: misura totale $\pi$.
+ Calcolo: $I=\pi\int_1^24\rho\ln\rho\,d\rho=4\pi\Big[\frac{\rho^2}2\ln\rho-\frac{\rho^2}4\Big]_1^2=4\pi\big(2\ln2-\frac34\big)$.
= $I=\pi(8\ln2-3)$.

::example medio $\iint_D x\,dx\,dy$ con $D=\{1\le x^2+y^2\le4,\ x\ge0\}$.
+ Polari: $\theta\in[-\frac\pi2,\frac\pi2]$, $\rho\in[1,2]$, $x\,dx\,dy=\rho\cos\theta\cdot\rho\,d\rho\,d\theta$.
+ Calcolo: $\int_{-\pi/2}^{\pi/2}\cos\theta\,d\theta\cdot\int_1^2\rho^2\,d\rho=2\cdot\frac73$.
= $\frac{14}3$. Le opzioni trappola: $\frac73$ (dimentica che $\int\cos\theta=2$) e 0 (usa $\theta\in[0,2\pi]$).

::lab polari

::trap
- Il fattore $\rho$ è l'errore più costoso: area del disco di raggio 3 è $9\pi$; senza $\rho$ viene $6\pi$, ed è proprio un'opzione tipica.
- Nel cambio generale si usa il **valore assoluto** dello Jacobiano.

#lesson 5.4 Integrali tripli: per fili e per strati
goal: Ridurre un integrale triplo integrando prima lungo una retta (fili) o prima su una sezione piana (strati).

::idea
Stessa idea dei doppi, con una dimensione in più. **Per fili**: per ogni $(x,y)$ dell'ombra $D$ sul piano integri in $z$ da $z_1(x,y)$ a $z_2(x,y)$. **Per strati**: per ogni quota $z$ integri sulla sezione $E_z$, poi sommi in $z$.

::thm Formule di riduzione
Per fili: $E=\{(x,y)\in D,\ z_1(x,y)\le z\le z_2(x,y)\}$:
$$\iiint_E f=\iint_D\left(\int_{z_1(x,y)}^{z_2(x,y)}f\,dz\right)dx\,dy .$$
Per strati: $E=\{z\in[c,d],\ (x,y)\in E_z\}$: $\iiint_E f=\int_c^d\left(\iint_{E_z}f\,dx\,dy\right)dz$. Con $f$ dipendente solo da $z$: $\int_c^d f(z)\,\text{area}(E_z)\,dz$.

::example base Volume del tetraedro $T=\{x,y,z\ge0,\ x+y+z\le1\}$.
+ Fili: per $(x,y)$ nel triangolo $x+y\le1$, $z$ va da 0 a $1-x-y$.
+ Calcolo: $\int_0^1\!\int_0^{1-x}(1-x-y)\,dy\,dx=\int_0^1\frac{(1-x)^2}2dx$.
= $\frac16$.

::example medio Volume di $E=\{x^2+y^2\le z\le1\}$ per strati.
+ Sezione: a quota $z\in[0,1]$, $E_z$ è il disco $x^2+y^2\le z$, di area $\pi z$.
+ Calcolo: $\int_0^1\pi z\,dz$.
= $\frac\pi2$. Per strati è immediato perché l'area della sezione è nota.

::trap
- Per fili, l'ombra $D$ è la proiezione di $E$ sul piano $xy$: trovala intersecando le superfici di bordo.
- Per strati conviene quando l'integranda dipende solo da $z$ e le sezioni sono figure note.

#lesson 5.5 Cilindriche e sferiche negli integrali tripli
goal: Scegliere le coordinate giuste per cilindri, coni e sfere e integrare con lo Jacobiano corretto.

::method Quale sistema scegliere
1. Simmetria attorno all'asse $z$, sezioni circolari, paraboloidi, cilindri: **cilindriche**, $dx\,dy\,dz=\rho\,d\rho\,d\theta\,dz$.
2. Sfere, palle, coni con vertice nell'origine: **sferiche**, $dx\,dy\,dz=r^2\sin\varphi\,dr\,d\varphi\,d\theta$.
3. Traduci ogni condizione del dominio nelle nuove variabili, poi moltiplica per lo Jacobiano.

::example medio Volume del cono gelato $\{z\ge\sqrt{x^2+y^2},\ x^2+y^2+z^2\le4\}$.
+ Dominio: $r\in[0,2]$, $\varphi\in[0,\frac\pi4]$, $\theta\in[0,2\pi]$ (capitolo 4).
+ Calcolo: $\int_0^{2\pi}d\theta\int_0^{\pi/4}\sin\varphi\,d\varphi\int_0^2r^2dr=2\pi\left(1-\frac{\sqrt2}2\right)\frac83$.
= $\frac{8\pi}3(2-\sqrt2)$.

::example base $\iiint_{x^2+y^2+z^2\le1}(x^2+y^2+z^2)$.
+ Sferiche: $r^2\cdot r^2\sin\varphi$.
+ Calcolo: $2\pi\cdot2\cdot\int_0^1r^4dr=\frac{4\pi}5$.
= $\frac{4\pi}5$.

::trap
- In sferiche $\int_0^\pi\sin\varphi\,d\varphi=2$, non 0: l'angolo $\varphi$ va solo fino a $\pi$.
- Lo Jacobiano delle sferiche è $r^2\sin\varphi$: con $r\sin\varphi$ il volume della palla viene sbagliato.

#lesson 5.6 Simmetrie, masse e baricentri
goal: Riconoscere a colpo d'occhio un integrale nullo per simmetria e calcolare massa e baricentro di una lamina o di un solido.

::thm Simmetrie
Se $D$ è simmetrico rispetto all'asse $y$ (cioè $(x,y)\in D\Rightarrow(-x,y)\in D$) e $f$ è **dispari in $x$** ($f(-x,y)=-f(x,y)$), allora $\iint_Df=0$. Se $f$ è pari in $x$, l'integrale è il doppio di quello sulla metà $x\ge0$. Analogo per $y$ e, nei tripli, per $z$.

::def Massa e baricentro
Lamina $D$ di densità $\mu(x,y)$: massa $m=\iint_D\mu$; baricentro
$$\bar x=\frac1m\iint_D x\,\mu,\qquad \bar y=\frac1m\iint_D y\,\mu .$$
Con densità costante il baricentro dipende solo dalla forma e sta su ogni asse di simmetria.

::example medio Baricentro del semidisco $\{x^2+y^2\le R^2,\ y\ge0\}$ omogeneo.
+ Simmetria: $\bar x=0$.
+ Calcolo: $\iint y=\int_0^\pi\!\int_0^R\rho\sin\theta\cdot\rho\,d\rho\,d\theta=\frac{2R^3}3$; area $\frac{\pi R^2}2$.
= $\bar y=\frac{4R}{3\pi}$.

::trap
- La simmetria va verificata **sia** sul dominio **sia** sulla funzione.
- Il baricentro di un semidisco non è a metà altezza: $\frac{4R}{3\pi}\approx0{,}42R$.

?th
Q: Enuncia il teorema di riduzione (Fubini) per gli integrali doppi su un dominio normale.
A: Sia $D=\{(x,y):a\le x\le b,\ g_1(x)\le y\le g_2(x)\}$ con $g_1\le g_2$ continue su $[a,b]$ (dominio normale rispetto all'asse $x$) e sia $f$ continua su $D$. Allora $f$ è integrabile su $D$ e
$$\iint_Df(x,y)\,dx\,dy=\int_a^b\left(\int_{g_1(x)}^{g_2(x)}f(x,y)\,dy\right)dx .$$
Analogamente per un dominio normale rispetto all'asse $y$. Su un rettangolo l'ordine di integrazione si può scambiare. Con $f=1$ si ottiene l'area di $D$.
K: Definizione di dominio normale con $g_1\le g_2$ continue
K: Ipotesi: $f$ continua su $D$
K: Formula con l'integrale interno dagli estremi variabili
K: Caso del rettangolo e scambio dell'ordine

?th
Q: Enuncia la formula del cambiamento di variabili negli integrali doppi e scrivila in coordinate polari.
A: Sia $\Phi:D'\to D$ una trasformazione biiettiva di classe $C^1$ con $\det J_\Phi\ne0$ in $D'$ (salvo insiemi di area nulla), e sia $f$ continua su $D$. Allora
$$\iint_Df(x,y)\,dx\,dy=\iint_{D'}f(\Phi(u,v))\,|\det J_\Phi(u,v)|\,du\,dv .$$
In polari $\Phi(\rho,\theta)=(\rho\cos\theta,\rho\sin\theta)$, $|\det J_\Phi|=\rho$: $\iint_Df=\iint_{D'}f(\rho\cos\theta,\rho\sin\theta)\,\rho\,d\rho\,d\theta$. Esempio: $\iint_{x^2+y^2\le1}(x^2+y^2)=\int_0^{2\pi}\!\int_0^1\rho^3\,d\rho\,d\theta=\frac\pi2$.
K: Ipotesi: $\Phi$ biiettiva, $C^1$, Jacobiano non nullo
K: Formula con il valore assoluto del determinante
K: Caso polari con il fattore $\rho$
K: Un esempio calcolato

?th
Q: Come si calcolano massa e baricentro di una lamina piana? Come si usano le simmetrie?
A: Una lamina che occupa $D$ con densità superficiale $\mu(x,y)\ge0$ ha massa $m=\iint_D\mu\,dx\,dy$ e baricentro $\bar x=\frac1m\iint_Dx\mu$, $\bar y=\frac1m\iint_Dy\mu$. Se $D$ è simmetrico rispetto all'asse $y$ e la funzione integranda è dispari in $x$, l'integrale è nullo; in particolare, con densità simmetrica, il baricentro sta sull'asse di simmetria. Esempio: semidisco omogeneo di raggio $R$, $\bar x=0$ e $\bar y=\frac{4R}{3\pi}$.
K: Formula della massa
K: Formule del baricentro

#chapter 6
title: Curve e integrali curvilinei
short: Curve
place: Cresta Jordan
alt: 1950
weight: 0.9
program: Curve parametriche nel piano e nello spazio; curve regolari, chiuse, semplici; vettore e versore tangente; lunghezza di una curva; curve cartesiane e in coordinate polari; integrale curvilineo di prima specie; massa e baricentro di un filo.
exam: Si presta a Vero/Falso sulle definizioni (regolare, chiusa, semplice; invarianza per riparametrizzazione) e a multiple di calcolo: una lunghezza o un integrale di prima specie su segmenti, archi di circonferenza o eliche. Il calcolo è breve se sai la formula e la velocità $|\gamma'(t)|$.

#lesson 6.1 Curve parametriche
goal: Riconoscere se una curva è regolare, chiusa, semplice e calcolarne il vettore tangente.

::idea
Una curva è la **traiettoria di un punto che si muove**: $\gamma(t)$ dice dove sta all'istante $t$. Il **sostegno** è l'insieme dei punti toccati, il disegno; la parametrizzazione dice anche come lo si percorre. $\gamma'(t)$ è il vettore velocità, tangente alla curva.

::def Curva, sostegno, regolare, chiusa, semplice
Una curva è una funzione continua $\gamma:[a,b]\to\mathbb R^n$; il sostegno è $\gamma([a,b])$. È **regolare** se $\gamma\in C^1$ e $\gamma'(t)\ne0$ per ogni $t$; **regolare a tratti** se lo è su un numero finito di sottointervalli. È **chiusa** se $\gamma(a)=\gamma(b)$; **semplice** se non passa due volte per lo stesso punto (tranne eventualmente $\gamma(a)=\gamma(b)$). Il versore tangente è $T(t)=\gamma'(t)/|\gamma'(t)|$.

::table
Curva ¦ Parametrizzazione ¦ $\lvert\gamma'(t)\rvert$
Segmento da $A$ a $B$ ¦ $A+t(B-A)$, $t\in[0,1]$ ¦ $\lVert B-A\rVert$
Circonferenza di raggio $R$ ¦ $(R\cos t,R\sin t)$, $t\in[0,2\pi]$ ¦ $R$
Grafico $y=g(x)$ ¦ $(x,g(x))$, $x\in[a,b]$ ¦ $\sqrt{1+g'(x)^2}$
Elica ¦ $(\cos t,\sin t,t)$ ¦ $\sqrt2$
Curva polare $\rho=\rho(\theta)$ ¦ $(\rho\cos\theta,\rho\sin\theta)$ ¦ $\sqrt{\rho^2+\rho'^2}$

::lab curve

::example base $\gamma(t)=(t^2,t^3)$, $t\in[-1,1]$: è regolare?
+ Derivata: $\gamma'(t)=(2t,3t^2)$.
+ In t = 0: $\gamma'(0)=(0,0)$.
= Non è regolare: nel punto $(0,0)$ il sostegno ha una **cuspide**. È comunque una curva continua e semplice.

::trap
- Regolare riguarda la parametrizzazione, non solo il disegno: la stessa circonferenza percorsa con $(\cos t^3,\sin t^3)$ ha velocità nulla in $t=0$.
- Chiusa non vuol dire semplice: la lemniscata (un otto) è chiusa ma passa due volte dal centro.

#lesson 6.2 Lunghezza di una curva
goal: Calcolare la lunghezza di segmenti, archi, eliche, grafici e curve in coordinate polari.

::def Lunghezza
Per $\gamma:[a,b]\to\mathbb R^n$ regolare (a tratti):
$$L(\gamma)=\int_a^b|\gamma'(t)|\,dt .$$
Grafico $y=g(x)$: $L=\int_a^b\sqrt{1+g'(x)^2}\,dx$. Curva polare $\rho=\rho(\theta)$: $L=\int_{\theta_1}^{\theta_2}\sqrt{\rho^2+\rho'^2}\,d\theta$.

::thm Invarianza per riparametrizzazione
La lunghezza non dipende dalla parametrizzazione regolare scelta né dal verso di percorrenza. Dipende dal sostegno e da quante volte lo si percorre.

::example base Lunghezza dell'elica $(\cos t,\sin t,t)$, $t\in[0,2\pi]$.
+ Velocità: $\gamma'=(-\sin t,\cos t,1)$, $|\gamma'|=\sqrt2$.
= $L=2\pi\sqrt2$.

::example medio Lunghezza del grafico di $y=x^{3/2}$ per $x\in[0,4]$.
+ Formula: $\sqrt{1+\frac94x}$.
+ Calcolo: $\int_0^4\sqrt{1+\frac94x}\,dx=\frac8{27}\Big[(1+\tfrac94x)^{3/2}\Big]_0^4$.
= $\frac{8}{27}\big(10\sqrt{10}-1\big)$.

::example esame Lunghezza della cardioide $\rho=1+\cos\theta$, $\theta\in[0,2\pi]$.
+ Polare: $\rho^2+\rho'^2=(1+\cos\theta)^2+\sin^2\theta=2+2\cos\theta=4\cos^2\frac\theta2$.
+ Calcolo: $L=\int_0^{2\pi}2\big|\cos\frac\theta2\big|\,d\theta=2\int_0^\pi2\cos\frac\theta2\,d\theta$.
= $L=8$. Attenzione al valore assoluto: senza, l'integrale su $[0,2\pi]$ darebbe 0.

::trap
- $|\gamma'(t)|$ è la norma: radice della somma dei quadrati, non la somma delle componenti.
- Con le radici di quadrati ($\sqrt{4\cos^2(\theta/2)}$) rimetti il valore assoluto.

#lesson 6.3 Integrale curvilineo di prima specie
goal: Calcolare $\int_\gamma f\,ds$ e usarlo per massa e baricentro di un filo.

::idea
È la somma dei valori di $f$ lungo la curva, ciascuno pesato con la **lunghezza** del pezzetto: $ds=|\gamma'(t)|\,dt$. Con $f=1$ dà la lunghezza; con $f$ densità lineare dà la massa del filo.

::def Integrale curvilineo di prima specie
$$\int_\gamma f\,ds=\int_a^b f\big(\gamma(t)\big)\,|\gamma'(t)|\,dt .$$
Non dipende dalla parametrizzazione né dal **verso** di percorrenza.

::def Massa e baricentro di un filo
Filo $\gamma$ di densità lineare $\mu$: massa $m=\int_\gamma\mu\,ds$; baricentro $\bar x=\frac1m\int_\gamma x\,\mu\,ds$, e così via per le altre coordinate.

::method
1. Parametrizza la curva e calcola $|\gamma'(t)|$.
2. Sostituisci $\gamma(t)$ in $f$.
3. Integra $f(\gamma(t))|\gamma'(t)|$ sull'intervallo del parametro.

::example base $\int_\gamma(x+y)\,ds$, $\gamma$ segmento da $(0,0)$ a $(1,1)$.
+ Parametrizza: $\gamma(t)=(t,t)$, $|\gamma'|=\sqrt2$.
+ Calcolo: $\int_0^12t\sqrt2\,dt$.
= $\sqrt2$.

::example medio Baricentro della semicirconferenza omogenea $x^2+y^2=R^2$, $y\ge0$.
+ Massa: lunghezza $\pi R$ (densità 1).
+ Momento: $\int_\gamma y\,ds=\int_0^\pi R\sin t\cdot R\,dt=2R^2$.
= $\bar y=\frac{2R}{\pi}$, diverso dal semidisco ($\frac{4R}{3\pi}$): il filo ha la massa tutta sul bordo, più lontano dal centro.

::trap
- Dimenticare $|\gamma'(t)|$: senza, il risultato dipende dalla parametrizzazione ed è sbagliato.
- Non confondere con il lavoro (seconda specie, capitolo 7), che dipende dal verso.

Q: Definisci curva regolare, chiusa e semplice, e la lunghezza di una curva.
A: Una curva è una funzione continua $\gamma:[a,b]\to\mathbb R^n$; il suo sostegno è $\gamma([a,b])$. È **regolare** se $\gamma\in C^1([a,b])$ e $\gamma'(t)\ne0$ per ogni $t$; **chiusa** se $\gamma(a)=\gamma(b)$; **semplice** se $\gamma(t_1)\ne\gamma(t_2)$ per $t_1\ne t_2$, salvo eventualmente $t_1=a$, $t_2=b$. La lunghezza di una curva regolare è
$$L(\gamma)=\int_a^b|\gamma'(t)|\,dt,$$
e non dipende dalla parametrizzazione regolare scelta. Esempio: $(t^2,t^3)$ non è regolare in $t=0$ (cuspide).

$$\int_\gamma f\,ds=\int_a^b f(\gamma(t))\,|\gamma'(t)|\,dt .$$

#lesson 7.1 Lavoro di un campo lungo una curva
goal: Calcolare $\int_\gamma F\cdot dr$ con una parametrizzazione, sapendo che dipende dal verso.

::idea
Il lavoro somma la componente del campo **lungo la direzione del moto**. Se cammini controvento il lavoro è negativo; se il campo è perpendicolare al cammino non conta. A differenza della prima specie, invertire il verso cambia il segno.

::def Integrale curvilineo di seconda specie (lavoro)
Per $F$ continuo e $\gamma:[a,b]\to\mathbb R^n$ regolare:
$$\int_\gamma F\cdot dr=\int_a^b F\big(\gamma(t)\big)\cdot\gamma'(t)\,dt .$$
Nel piano si scrive anche $\int_\gamma P\,dx+Q\,dy$. Con l'orientazione opposta $-\gamma$: $\int_{-\gamma}F\cdot dr=-\int_\gamma F\cdot dr$. Una curva chiusa nel piano è **orientata positivamente** se è percorsa in senso antiorario (la regione resta a sinistra).

::example base Lavoro di $F=(-y,x)$ lungo la circonferenza unitaria antioraria.
+ Parametrizza: $\gamma=(\cos t,\sin t)$, $\gamma'=(-\sin t,\cos t)$, $F(\gamma)=(-\sin t,\cos t)$.
+ Prodotto: $F\cdot\gamma'=\sin^2t+\cos^2t=1$.
= $\int_0^{2\pi}1\,dt=2\pi$. Il campo gira insieme alla curva: lavoro positivo a ogni passo.

::example medio Lavoro di $F=(x+y,\ x)$ lungo il segmento da $(0,0)$ a $(1,2)$.
+ Parametrizza: $\gamma=(t,2t)$, $\gamma'=(1,2)$, $F(\gamma)=(3t,t)$.
+ Calcolo: $\int_0^1(3t+2t)\,dt$.
= $\frac52$.

::trap
- Il prodotto è scalare con $\gamma'(t)$, non con $|\gamma'(t)|$: qui non c'è il modulo.
- Controlla il verso richiesto: orario o antiorario cambiano il segno.

#lesson 7.2 Campi conservativi e potenziale
goal: Riconoscere un campo conservativo, trovarne un potenziale e calcolare il lavoro come differenza di potenziale.

::def Campo conservativo e potenziale
$F$ continuo su un aperto $A$ è **conservativo** se esiste $U\in C^1(A)$ con $\nabla U=F$; $U$ è un **potenziale** (definito a meno di una costante su ogni componente connessa).

::thm Caratterizzazione dei campi conservativi
Per $F$ continuo su un aperto connesso $A$ sono equivalenti:
1. $F$ è conservativo;
2. il lavoro lungo ogni curva chiusa (regolare a tratti) in $A$ è nullo;
3. il lavoro tra due punti non dipende dalla curva che li unisce.
In tal caso $\int_\gamma F\cdot dr=U(\gamma(b))-U(\gamma(a))$.

::method Trovare il potenziale di $F=(P,Q)$
1. Integra $P$ in $x$: $U=\int P\,dx+c(y)$.
2. Deriva in $y$ e imponi $U_y=Q$: trovi $c'(y)$.
3. Integra $c'(y)$. Controllo finale: $\nabla U=F$.
In tre variabili: stesso procedimento, con $c(y,z)$ e poi $d(z)$.

::example medio $F=(2x+y,\ x+2y)$: potenziale e lavoro da $(0,0)$ a $(1,1)$.
+ Integra P: $U=x^2+xy+c(y)$.
+ Imponi Q: $U_y=x+c'(y)=x+2y\Rightarrow c(y)=y^2$.
+ Potenziale: $U=x^2+xy+y^2$.
= Lavoro $=U(1,1)-U(0,0)=3$, lungo qualunque curva.

::trap
- La condizione necessaria $Q_x=P_y$ non basta da sola: serve anche il dominio giusto (lezione 7.3).
- Il lavoro come differenza di potenziale vale solo se il campo è conservativo.

#lesson 7.3 Irrotazionale e conservativo
goal: Usare il rotore come test, sapere quando basta e conoscere il controesempio del campo vortice.

::thm Condizione necessaria
Se $F\in C^1(A)$ è conservativo, allora è **irrotazionale**: nel piano $Q_x=P_y$; nello spazio $\operatorname{rot}F=0$ (per Schwarz sul potenziale).

::thm Condizione sufficiente
Se $A$ è aperto e **semplicemente connesso** (ogni curva chiusa in $A$ si può restringere a un punto restando in $A$: niente buchi) e $F\in C^1(A)$ è irrotazionale, allora $F$ è conservativo in $A$. Esempi semplicemente connessi: $\mathbb R^2$, un disco, un semipiano, un insieme convesso o stellato. Non lo è $\mathbb R^2\setminus\{(0,0)\}$.

::example esame Il campo vortice $F=\left(\dfrac{-y}{x^2+y^2},\dfrac{x}{x^2+y^2}\right)$ su $\mathbb R^2\setminus\{0\}$.
+ Rotore: $Q_x=\frac{y^2-x^2}{(x^2+y^2)^2}=P_y$: irrotazionale.
+ Lavoro: sulla circonferenza unitaria antioraria $F(\gamma)\cdot\gamma'=\sin^2t+\cos^2t=1$: lavoro $2\pi\ne0$.
= **Non è conservativo** sul piano bucato. Su un semipiano (semplicemente connesso) invece lo è: lì un potenziale è l'angolo $\theta$.

::lab campi f=buco

::trap
- "Irrotazionale ⇒ conservativo" è falso senza l'ipotesi sul dominio: è la domanda trabocchetto per eccellenza.
- Un campo non irrotazionale non è mai conservativo: basta $Q_x\ne P_y$ in un punto.

#lesson 7.4 Formula di Green
goal: Trasformare una circuitazione sul bordo in un integrale doppio, e calcolare aree con un integrale curvilineo.

::thm Formula di Gauss-Green nel piano
Sia $D$ un dominio regolare del piano con bordo $\partial D$ orientato positivamente (antiorario, regione a sinistra) e $P,Q\in C^1$ su un aperto che contiene $D$. Allora
$$\oint_{\partial D}P\,dx+Q\,dy=\iint_D\big(Q_x-P_y\big)\,dx\,dy .$$

::thm Area con Green
$$\text{area}(D)=\oint_{\partial D}x\,dy=-\oint_{\partial D}y\,dx=\frac12\oint_{\partial D}(x\,dy-y\,dx).$$

::example medio $\oint_{\partial D}(-y^3\,dx+x^3\,dy)$, $D$ disco unitario.
+ Green: $Q_x-P_y=3x^2+3y^2$.
+ Polari: $\int_0^{2\pi}\!\int_0^13\rho^2\cdot\rho\,d\rho\,d\theta=2\pi\cdot\frac34$.
= $\frac{3\pi}2$. Diretto sarebbe stato molto più lungo.

::example base Area dell'ellisse $\frac{x^2}{a^2}+\frac{y^2}{b^2}\le1$ con Green.
+ Bordo: $(a\cos t,b\sin t)$: $x\,dy-y\,dx=ab(\cos^2t+\sin^2t)\,dt$.
= $\frac12\int_0^{2\pi}ab\,dt=\pi ab$.

::lab campi f=vortice

::trap
- Green richiede $P,Q$ di classe $C^1$ **su tutto $D$**: con il campo vortice e $D$ contenente l'origine non si applica (il laboratorio lo mostra).
- Orientazione negativa: cambia il segno.

?th
Q: Definisci campo conservativo e potenziale. Quali condizioni lo caratterizzano?
A: Un campo $F$ continuo su un aperto $A\subseteq\mathbb R^n$ è conservativo se esiste $U\in C^1(A)$ con $\nabla U=F$; $U$ si chiama potenziale ed è unico a meno di una costante su ogni componente connessa. Su un aperto connesso sono equivalenti: (1) $F$ conservativo; (2) $\oint_\gamma F\cdot dr=0$ per ogni curva chiusa regolare a tratti in $A$; (3) il lavoro tra due punti non dipende dal cammino. In tal caso $\int_\gamma F\cdot dr=U(\gamma(b))-U(\gamma(a))$.

Se $F\in C^1$ è conservativo allora è irrotazionale ($Q_x=P_y$, ovvero $\operatorname{rot}F=0$); il viceversa vale se $A$ è semplicemente connesso. Controesempio sul piano bucato: $\frac{(-y,x)}{x^2+y^2}$, irrotazionale con circuitazione $2\pi$ attorno all'origine.
K: Definizione di potenziale con $\nabla U=F$
K: Le tre condizioni equivalenti
K: Lavoro come differenza di potenziale
K: Irrotazionale: necessaria; sufficiente su semplicemente connessi
K: Controesempio del campo vortice

?th
Q: Enuncia la formula di Gauss-Green nel piano e mostrane un'applicazione.
A: Sia $D\subset\mathbb R^2$ un dominio regolare con frontiera $\partial D$ orientata positivamente (percorrendola, $D$ resta a sinistra) e siano $P,Q$ di classe $C^1$ in un aperto contenente $D$. Allora
$$\oint_{\partial D}P\,dx+Q\,dy=\iint_D\left(\frac{\partial Q}{\partial x}-\frac{\partial P}{\partial y}\right)dx\,dy .$$
Applicazione: con $P=-\frac y2$, $Q=\frac x2$ si ottiene $\text{area}(D)=\frac12\oint_{\partial D}(x\,dy-y\,dx)$; per l'ellisse di semiassi $a,b$ dà $\pi ab$.
K: Ipotesi: dominio regolare, bordo orientato positivamente, $P,Q\in C^1$ su $D$
K: Formula con $Q_x-P_y$
K: Formula dell'area o un altro esempio

#chapter 8
title: Superfici, flusso, teoremi di Gauss e Stokes
short: Superfici
place: Ghiacciaio Stokes
alt: 2450
weight: 1.0
program: Superfici parametriche regolari; piano tangente e versore normale; superfici cartesiane; area di una superficie; integrali di superficie; orientazione e flusso di un campo vettoriale; teorema della divergenza (Gauss); teorema di Stokes (del rotore).
exam: Tipicamente una multipla di calcolo (area di una superficie, integrale di superficie su sfera o grafico, **flusso** attraverso una superficie chiusa, quasi sempre più rapido con la divergenza) e Vero/Falso sugli enunciati di Gauss e Stokes e sulle identità $\operatorname{div}\operatorname{rot}=0$.

#lesson 8.1 Superfici parametriche e versore normale
goal: Parametrizzare sfera, cilindro, cono e grafici e calcolare il vettore normale $r_u\times r_v$.

::idea
Una superficie è descritta da **due** parametri, come una mappa: $r(u,v)$ dice dove sta il punto. Le derivate $r_u$ e $r_v$ sono due vettori tangenti; il loro prodotto vettoriale è **normale** alla superficie e la sua lunghezza misura quanto si dilata l'area.

::def Superficie regolare
$r:K\subset\mathbb R^2\to\mathbb R^3$ di classe $C^1$, iniettiva all'interno di $K$, con $r_u\times r_v\ne0$ (salvo il bordo). Il versore normale è $n=\frac{r_u\times r_v}{|r_u\times r_v|}$.

::table
Superficie ¦ Parametrizzazione ¦ $r_u\times r_v$ (o il suo modulo)
Grafico $z=g(x,y)$ ¦ $(x,y,g(x,y))$ ¦ $(-g_x,-g_y,1)$, modulo $\sqrt{1+g_x^2+g_y^2}$
Sfera di raggio $R$ ¦ $(R\sin\varphi\cos\theta,R\sin\varphi\sin\theta,R\cos\varphi)$ ¦ modulo $R^2\sin\varphi$, normale uscente
Cilindro $x^2+y^2=R^2$ ¦ $(R\cos\theta,R\sin\theta,z)$ ¦ modulo $R$
Cono $z=\sqrt{x^2+y^2}$ ¦ $(\rho\cos\theta,\rho\sin\theta,\rho)$ ¦ modulo $\sqrt2\,\rho$

::example base Normale al grafico $z=x^2+y^2$ in $(1,1,2)$.
+ Formula: $(-g_x,-g_y,1)=(-2x,-2y,1)$.
= In $(1,1)$: $(-2,-2,1)$, rivolto verso l'alto (terza componente positiva). Il piano tangente è $z=2+2(x-1)+2(y-1)$.

::trap
- L'ordine conta: $r_v\times r_u=-r_u\times r_v$ inverte l'orientazione.
- Per la sfera in sferiche, $r_\varphi\times r_\theta$ punta verso l'esterno; $r_\theta\times r_\varphi$ verso l'interno.

#quiz
?mc
Q: Un vettore normale al grafico di $z=g(x,y)$ è
O: $(g_x,g_y,1)$
O: $(-g_x,-g_y,1)$
O: $(g_x,g_y,0)$
O: Nessuna delle precedenti
A: 2
W: Con $r=(x,y,g)$: $r_x\times r_y=(1,0,g_x)\times(0,1,g_y)=(-g_x,-g_y,1)$. Anche $(g_x,g_y,-1)$ va bene: è l'opposto.

?vf
Q: Per la sfera parametrizzata in coordinate sferiche, $|r_\varphi\times r_\theta|=R^2\sin\varphi$.
A: V
W: È lo stesso fattore dello Jacobiano delle sferiche, con $r=R$ fissato.

?mc
Q: Il modulo di $r_\theta\times r_z$ per il cilindro $(R\cos\theta,R\sin\theta,z)$ è
O: 1
O: $R$
O: $R^2$
O: Nessuna delle precedenti
A: 2
W: $r_\theta=(-R\sin\theta,R\cos\theta,0)$, $r_z=(0,0,1)$: prodotto $(R\cos\theta,R\sin\theta,0)$.

?vf
Q: Scambiando l'ordine dei parametri, il versore normale cambia verso.
A: V
W: $r_v\times r_u=-(r_u\times r_v)$.

#lesson 8.2 Area di una superficie e integrali di superficie
goal: Calcolare l'area di una superficie e $\iint_S f\,dS$ su sfere, coni e grafici.

::def Area e integrale di superficie
$$\text{Area}(S)=\iint_K|r_u\times r_v|\,du\,dv,\qquad \iint_S f\,dS=\iint_K f\big(r(u,v)\big)\,|r_u\times r_v|\,du\,dv .$$
Per un grafico $z=g(x,y)$ su $D$: $dS=\sqrt{1+g_x^2+g_y^2}\,dx\,dy$. Come la prima specie, non dipende dall'orientazione.

::example medio Area del paraboloide $z=x^2+y^2$ sopra il disco $x^2+y^2\le1$.
+ Elemento: $\sqrt{1+4x^2+4y^2}=\sqrt{1+4\rho^2}$.
+ Polari: $\int_0^{2\pi}\!\int_0^1\sqrt{1+4\rho^2}\,\rho\,d\rho\,d\theta=2\pi\cdot\frac1{12}\big[(1+4\rho^2)^{3/2}\big]_0^1$.
= $\frac\pi6\big(5\sqrt5-1\big)$.

::example base $\iint_S z\,dS$, $S$ semisfera superiore di raggio 1.
+ Sferiche: $z=\cos\varphi$, $dS=\sin\varphi\,d\varphi\,d\theta$, $\varphi\in[0,\frac\pi2]$.
= $2\pi\int_0^{\pi/2}\cos\varphi\sin\varphi\,d\varphi=\pi$.

::trap
- Dimenticare il fattore $|r_u\times r_v|$ (l'analogo del $\rho$ delle polari).
- Area della sfera $4\pi R^2$, non $\frac43\pi R^3$ (quello è il volume).

#quiz
?mc

O: $\pi$
O: $\sqrt2\,\pi$
O: $2\pi$
O: Nessuna delle precedenti
A: 2
W: $dS=\sqrt{1+1}\,dx\,dy$ sul disco di raggio 1.

?mc
Q: L'area del pezzo di piano $z=x+y$ che sta sopra il disco $x^2+y^2\le1$ è
O: $\pi$
O: $\sqrt2\,\pi$
O: $\sqrt3\,\pi$
O: Nessuna delle precedenti
A: 3
W: $\sqrt{1+1+1}\cdot\pi$.

?mc
Q: $\iint_S z\,dS$ sulla semisfera superiore di raggio 1 vale
O: $\pi$
O: $2\pi$
O: $\frac{2\pi}{3}$
O: Nessuna delle precedenti
A: 1
W: $2\pi\int_0^{\pi/2}\cos\varphi\sin\varphi\,d\varphi=\pi$. (Il valore $\frac{2\pi}3$ è il volume della semisfera.)

?mc
Q: L'area della sfera di raggio $R$ è
O: $\frac43\pi R^3$
O: $4\pi R^2$
O: $2\pi R^2$
O: Nessuna delle precedenti
A: 2
W: $\int_0^{2\pi}\!\int_0^\pi R^2\sin\varphi\,d\varphi\,d\theta$.

#lesson 8.3 Flusso di un campo attraverso una superficie
goal: Calcolare il flusso $\iint_S F\cdot n\,dS$ scegliendo l'orientazione richiesta.

::idea
Il flusso misura **quanto campo attraversa** la superficie: se $F$ è la velocità di un fluido, è il volume che passa per unità di tempo. Conta solo la componente normale $F\cdot n$, e il segno dipende dal verso scelto per $n$.

::def Flusso
Per $S$ orientata dal versore $n$:
$$\Phi_S(F)=\iint_S F\cdot n\,dS=\iint_K F\big(r(u,v)\big)\cdot\big(r_u\times r_v\big)\,du\,dv$$
(se $r_u\times r_v$ ha il verso di $n$; altrimenti cambia segno). Per una superficie chiusa si usa di solito la normale **uscente**.

::example base Flusso di $F=(x,y,z)$ uscente dalla sfera di raggio $R$.
+ Normale: $n=\frac{(x,y,z)}{R}$, quindi $F\cdot n=\frac{x^2+y^2+z^2}{R}=R$.
= $\Phi=R\cdot4\pi R^2=4\pi R^3$.

::example medio Flusso di $F=(0,0,1)$ attraverso il disco $z=0$, $x^2+y^2\le1$, normale verso l'alto.
+ Normale: $n=(0,0,1)$, $F\cdot n=1$.
= $\Phi=\text{area}=\pi$. Con la normale verso il basso: $-\pi$.

::trap
- Il flusso dipende dall'orientazione; l'area e $\iint f\,dS$ no.
- Su una superficie chiusa, prima di parametrizzare pezzo per pezzo chiediti se Gauss fa prima.

#quiz
?mc
Q: Il flusso di $F=(x,y,z)$ uscente dalla sfera di raggio $R$ è
O: $4\pi R^2$
O: $4\pi R^3$
O: $\frac43\pi R^3$
O: Nessuna delle precedenti
A: 2
W: $F\cdot n=R$ su tutta la sfera: $R\cdot4\pi R^2$.

?mc
Q: Il flusso di $F=(x,y,z)$ attraverso la semisfera superiore unitaria, normale verso l'esterno, è
O: $\pi$
O: $2\pi$
O: $\frac{2\pi}{3}$
O: Nessuna delle precedenti
A: 2
W: $F\cdot n=1$: flusso uguale all'area $2\pi$.

?vf
Q: Il flusso di un campo attraverso una superficie non dipende dall'orientazione scelta.
A: F
W: Cambiando il verso di $n$ il flusso cambia segno.

?mc
Q: Il flusso di $F=(0,0,1)$ attraverso il disco $z=0$, $x^2+y^2\le1$, orientato con normale verso il basso è
O: $\pi$
O: $-\pi$
O: 0
O: Nessuna delle precedenti
A: 2
W: $F\cdot n=-1$ su tutto il disco.

#lesson 8.4 Teorema della divergenza (Gauss)
goal: Calcolare il flusso uscente da una superficie chiusa con un integrale triplo della divergenza.

::thm Teorema della divergenza
Sia $E\subset\mathbb R^3$ un dominio regolare con bordo $\partial E$ orientato con la normale **uscente** e $F$ di classe $C^1$ su un aperto che contiene $E$. Allora
$$\iint_{\partial E}F\cdot n\,dS=\iiint_E\operatorname{div}F\,dx\,dy\,dz .$$
Conseguenze: un campo a divergenza nulla ha flusso uscente nullo da ogni superficie chiusa (che racchiude solo punti del dominio); il flusso di un rotore attraverso una superficie chiusa è nullo ($\operatorname{div}\operatorname{rot}=0$).

::example base Flusso di $F=(x,y,z)$ uscente dalla sfera di raggio $R$, con Gauss.
+ Divergenza: $\operatorname{div}F=3$.
= $\Phi=3\cdot\frac43\pi R^3=4\pi R^3$, come il calcolo diretto.

::example medio Flusso di $F=(x,y,0)$ uscente dal cilindro chiuso $x^2+y^2\le1$, $0\le z\le2$.
+ Divergenza: $\operatorname{div}F=2$.
+ Volume: $\pi\cdot1^2\cdot2=2\pi$.
= $\Phi=4\pi$. Diretto servirebbero tre pezzi (laterale, base, coperchio).

::trap
- Serve la normale uscente e $F\in C^1$ su tutto $E$: per $F=\frac{x}{|x|^3}$ e una sfera centrata nell'origine il teorema non si applica.
- Se la superficie non è chiusa, chiudila con un pezzo semplice e sottrai quel flusso.

O: $\frac{4\pi}{3}$
O: $4\pi$
O: 0
O: Nessuna delle precedenti
A: 1
W: $\operatorname{div}F=1$: flusso uguale al volume della palla.

?mc

O: $2\pi$
O: $4\pi$
O: $6\pi$
O: Nessuna delle precedenti
A: 2
W: $\operatorname{div}F=2$ per il volume $2\pi$.

?vf
Q: Il flusso uscente di un campo $C^1$ a divergenza nulla attraverso il bordo di un dominio regolare è nullo.
A: V
W: Teorema della divergenza con $\operatorname{div}F=0$.

?mc
Q: Il flusso di $F=(0,0,z^2)$ uscente dal cubo $[0,1]^3$ è
O: 0
O: 1
O: 2
O: Nessuna delle precedenti
A: 2
W: $\operatorname{div}F=2z$; $\iiint2z=1$.

?vf
Q: Se $G\in C^2(\mathbb R^3)$, il flusso di $\operatorname{rot}G$ uscente da ogni sfera è nullo.
A: V
W: $\operatorname{div}\operatorname{rot}G=0$ e teorema della divergenza.

#lesson 8.5 Teorema di Stokes
goal: Trasformare una circuitazione lungo una curva nel flusso del rotore attraverso una superficie che la ha come bordo.

::thm Teorema di Stokes (del rotore)
Sia $S$ una superficie regolare orientata con bordo $\partial S$ orientato **coerentemente** (regola della mano destra: camminando sul bordo con la testa verso $n$, la superficie resta a sinistra) e $F$ di classe $C^1$ su un aperto che contiene $S$. Allora
$$\oint_{\partial S}F\cdot dr=\iint_S\operatorname{rot}F\cdot n\,dS .$$
Nel piano ($S=D$, $n=(0,0,1)$) ritrovi la formula di Green.

::example medio $F=(-y,x,0)$, $S$ semisfera superiore unitaria con normale uscente.
+ Bordo: la circonferenza unitaria nel piano $z=0$, antioraria vista dall'alto: circuitazione $2\pi$ (capitolo 7).
+ Rotore: $\operatorname{rot}F=(0,0,2)$. Conviene sostituire la semisfera con il disco, che ha lo stesso bordo: $\iint_D2\,dS=2\pi$.
= Entrambe le strade danno $2\pi$: per Stokes il flusso del rotore dipende solo dal bordo.

::trap
- Orientazione incoerente tra bordo e normale cambia il segno.
- Stokes vale per qualunque superficie con quel bordo: scegli la più semplice (spesso un disco piano).

O: $4\pi$
O: Nessuna delle precedenti
A: 2
W: Per Stokes è la circuitazione sul bordo, $2\pi$.

A: V
W: Per Stokes entrambi i flussi sono uguali alla circuitazione sul bordo comune.

A: V
W: Con $S$ nel piano $z=0$ e $n=(0,0,1)$: $\operatorname{rot}F\cdot n=Q_x-P_y$.

W: $Q_x-P_y=1-(-1)=2$.

?th
Q: Enuncia il teorema della divergenza (di Gauss).
A: Sia $E\subset\mathbb R^3$ un dominio regolare (limitato, con frontiera $\partial E$ superficie regolare a pezzi), con $\partial E$ orientata dalla normale uscente $n$, e sia $F$ un campo vettoriale di classe $C^1$ in un aperto contenente $E$. Allora
$$\iint_{\partial E}F\cdot n\,dS=\iiint_E\operatorname{div}F\,dx\,dy\,dz .$$
Esempio: per $F=(x,y,z)$ e la sfera di raggio $R$, $\operatorname{div}F=3$ e il flusso uscente è $4\pi R^3$. Conseguenza: un campo a divergenza nulla ha flusso nullo attraverso ogni superficie chiusa che racchiude un dominio in cui è $C^1$.
K: Ipotesi: dominio regolare, normale uscente, $F\in C^1$
K: Formula flusso = integrale triplo della divergenza
K: Esempio o conseguenza

?th
Q: Enuncia il teorema di Stokes e spiega il legame con la formula di Green.
A: Sia $S$ una superficie regolare orientata dal versore normale $n$, con bordo $\partial S$ curva regolare a tratti orientata coerentemente con $n$ (regola della mano destra), e sia $F$ di classe $C^1$ in un aperto contenente $S$. Allora
$$\oint_{\partial S}F\cdot dr=\iint_S\operatorname{rot}F\cdot n\,dS .$$
Se $S$ è un dominio $D$ del piano $z=0$ con $n=(0,0,1)$ e $F=(P,Q,0)$, si ha $\operatorname{rot}F\cdot n=Q_x-P_y$ e si ottiene la formula di Green. Conseguenza: il flusso del rotore dipende solo dal bordo della superficie.
K: Ipotesi con orientazione coerente bordo/normale
K: Formula circuitazione = flusso del rotore
K: Caso piano = Green
K: Conseguenza o esempio

#chapter 9
title: Equazioni differenziali
short: Equazioni differenziali
place: Rifugio Cauchy
alt: 2700
weight: 1.4
program: Equazioni differenziali ordinarie; problema di Cauchy; teorema di esistenza e unicità locale e globale; equazioni a variabili separabili; equazioni lineari del primo ordine; equazioni lineari del secondo ordine a coefficienti costanti, omogenee e non omogenee (metodo di somiglianza); struttura dell'insieme delle soluzioni.
exam: Multiple in cui si risolve un problema di Cauchy (separabili, lineari del primo ordine) o si sceglie l'integrale generale di una lineare del secondo ordine; Vero/Falso su esistenza e unicità (ipotesi di Lipschitz, soluzioni che esplodono, non unicità di $y'=\sqrt{|y|}$) e sulla struttura delle soluzioni delle lineari.

#lesson 9.1 Problema di Cauchy, esistenza e unicità
goal: Sapere quando un problema di Cauchy ha una e una sola soluzione e riconoscere i controesempi classici.

::idea
Un'equazione differenziale lega una funzione incognita alle sue derivate. Il **problema di Cauchy** aggiunge il dato iniziale $y(t_0)=y_0$: è come dire dove parte il punto. Il campo di direzioni mostra la pendenza $f(t,y)$ in ogni punto; una soluzione è una curva sempre tangente ai trattini.

::def Problema di Cauchy (primo ordine, forma normale)
$$\begin{cases}y'=f(t,y)\\ y(t_0)=y_0\end{cases}$$
Una soluzione è una funzione $y$ derivabile su un intervallo $I\ni t_0$ con $y'(t)=f(t,y(t))$ in $I$ e $y(t_0)=y_0$.

::thm Esistenza e unicità locale
Se $f$ è continua in un intorno di $(t_0,y_0)$ e **localmente lipschitziana in $y$** (basta $\partial_yf$ continua), allora esiste un intervallo attorno a $t_0$ su cui il problema ha una e una sola soluzione.

::thm Esistenza globale
Se $f$ è continua su $[a,b]\times\mathbb R$ e lipschitziana in $y$ uniformemente in $t$ (in particolare per le **lineari** $y'=a(t)y+b(t)$ con $a,b$ continue), la soluzione esiste ed è unica su tutto $[a,b]$.

::lab direzioni e=nonu

::example esame Due controesempi da sapere.
+ Non unicità: $y'=\sqrt{|y|}$, $y(0)=0$: $f$ è continua ma non lipschitziana in $y=0$. Sono soluzioni $y\equiv0$ e $y=\frac{t^2}4$ per $t\ge0$ (0 per $t<0$).
+ Esplosione: $y'=y^2$, $y(0)=1$: $f$ è $C^1$, la soluzione $y=\frac1{1-t}$ esiste solo su $(-\infty,1)$.
= Il teorema locale non garantisce soluzioni su tutto $\mathbb R$; senza Lipschitz può mancare l'unicità.

::trap
- Continuità di $f$ dà l'esistenza (Peano), non l'unicità.
- Grafici di soluzioni distinte di un problema con unicità non si incrociano mai.

#quiz
?vf
Q: Il problema $y'=\sqrt{|y|}$, $y(0)=0$ ha un'unica soluzione.
A: F
W: $y\equiv0$ e $y=\frac{t^2}{4}$ per $t\ge0$ (0 per $t<0$) sono due soluzioni: manca la lipschitzianità in $y=0$.

?mc

O: $\mathbb R$
O: $(-\infty,1)$
O: $(-1,1)$
O: Nessuna delle precedenti
A: 2
W: $y=\frac1{1-t}$ esplode in $t=1$; l'intervallo massimale contenente 0 è $(-\infty,1)$.

?vf
Q: Se $f(t,y)$ e $\partial_yf(t,y)$ sono continue in un intorno di $(t_0,y_0)$, il problema di Cauchy $y'=f(t,y)$, $y(t_0)=y_0$ ha una e una sola soluzione in un intorno di $t_0$.
A: V
W: $\partial_yf$ continua implica lipschitzianità locale: teorema di esistenza e unicità locale.

?vf
Q: Un problema di Cauchy per un'equazione lineare $y'=a(t)y+b(t)$ con $a,b$ continue su $\mathbb R$ ha soluzione definita su tutto $\mathbb R$.
A: V
W: Esistenza globale per le lineari.

#lesson 9.2 Equazioni a variabili separabili
goal: Risolvere $y'=g(t)h(y)$ separando le variabili, senza perdere le soluzioni costanti.

::method Variabili separabili: $y'=g(t)\,h(y)$
1. Soluzioni costanti: ogni $\bar y$ con $h(\bar y)=0$ dà la soluzione $y\equiv\bar y$.
2. Dove $h(y)\ne0$: $\displaystyle\int\frac{dy}{h(y)}=\int g(t)\,dt+c$.
3. Ricava $y$ (se possibile) e imponi il dato iniziale.
4. Indica l'intervallo massimale: il più grande intervallo contenente $t_0$ su cui la formula ha senso.

::example base $y'=2ty$, $y(0)=1$.
+ Costante: $y\equiv0$, che però non rispetta il dato.
+ Separa: $\int\frac{dy}y=\int2t\,dt\Rightarrow\ln|y|=t^2+c$.
+ Dato: $y=Ce^{t^2}$, $y(0)=1\Rightarrow C=1$.
= $y=e^{t^2}$, definita su $\mathbb R$.

::example medio $y'=1+y^2$, $y(0)=0$.
+ Separa: $\int\frac{dy}{1+y^2}=\int dt\Rightarrow\arctan y=t+c$, $c=0$.
= $y=\tan t$ su $(-\frac\pi2,\frac\pi2)$: anche qui la soluzione esplode in tempo finito.

::trap
- Dividere per $h(y)$ senza prima mettere da parte le soluzioni costanti.
- Dimenticare il valore assoluto in $\int\frac{dy}{y}=\ln|y|$.

#lesson 9.3 Lineari del primo ordine
goal: Risolvere $y'+a(t)y=b(t)$ con il fattore integrante.

::thm Formula risolutiva
Per $y'+a(t)\,y=b(t)$ con $a,b$ continue su $I$, posto $A(t)$ una primitiva di $a$:
$$y(t)=e^{-A(t)}\left(\int b(t)\,e^{A(t)}\,dt+C\right).$$
Equivalente: moltiplica per $e^{A(t)}$ e riconosci $\big(y\,e^{A}\big)'=b\,e^{A}$.

::example base $y'+2y=4$, $y(0)=0$.
+ Fattore: $e^{2t}$: $(ye^{2t})'=4e^{2t}\Rightarrow ye^{2t}=2e^{2t}+C$.
+ Dato: $y=2+Ce^{-2t}$, $y(0)=0\Rightarrow C=-2$.
= $y=2(1-e^{-2t})$: tende all'equilibrio $y=2$.

::example medio $y'+\frac yt=1$, $y(1)=1$, per $t>0$.
+ Fattore: $A=\ln t$, $e^A=t$: $(ty)'=t\Rightarrow ty=\frac{t^2}2+C$.
+ Dato: $1=\frac12+C\Rightarrow C=\frac12$.
= $y=\frac t2+\frac1{2t}$.

::note Equazione di Bernoulli
$y'+a(t)y=b(t)y^\alpha$ ($\alpha\ne0,1$) diventa lineare con $z=y^{1-\alpha}$.

::trap
- Il segno: con $y'=a(t)y+b(t)$ (forma "a destra") il fattore è $e^{-A}$; porta sempre l'equazione nella forma $y'+a\,y=b$.
- La costante va messa **prima** di moltiplicare per $e^{-A}$.

#lesson 9.4 Lineari del secondo ordine omogenee
goal: Scrivere l'integrale generale di $ay''+by'+cy=0$ dalle radici dell'equazione caratteristica.

::thm Struttura delle soluzioni
Le soluzioni di $y''+a_1y'+a_0y=0$ formano uno **spazio vettoriale di dimensione 2**: integrale generale $c_1y_1+c_2y_2$ con $y_1,y_2$ linearmente indipendenti. Il problema di Cauchy con $y(t_0)$ e $y'(t_0)$ assegnati ha una e una sola soluzione su $\mathbb R$.

::table
Equazione caratteristica $a\lambda^2+b\lambda+c=0$ ¦ Integrale generale
due radici reali $\lambda_1\ne\lambda_2$ ¦ $c_1e^{\lambda_1t}+c_2e^{\lambda_2t}$
radice reale doppia $\lambda$ ¦ $(c_1+c_2t)\,e^{\lambda t}$
complesse $\alpha\pm i\beta$ ¦ $e^{\alpha t}\big(c_1\cos\beta t+c_2\sin\beta t\big)$

::example base $y''-3y'+2y=0$, $y(0)=0$, $y'(0)=1$.
+ Caratteristica: $\lambda^2-3\lambda+2=0\Rightarrow\lambda=1,2$.
+ Generale: $y=c_1e^t+c_2e^{2t}$; $c_1+c_2=0$, $c_1+2c_2=1$.
= $y=e^{2t}-e^t$.

::example medio $y''+2y'+5y=0$.
+ Caratteristica: $\lambda^2+2\lambda+5=0\Rightarrow\lambda=-1\pm2i$.
= $y=e^{-t}(c_1\cos2t+c_2\sin2t)$: oscillazioni smorzate.

::trap
- Radice doppia: serve il fattore $t$ nel secondo termine, altrimenti hai una sola soluzione indipendente.
- Complesse: la parte reale va nell'esponenziale, la parte immaginaria nella frequenza.

O: $\cos t$

A: 2
W: $y=c_1\cos t+c_2\sin t$, $c_1=1$, $c_2=0$.

A: V
W: Integrale generale $c_1y_1+c_2y_2$ con $y_1,y_2$ indipendenti.

O: $c_1e^{-t}+c_2e^{-5t}$

#lesson 9.5 Non omogenee: metodo di somiglianza
goal: Trovare una soluzione particolare quando il termine noto è polinomio, esponenziale, seno o coseno, anche in risonanza.

::thm Struttura
Integrale generale della non omogenea = integrale generale dell'**omogenea associata** + **una** soluzione particolare.

::method Metodo di somiglianza per $ay''+by'+cy=g(t)$
1. Risolvi l'omogenea (lezione 9.4).
2. Se $g=P_n(t)e^{\mu t}$, cerca $y_p=t^m\,Q_n(t)\,e^{\mu t}$ con $Q_n$ polinomio dello stesso grado, dove $m$ è la molteplicità di $\mu$ come radice caratteristica (0 se non è radice).
3. Se $g=e^{\alpha t}(A\cos\beta t+B\sin\beta t)$, cerca $y_p=t^m e^{\alpha t}(C\cos\beta t+D\sin\beta t)$, con $m$ molteplicità di $\alpha+i\beta$.
4. Sostituisci, uguaglia i coefficienti, poi imponi i dati iniziali **sull'integrale generale completo**.

::example medio $y''-y=e^t$.
+ Omogenea: $\lambda=\pm1$: $c_1e^t+c_2e^{-t}$.
+ Risonanza: $\mu=1$ è radice semplice: $y_p=Ate^t$.
+ Coefficienti: $y_p''-y_p=2Ae^t=e^t\Rightarrow A=\frac12$.
= $y=c_1e^t+c_2e^{-t}+\frac t2e^t$.

::example esame $y''+4y=\sin2t$.
+ Risonanza: $2i$ è radice: $y_p=t(C\cos2t+D\sin2t)$.
+ Calcolo: sostituendo si ottiene $C=-\frac14$, $D=0$.
= $y_p=-\frac t4\cos2t$: in risonanza l'ampiezza cresce linearmente.

::trap
- Imporre i dati iniziali sulla sola omogenea: sbagliato, vanno imposti su omogenea + particolare.
- In risonanza la prova "senza $t$" dà un'identità impossibile: è il segnale per moltiplicare per $t$.

#theory
?th
Q: Enuncia il teorema di esistenza e unicità locale per il problema di Cauchy del primo ordine. Mostra con esempi che le ipotesi sono importanti.
A: Sia $f:A\to\mathbb R$, $A\subseteq\mathbb R^2$ aperto, continua e localmente lipschitziana in $y$ uniformemente rispetto a $t$ (ad esempio con $\partial_yf$ continua), e sia $(t_0,y_0)\in A$. Allora esiste $\delta>0$ tale che il problema $y'=f(t,y)$, $y(t_0)=y_0$ ammette una e una sola soluzione definita in $[t_0-\delta,t_0+\delta]$.

Senza Lipschitz può mancare l'unicità: $y'=\sqrt{|y|}$, $y(0)=0$ ha le soluzioni $y\equiv0$ e $y=\frac{t^2}4$ per $t\ge0$ (0 per $t<0$). Il risultato è locale: $y'=y^2$, $y(0)=1$ ha soluzione $\frac1{1-t}$, che esiste solo per $t<1$.
K: Ipotesi: $f$ continua e localmente lipschitziana in $y$
K: Tesi: esiste un intervallo con una e una sola soluzione
K: Controesempio alla unicità ($\sqrt{|y|}$)
K: Esempio di soluzione che esplode (carattere locale)

?th
Q: Descrivi la struttura delle soluzioni di un'equazione lineare del secondo ordine a coefficienti costanti e come si trova l'integrale generale.
A: Per l'equazione omogenea $y''+a_1y'+a_0y=0$ le soluzioni formano uno spazio vettoriale di dimensione 2; con le radici $\lambda_1,\lambda_2$ di $\lambda^2+a_1\lambda+a_0=0$: se reali distinte $c_1e^{\lambda_1t}+c_2e^{\lambda_2t}$; se reale doppia $(c_1+c_2t)e^{\lambda t}$; se complesse $\alpha\pm i\beta$, $e^{\alpha t}(c_1\cos\beta t+c_2\sin\beta t)$.

Per la non omogenea $y''+a_1y'+a_0y=g(t)$ l'integrale generale è la somma dell'integrale generale dell'omogenea e di una soluzione particolare, che per termini noti di tipo polinomio·esponenziale o seno/coseno si cerca con il metodo di somiglianza (moltiplicando per $t^m$ in caso di risonanza). Il problema di Cauchy con $y(t_0)$, $y'(t_0)$ assegnati ha una e una sola soluzione su $\mathbb R$.
K: Spazio delle soluzioni dell'omogenea di dimensione 2
K: I tre casi dell'equazione caratteristica
K: Non omogenea = omogenea + particolare
K: Metodo di somiglianza con la risonanza

program: Serie numeriche, somme parziali, convergenza; condizione necessaria; serie geometrica, telescopica, armonica generalizzata; serie a termini positivi: confronto, confronto asintotico, rapporto, radice; convergenza assoluta; criterio di Leibniz; serie di potenze, raggio e insieme di convergenza; derivazione e integrazione termine a termine; serie di Taylor e sviluppi notevoli.

#lesson 10.1 Serie numeriche e condizione necessaria
goal: Sapere cosa vuol dire che una serie converge, usare la condizione necessaria e sommare geometriche e telescopiche.

::idea
Una serie è una **somma infinita**: si sommano i primi $n$ termini (somma parziale $S_n$) e si guarda dove va $S_n$. Converge se $S_n$ tende a un numero; diverge se va a $\pm\infty$; è indeterminata se oscilla.

::def Serie, somma parziale, carattere
$\sum_{n=1}^\infty a_n$ converge a $S$ se $S_n=a_1+\dots+a_n\to S\in\mathbb R$. Il carattere (convergente, divergente, indeterminata) non cambia modificando un numero finito di termini.

::thm Condizione necessaria
Se $\sum a_n$ converge, allora $a_n\to0$. Il viceversa è **falso**: la serie armonica $\sum\frac1n$ diverge pur con $\frac1n\to0$.

::table
Serie ¦ Carattere ¦ Somma
geometrica $\sum_{n\ge0}q^n$ ¦ converge se e solo se $\lvert q\rvert<1$ ¦ $\frac1{1-q}$
telescopica $\sum\frac1{n(n+1)}$ ¦ converge ¦ 1 ($S_n=1-\frac1{n+1}$)
armonica generalizzata $\sum\frac1{n^p}$ ¦ converge se e solo se $p>1$ ¦ ($p=2$: $\frac{\pi^2}6$)

::lab serie

::example base $\sum_{n=1}^\infty\frac{2}{3^n}$.
+ Riconosci: geometrica di ragione $\frac13$ che parte da $n=1$.
+ Somma: $2\cdot\frac{1/3}{1-1/3}=2\cdot\frac12$.
= 1. Attenzione all'indice di partenza: da $n=0$ sarebbe 3.

::trap
- $a_n\to0$ non basta per convergere: è solo necessaria.
- La formula $\frac1{1-q}$ vale partendo da $n=0$; da $n=1$ è $\frac{q}{1-q}$.

#quiz
?vf
Q: Se $a_n\to0$, allora $\sum a_n$ converge.
A: F
W: Serie armonica: $\frac1n\to0$ ma $\sum\frac1n=+\infty$.

?mc
Q: $\displaystyle\sum_{n=1}^\infty\frac{1}{n(n+1)}$ vale
O: $\frac12$
O: 1
O: diverge
O: Nessuna delle precedenti
A: 2
W: Telescopica: $\frac1n-\frac1{n+1}$, $S_n=1-\frac1{n+1}\to1$.

?mc
Q: $\displaystyle\sum_{n=0}^\infty\frac{3}{4^n}$ vale
O: 3
O: 4
O: $\frac34$
O: Nessuna delle precedenti
A: 2
W: $3\cdot\frac{1}{1-1/4}=4$.

?vf
Q: La serie $\sum_{n\ge1}(-1)^n\frac{n}{n+1}$ converge.
A: F
W: $|a_n|\to1$: il termine generale non tende a 0, quindi non converge (è indeterminata).

#lesson 10.2 Serie a termini positivi: i criteri
goal: Stabilire il carattere di una serie a termini positivi scegliendo il criterio giusto.

::idea
Con termini positivi le somme parziali crescono: o si fermano sotto un tetto (converge) o vanno all'infinito. Mai indeterminata. Per decidere si confronta con serie note o si guarda come cresce il termine generale.

::thm I criteri (termini $a_n\ge0$)
**Confronto**: se $a_n\le b_n$ e $\sum b_n$ converge, converge $\sum a_n$; se $\sum a_n$ diverge, diverge $\sum b_n$.
**Confronto asintotico**: se $a_n\sim b_n$ (cioè $a_n/b_n\to\ell\in(0,\infty)$), le due serie hanno lo stesso carattere.
**Rapporto**: se $\frac{a_{n+1}}{a_n}\to\ell$: $\ell<1$ converge, $\ell>1$ diverge, $\ell=1$ non decide.
**Radice**: se $\sqrt[n]{a_n}\to\ell$: stesse conclusioni.

::method Quale criterio
1. Controlla $a_n\to0$: se no, diverge.
2. Frazioni di polinomi, radici, logaritmi: confronto asintotico con $\frac1{n^p}$.
3. Fattoriali ed esponenziali: rapporto.
4. Potenze $n$-esime ($(\dots)^n$): radice.

::example medio $\sum\frac{n}{n^2+1}$ e $\sum\frac{n!}{n^n}$.
+ Prima: $\frac{n}{n^2+1}\sim\frac1n$: diverge come l'armonica.
+ Seconda: $\frac{a_{n+1}}{a_n}=\frac{n^n}{(n+1)^n}=\frac{1}{(1+1/n)^n}\to\frac1e<1$: converge.
= Prima diverge, seconda converge.

::trap
- Rapporto o radice con limite 1 non decidono: per $\frac1n$ e $\frac1{n^2}$ il limite è 1 in entrambi i casi.
- Il confronto asintotico vale per termini (definitivamente) positivi.

#lesson 10.3 Convergenza assoluta e criterio di Leibniz
goal: Trattare le serie a segni alterni distinguendo convergenza assoluta e semplice.

::def Convergenza assoluta
$\sum a_n$ **converge assolutamente** se converge $\sum|a_n|$.

::thm Assoluta ⇒ semplice
Se $\sum|a_n|$ converge, allora $\sum a_n$ converge. Il viceversa è falso: $\sum\frac{(-1)^{n+1}}n$ converge (a $\ln2$) ma non assolutamente.

::thm Criterio di Leibniz
Se $b_n\ge0$ è **decrescente** e $b_n\to0$, allora $\sum(-1)^nb_n$ converge, e l'errore commesso fermandosi a $S_n$ è al più $b_{n+1}$.

::example medio $\sum\frac{(-1)^n}{\sqrt n}$.
+ Assoluta: $\sum\frac1{\sqrt n}$ diverge ($p=\frac12$).
+ Leibniz: $\frac1{\sqrt n}$ è decrescente e tende a 0.
= Converge **semplicemente**, non assolutamente.

::trap
- Leibniz richiede la decrescenza: non basta $b_n\to0$.
- Se $|a_n|\not\to0$ la serie non converge nemmeno semplicemente.

#lesson 10.4 Serie di potenze: raggio e insieme di convergenza
goal: Calcolare il raggio di convergenza e studiare gli estremi per trovare l'insieme di convergenza.

::def Serie di potenze e raggio
$\sum_{n\ge0}a_n(x-x_0)^n$. Esiste $R\in[0,+\infty]$ (**raggio di convergenza**) tale che la serie converge assolutamente per $|x-x_0|<R$ e non converge per $|x-x_0|>R$. Negli estremi $x_0\pm R$ può succedere di tutto: si studiano a parte.

::thm Calcolo del raggio
Se $\left|\frac{a_{n+1}}{a_n}\right|\to\ell$ oppure $\sqrt[n]{|a_n|}\to\ell$, allora $R=\frac1\ell$ (con $R=+\infty$ se $\ell=0$, $R=0$ se $\ell=+\infty$).

::method Insieme di convergenza
1. Calcola $R$ con rapporto o radice sui coefficienti.
2. Sostituisci $x=x_0+R$ e $x=x_0-R$: ottieni due serie numeriche.
3. Studiale (armonica generalizzata, Leibniz, condizione necessaria).
4. Scrivi l'intervallo con le parentesi giuste.

::example medio $\sum_{n\ge1}\frac{x^n}{n}$.
+ Raggio: $\frac{1/(n+1)}{1/n}\to1$: $R=1$.
+ x = 1: $\sum\frac1n$ diverge.
+ x = −1: $\sum\frac{(-1)^n}n$ converge (Leibniz).
= Insieme di convergenza $[-1,1)$.

::example esame $\sum_{n\ge0}\frac{(x-2)^n}{3^n}$.
+ Raggio: $\sqrt[n]{1/3^n}=\frac13$: $R=3$, centro 2.
+ Estremi: in $x=5$ e $x=-1$ i termini valgono $1$ e $(-1)^n$: non tendono a 0.
= Insieme $(-1,5)$; è una geometrica di somma $\frac{1}{1-(x-2)/3}=\frac{3}{5-x}$.

::thm Derivazione e integrazione termine a termine
All'interno dell'intervallo di convergenza la somma è derivabile infinite volte e si può derivare e integrare termine a termine; il raggio non cambia. Esempio: da $\sum x^n=\frac1{1-x}$ segue $\sum nx^{n-1}=\frac1{(1-x)^2}$ per $|x|<1$.

::trap
- Il raggio non dice nulla sugli estremi: $\sum\frac{x^n}n$ e $\sum\frac{x^n}{n^2}$ hanno entrambe $R=1$ ma insiemi $[-1,1)$ e $[-1,1]$.
- Con potenze $x^{2n}$ il raggio si calcola sulla variabile $x^2$: $\sum\frac{x^{2n}}{4^n}$ ha $R=2$.

#lesson 10.5 Serie di Taylor e sviluppi notevoli
goal: Usare gli sviluppi notevoli per scrivere serie di Taylor, leggere coefficienti e sommare serie numeriche.

::def Serie di Taylor
Se $f$ è $C^\infty$ vicino a $x_0$, la sua serie di Taylor è $\sum_{n\ge0}\frac{f^{(n)}(x_0)}{n!}(x-x_0)^n$. Quando converge a $f$ si dice che $f$ è **sviluppabile** in serie di Taylor. Il coefficiente di $x^n$ (con $x_0=0$) è $\frac{f^{(n)}(0)}{n!}$, quindi $f^{(n)}(0)=n!\cdot a_n$.

::table
Funzione ¦ Sviluppo in 0 ¦ Converge per
$e^x$ ¦ $\sum\frac{x^n}{n!}$ ¦ $\mathbb R$
$\sin x$ ¦ $\sum\frac{(-1)^nx^{2n+1}}{(2n+1)!}$ ¦ $\mathbb R$
$\cos x$ ¦ $\sum\frac{(-1)^nx^{2n}}{(2n)!}$ ¦ $\mathbb R$
$\frac1{1-x}$ ¦ $\sum x^n$ ¦ $(-1,1)$
$\ln(1+x)$ ¦ $\sum_{n\ge1}\frac{(-1)^{n+1}x^n}{n}$ ¦ $(-1,1]$
$\arctan x$ ¦ $\sum\frac{(-1)^nx^{2n+1}}{2n+1}$ ¦ $[-1,1]$

::lab taylor

::example medio Coefficiente di $x^6$ in $\frac1{1+x^2}$.
+ Sostituzione: $\frac1{1+x^2}=\sum(-x^2)^n=\sum(-1)^nx^{2n}$, per $|x|<1$.
= Con $2n=6$: coefficiente $(-1)^3=-1$.

::example esame $f^{(10)}(0)$ per $f=x^2e^x$.
+ Sviluppo: $x^2e^x=\sum\frac{x^{n+2}}{n!}$: il coefficiente di $x^{10}$ è $\frac1{8!}$.
+ Formula: $f^{(10)}(0)=10!\cdot\frac{1}{8!}=10\cdot9$.
= 90, senza derivare dieci volte.

::trap
- Il coefficiente di $x^n$ è $\frac{f^{(n)}(0)}{n!}$, non $f^{(n)}(0)$.
- Sostituire $x$ con $-x^2$ o $2x$ cambia anche il raggio: $\frac{1}{1-2x}$ converge per $|x|<\frac12$.

?th
Q: Enuncia il criterio di Leibniz e spiega la differenza tra convergenza semplice e assoluta.
A: **Leibniz.** Sia $(b_n)$ una successione con $b_n\ge0$, decrescente e infinitesima. Allora la serie $\sum_{n\ge0}(-1)^nb_n$ converge; inoltre, detta $S$ la somma, $|S-S_n|\le b_{n+1}$.

Una serie $\sum a_n$ converge assolutamente se converge $\sum|a_n|$. La convergenza assoluta implica quella semplice, ma non viceversa: $\sum\frac{(-1)^{n+1}}{n}$ converge a $\ln2$ per Leibniz, mentre $\sum\frac1n$ diverge.
K: Ipotesi: $b_n\ge0$, decrescente, infinitesima
K: Tesi: convergenza e stima dell'errore $\le b_{n+1}$
K: Definizione di convergenza assoluta
K: Assoluta ⇒ semplice, con controesempio al viceversa

?th
Q: Definisci il raggio di convergenza di una serie di potenze e spiega come si determina l'insieme di convergenza.
A: Data $\sum a_n(x-x_0)^n$, esiste $R\in[0,+\infty]$ tale che la serie converge assolutamente per $|x-x_0|<R$ e non converge per $|x-x_0|>R$: è il raggio di convergenza. Se $\left|\frac{a_{n+1}}{a_n}\right|\to\ell$ oppure $\sqrt[n]{|a_n|}\to\ell$, allora $R=\frac1\ell$ (convenzioni $\frac10=+\infty$, $\frac1\infty=0$).

Per l'insieme di convergenza si studiano a parte gli estremi $x_0\pm R$, dove si ottengono serie numeriche. Esempio: $\sum\frac{x^n}{n}$ ha $R=1$ e insieme $[-1,1)$. All'interno la somma si può derivare e integrare termine a termine con lo stesso raggio.
K: Definizione di raggio di convergenza
K: Calcolo con rapporto o radice
K: Studio separato degli estremi, con esempio
K: Derivazione e integrazione termine a termine

?th
Q: Enuncia la condizione necessaria per la convergenza di una serie e i criteri del confronto e del rapporto.
A: Se $\sum a_n$ converge allora $a_n\to0$ (non sufficiente: serie armonica). Per serie a termini non negativi: **confronto**: se $0\le a_n\le b_n$ definitivamente e $\sum b_n$ converge, allora converge $\sum a_n$ (e se $\sum a_n$ diverge, diverge $\sum b_n$); **confronto asintotico**: se $\frac{a_n}{b_n}\to\ell\in(0,+\infty)$ le due serie hanno lo stesso carattere; **rapporto**: se $\frac{a_{n+1}}{a_n}\to\ell$, la serie converge per $\ell<1$, diverge per $\ell>1$; per $\ell=1$ il criterio non decide.
K: Condizione necessaria e controesempio
K: Confronto (nei due versi)
K: Confronto asintotico
K: Rapporto con il caso $\ell=1$

  cubo: { t: 'x³ / (x² + y²)', f: (x, y) => x ** 3 / (x * x + y * y), note: '|f| ≤ |x| → 0: il limite esiste e vale 0, lungo qualunque curva.' },

      L.ro.innerHTML = `P = (${fmt(x0)}, ${fmt(y0)})<br><span style="color:${NIGHT.amber}">∇f = (${fmt(g[0])}, ${fmt(g[1])})</span><br><span style="color:${NIGHT.red}">v = (${fmt(v[0])}, ${fmt(v[1])})</span><br>∂f/∂v = ∇f·v = <b>${fmt(dv)}</b>`;
      document.getElementById(u + 'v').innerHTML = `<b>|∇f| = ${fmt(gl)}</b><span class="small">È la derivata direzionale massima, nella direzione del gradiente (ambra). In blu la curva di livello per P: il gradiente le è ortogonale e lungo di essa la derivata è 0.</span>`;
    };
    document.getElementById(u + 'f').onchange = e => { st.f = e.target.value; L.redraw(); };
    bindRange(u + 'a', v => { st.th = v; L.redraw(); }, v => v + '°');
    let drag = false;
    const pick = e => { const r = L.cv.getBoundingClientRect(); st.P = pl.inv(e.clientX - r.left, e.clientY - r.top); L.redraw(); };
    L.cv.addEventListener('pointerdown', e => { drag = true; L.cv.setPointerCapture(e.pointerId); pick(e); });
    L.cv.addEventListener('pointermove', e => drag && pick(e)); L.cv.addEventListener('pointerup', () => drag = false);
    L.redraw();
  },
  mini(host, p) { this.page(host, p, true); }
};

LABS.forme = {
  ch: 3, title: 'Forme quadratiche', desc: 'Cambia a, b, c in q = ah² + 2bhk + ck²: coppa, coppa rovesciata, sella o grondaia. Il determinante decide.',
  thumb: cv => thumbSurface(cv, (x, y) => x * x - y * y, { range: 1.3 }),
  page(host, p = {}, compact = false) {
    const u = uid();
    const L = labLayout(host, ctlRange(u + 'a', 'a', -3, 3, .1, 2) + ctlRange(u + 'b', 'b', -3, 3, .1, 1) + ctlRange(u + 'c', 'c', -3, 3, .1, 2)
      + `<div class="row">${[['coppa', 2, 1, 2], ['sella', 1, 2, 1], ['grondaia', 1, 1, 1], ['rovescia', -2, 1, -1]].map(([t, a, b, c]) => `<button type="button" class="btn small ghost" data-p="${a},${b},${c}">${t}</button>`).join('')}</div><div class="verdict" id="${u}v"></div>`,
      { hint: 'trascina per ruotare', compact });
    const st = { a: 2, b: 1, c: 2 }; const s = new Surface3D(L.cv, { range: 1.3, n: 31 });
    L.redraw = () => {
      const { a, b, c } = st; s.setF((h, k) => a * h * h + 2 * b * h * k + c * k * k); s.render();
      const det = a * c - b * b; let cls, col;
      if (det > 1e-9) { cls = a > 0 ? 'definita positiva · minimo' : 'definita negativa · massimo'; col = 'ok'; }
      else if (det < -1e-9) { cls = 'indefinita · sella'; col = 'red'; } else { cls = (a + c > 0 ? 'semidefinita positiva' : a + c < 0 ? 'semidefinita negativa' : 'nulla') + ' · il test non decide'; col = 'amber'; }
      L.ro.innerHTML = `H = [${fmt(a, 1)} ${fmt(b, 1)} ; ${fmt(b, 1)} ${fmt(c, 1)}]<br>det H = ac − b² = <b>${fmt(det)}</b>`;
      document.getElementById(u + 'v').innerHTML = `<b>${cls}</b><span class="small">det > 0: conta il segno di a. det < 0: sella, qualunque sia a. det = 0: grondaia, piatta lungo una retta.</span><span class="chip ${col}" style="justify-self:start">det ${det > 1e-9 ? '> 0' : det < -1e-9 ? '< 0' : '= 0'}</span>`;

    $$('[data-p]', host).forEach(b => b.onclick = () => { const [a, bb, c] = b.dataset.p.split(',').map(Number); Object.assign(st, { a, b: bb, c }); ['a', 'b', 'c'].forEach(k => { const el = document.getElementById(u + k); el.value = st[k]; document.getElementById(u + k + 'o').textContent = fmt(st[k], 1); }); L.redraw(); });
    L.redraw();
  },
  mini(host, p) { this.page(host, p, true); }
};

LABS.polari = {
  ch: 4, title: 'Coordinate polari', desc: 'Un rettangolo nel piano (ρ, θ) diventa un settore di corona: le celle lontane dall\'origine sono più grandi, per questo dx dy = ρ dρ dθ.',
  thumb: cv => { const pl = new Plot2D(cv, { xr: [-2.2, 2.2], yr: [-1.4, 1.4] }); pl.clear(); pl.grid(1, false); const c = pl.ctx; c.fillStyle = 'rgba(246,178,58,.5)'; c.beginPath(); c.arc(pl.X(0), pl.Y(0), pl.X(1.3) - pl.X(0), -2.3, -.3); c.arc(pl.X(0), pl.Y(0), pl.X(.6) - pl.X(0), -.3, -2.3, true); c.fill(); },
  page(host, p = {}, compact = false) {
    const u = uid();
    const L = labLayout(host, ctlRange(u + 'r1', 'ρ minimo', 0, 2, .05, .5) + ctlRange(u + 'r2', 'ρ massimo', .1, 2.5, .05, 2) + ctlRange(u + 't1', 'θ iniziale (×π)', -1, 2, .05, 0) + ctlRange(u + 't2', 'θ finale (×π)', -1, 2, .05, 1)
      + `<div class="verdict" id="${u}v"></div>`, { hint: 'sinistra: piano (ρ,θ) · destra: piano (x,y)', compact });
    const st = { r1: .5, r2: 2, t1: 0, t2: 1 };
    L.redraw = () => {
      const { ctx: c, w, h } = fitCanvas(L.cv); c.fillStyle = NIGHT.bg; c.fillRect(0, 0, w, h);
      const half = w / 2, pad = 28;
      let r1 = Math.min(st.r1, st.r2 - .05), r2 = st.r2, t1 = st.t1 * Math.PI, t2 = Math.max(st.t2, st.t1 + .02) * Math.PI;
      // pannello sinistro
      const LX = rr => pad + (rr / 2.5) * (half - 2 * pad), LY = tt => h - pad - ((tt + Math.PI) / (3 * Math.PI)) * (h - 2 * pad);
      c.strokeStyle = NIGHT.axis; c.lineWidth = 1; c.beginPath(); c.moveTo(pad, h - pad); c.lineTo(half - pad, h - pad); c.moveTo(pad, h - pad); c.lineTo(pad, pad); c.stroke();
      c.fillStyle = NIGHT.text; c.font = '11px "JetBrains Mono"'; c.fillText('ρ', half - pad - 6, h - pad + 16); c.fillText('θ', pad - 14, pad + 4);
      const N = 6, M = 8;
      for (let i = 0; i < N; i++) for (let j = 0; j < M; j++) {
        const ra = r1 + (r2 - r1) * i / N, rb = r1 + (r2 - r1) * (i + 1) / N, ta = t1 + (t2 - t1) * j / M, tb = t1 + (t2 - t1) * (j + 1) / M;
        const col = (i + j) % 2 ? 'rgba(246,178,58,.55)' : 'rgba(98,178,240,.45)';
        c.fillStyle = col; c.fillRect(LX(ra), LY(tb), LX(rb) - LX(ra), LY(ta) - LY(tb));
        // destra
        const cx = half + half / 2, cy = h / 2, sc = Math.min(half, h) / 5.6;
        c.beginPath(); c.arc(cx, cy, rb * sc, -ta, -tb, true); c.arc(cx, cy, ra * sc, -tb, -ta, false); c.closePath(); c.fill();
      }
      const cx = half + half / 2, cy = h / 2, sc = Math.min(half, h) / 5.6;
      c.strokeStyle = NIGHT.axis; c.beginPath(); c.moveTo(half + 10, cy); c.lineTo(w - 10, cy); c.moveTo(cx, 10); c.lineTo(cx, h - 10); c.stroke();
      c.strokeStyle = 'rgba(220,231,234,.3)'; c.beginPath(); c.moveTo(half, 0); c.lineTo(half, h); c.stroke();
      c.fillStyle = NIGHT.text; c.fillText('x', w - 18, cy - 6); c.fillText('y', cx + 6, 20);
      const area = .5 * (r2 * r2 - r1 * r1) * (t2 - t1);
      L.ro.innerHTML = `ρ ∈ [${fmt(r1)}, ${fmt(r2)}]  θ ∈ [${fmt(t1 / Math.PI)}π, ${fmt(t2 / Math.PI)}π]<br>area = ½(ρ₂² − ρ₁²)(θ₂ − θ₁) = <b>${fmt(area, 3)}</b>`;
      document.getElementById(u + 'v').innerHTML = `<b>Area senza il fattore ρ: ${fmt((r2 - r1) * (t2 - t1), 3)}</b><span class="small">È l'area del rettangolo a sinistra, ed è sbagliata: le celle esterne a destra sono più grandi. Il fattore ρ dello Jacobiano corregge proprio questo.</span>`;
    };
    ['r1', 'r2', 't1', 't2'].forEach(k => bindRange(u + k, v => { st[k] = v; L.redraw(); }, v => fmt(v)));
    L.redraw();
  },
  mini(host, p) { this.page(host, p, true); }
};

LABS.fubini = {
  ch: 5, title: 'Domini normali e Fubini', desc: 'Il segmento verticale scorre da a a b: ogni fetta va da g₁(x) a g₂(x). Integrare le fette dà l\'integrale doppio.',
  thumb: cv => { const pl = new Plot2D(cv, { xr: [-.3, 1.3], yr: [-.2, 1.2] }); pl.clear(); pl.grid(.5, false); const c = pl.ctx; c.fillStyle = 'rgba(98,178,240,.45)'; c.beginPath(); for (let k = 0; k <= 50; k++) { const x = k / 50; c.lineTo(pl.X(x), pl.Y(x)); } for (let k = 50; k >= 0; k--) { const x = k / 50; c.lineTo(pl.X(x), pl.Y(x * x)); } c.fill(); pl.graph(x => x, NIGHT.amber); pl.graph(x => x * x, NIGHT.red); },
  page(host, p = {}, compact = false) {
    const u = uid();
    const DOM = {
      par: { t: 'x² ≤ y ≤ x, x ∈ [0,1]', a: 0, b: 1, g1: x => x * x, g2: x => x, tex: '\\int_0^1\\!\\int_{x^2}^{x} f\\,dy\\,dx', xr: [-.25, 1.25], yr: [-.2, 1.2] },
      semi: { t: '0 ≤ y ≤ √(1 − x²), x ∈ [−1,1]', a: -1, b: 1, g1: x => 0, g2: x => Math.sqrt(Math.max(0, 1 - x * x)), tex: '\\int_{-1}^{1}\\!\\int_{0}^{\\sqrt{1-x^2}} f\\,dy\\,dx', xr: [-1.3, 1.3], yr: [-.3, 1.3] },
      tri: { t: '0 ≤ y ≤ 2 − x, x ∈ [0,2]', a: 0, b: 2, g1: x => 0, g2: x => 2 - x, tex: '\\int_0^2\\!\\int_0^{2-x} f\\,dy\\,dx', xr: [-.3, 2.3], yr: [-.3, 2.3] }
    };
    const FF = { uno: ['1 (area)', (x, y) => 1], xy: ['x + y', (x, y) => x + y], xy2: ['x y', (x, y) => x * y] };
    const L = labLayout(host, ctlSelect(u + 'd', 'Dominio', Object.entries(DOM).map(([k, v]) => [k, v.t]), p.d || 'par') + ctlSelect(u + 'f', 'Integranda f', Object.entries(FF).map(([k, v]) => [k, v[0]]), 'uno')
      + ctlRange(u + 'x', 'Posizione della fetta x', 0, 1, .005, .5) + `<div class="verdict" id="${u}v"></div>`, { hint: 'la fetta va dal bordo inferiore a quello superiore', compact });
    const st = { d: p.d || 'par', f: 'uno', s: .5 };
    L.redraw = () => {
      const D = DOM[st.d], F = FF[st.f][1], pl = new Plot2D(L.cv, { xr: D.xr, yr: D.yr }); pl.clear(); pl.grid(.5);
      const c = pl.ctx; c.fillStyle = 'rgba(98,178,240,.32)'; c.beginPath();
      for (let k = 0; k <= 120; k++) { const x = D.a + (D.b - D.a) * k / 120; c.lineTo(pl.X(x), pl.Y(D.g2(x))); }
      for (let k = 120; k >= 0; k--) { const x = D.a + (D.b - D.a) * k / 120; c.lineTo(pl.X(x), pl.Y(D.g1(x))); } c.closePath(); c.fill();
      pl.curve(t => [t, D.g2(t)], D.a, D.b, 200, NIGHT.amber, 2.4); pl.curve(t => [t, D.g1(t)], D.a, D.b, 200, NIGHT.red, 2.4);
      const x = D.a + (D.b - D.a) * st.s, y1 = D.g1(x), y2 = D.g2(x);
      c.strokeStyle = NIGHT.white; c.lineWidth = 4; c.beginPath(); c.moveTo(pl.X(x), pl.Y(y1)); c.lineTo(pl.X(x), pl.Y(y2)); c.stroke();
      pl.dot(x, y1, 5, NIGHT.red); pl.dot(x, y2, 5, NIGHT.amber);
      // integrale interno e totale (Simpson)
      const inner = xx => { const a = D.g1(xx), b = D.g2(xx), n = 60; let s = 0; for (let k = 0; k <= n; k++) { const y = a + (b - a) * k / n, wgt = k === 0 || k === n ? 1 : k % 2 ? 4 : 2; s += wgt * F(xx, y); } return s * (b - a) / (3 * n); };
      let tot = 0; const n = 200; for (let k = 0; k <= n; k++) { const xx = D.a + (D.b - D.a) * k / n, wgt = k === 0 || k === n ? 1 : k % 2 ? 4 : 2; tot += wgt * inner(xx); } tot *= (D.b - D.a) / (3 * n);
      L.ro.innerHTML = `fetta x = ${fmt(x)}: y da ${fmt(y1)} a ${fmt(y2)}<br>∫ f dy = ${fmt(inner(x), 4)}<br>∬ f = <b>${fmt(tot, 4)}</b>`;
      const v = document.getElementById(u + 'v'); v.innerHTML = `<b>Formula di riduzione</b><div>$$${D.tex}$$</div><span class="small">Rosso: g₁(x), bordo inferiore. Ambra: g₂(x), bordo superiore. Prima l'integrale della fetta in y, poi si sommano le fette in x.</span>`; typeset(v);
    };
    document.getElementById(u + 'd').onchange = e => { st.d = e.target.value; L.redraw(); };
    document.getElementById(u + 'f').onchange = e => { st.f = e.target.value; L.redraw(); };
    bindRange(u + 'x', v => { st.s = v; L.redraw(); }, v => fmt(v));
    L.redraw();
  },
  mini(host, p) { this.page(host, p, true); }
};

LABS.curve = {
  ch: 6, title: 'Curve, velocità e lunghezza', desc: 'Il punto percorre γ(t); la freccia è γ\'(t), il vettore velocità. La lunghezza è l\'integrale di |γ\'(t)|.',
  thumb: cv => { const pl = new Plot2D(cv, { xr: [-1.5, 1.5], yr: [-1.2, 1.2] }); pl.clear(); pl.grid(1, false); pl.curve(t => [Math.cos(t) ** 3, Math.sin(t) ** 3], 0, 6.3, 300, NIGHT.amber, 2.5); },
  page(host, p = {}, compact = false) {
    const u = uid(), T = 2 * Math.PI;
    const CV = {
      cerchio: ['circonferenza (cos t, sin t)', t => [Math.cos(t), Math.sin(t)], t => [-Math.sin(t), Math.cos(t)], T, '2π ≈ 6.283'],
      ellisse: ['ellisse (2cos t, sin t)', t => [2 * Math.cos(t), Math.sin(t)], t => [-2 * Math.sin(t), Math.cos(t)], T, 'non elementare ≈ 9.688'],
      cicloide: ['cicloide (t − sin t, 1 − cos t)', t => [t - Math.sin(t), 1 - Math.cos(t)], t => [1 - Math.cos(t), Math.sin(t)], T, '8'],
      astroide: ['astroide (cos³t, sin³t)', t => [Math.cos(t) ** 3, Math.sin(t) ** 3], t => [-3 * Math.cos(t) ** 2 * Math.sin(t), 3 * Math.sin(t) ** 2 * Math.cos(t)], T, '6'],
      cardioide: ['cardioide ρ = 1 + cos θ', t => [(1 + Math.cos(t)) * Math.cos(t), (1 + Math.cos(t)) * Math.sin(t)], t => [-Math.sin(t) * Math.cos(t) - (1 + Math.cos(t)) * Math.sin(t), -Math.sin(t) * Math.sin(t) + (1 + Math.cos(t)) * Math.cos(t)], T, '8']
    };
    const L = labLayout(host, ctlSelect(u + 'c', 'Curva', Object.entries(CV).map(([k, v]) => [k, v[0]]), 'astroide') + ctlRange(u + 't', 'Parametro t (×2π)', 0, 1, .002, .3)
      + `<div class="verdict" id="${u}v"></div>`, { hint: 'ambra: tratto già percorso', compact });
    const st = { c: 'astroide', s: .3 };
    L.redraw = () => {
      const [, g, dg, tmax, Ltot] = CV[st.c];
      const xs = [], ys = []; for (let k = 0; k <= 200; k++) { const q = g(tmax * k / 200); xs.push(q[0]); ys.push(q[1]); }
      const pad = .5, xr = [Math.min(...xs) - pad, Math.max(...xs) + pad], yr = [Math.min(...ys) - pad, Math.max(...ys) + pad];
      const pl = new Plot2D(L.cv, { xr, yr }); pl.clear(); pl.grid(1);
      const t = tmax * st.s;
      pl.curve(g, 0, tmax, 600, 'rgba(220,231,234,.35)', 2); pl.curve(g, 0, t, 600, NIGHT.amber, 3.2);
      const [x, y] = g(t), [vx, vy] = dg(t); pl.arrow(x, y, vx * .45, vy * .45, NIGHT.red, 3, 10); pl.dot(x, y, 6, NIGHT.white, NIGHT.bg);
      let len = 0; const n = 600; for (let k = 0; k < n; k++) { const a = t * k / n, b = t * (k + 1) / n, m = (a + b) / 2, d = dg(m); len += Math.hypot(d[0], d[1]) * (b - a); }
      const sp = Math.hypot(vx, vy);
      L.ro.innerHTML = `t = ${fmt(t)}<br>γ'(t) = (${fmt(vx)}, ${fmt(vy)}) · |γ'| = ${fmt(sp)}<br>lunghezza percorsa = <b>${fmt(len, 3)}</b>`;
      document.getElementById(u + 'v').innerHTML = `<b>Lunghezza totale: ${Ltot}</b><span class="small">${sp < 1e-6 ? '<b>Qui γ\'(t) = 0: la curva non è regolare in questo punto (cuspide).</b> ' : ''}Regolare vuol dire γ' continua e mai nulla. Astroide, cicloide e cardioide hanno punti dove la velocità si annulla: prova a trovarli.</span>`;
    };
    document.getElementById(u + 'c').onchange = e => { st.c = e.target.value; L.redraw(); };
    bindRange(u + 't', v => { st.s = v; L.redraw(); }, v => fmt(v, 3));
    L.redraw();
  },
  mini(host, p) { this.page(host, p, true); }
};

LABS.campi = {
  ch: 7, title: 'Campi, circuitazione e Green', desc: 'Frecce del campo, colore del rotore, e una circonferenza da spostare: confronta la circuitazione con l\'integrale del rotore.',
  thumb: cv => { const pl = new Plot2D(cv, { xr: [-2, 2], yr: [-1.3, 1.3] }); pl.clear(); for (let x = -1.8; x <= 1.8; x += .45) for (let y = -1.1; y <= 1.1; y += .45) pl.arrow(x, y, -y * .25, x * .25, NIGHT.amber, 1.6, 5); },
  page(host, p = {}, compact = false) {
    const u = uid();
    const FD = {
      vortice: ['(−y, x)', (x, y) => [-y, x], (x, y) => 2, 'Rotore costante 2: la circuitazione è 2 × area del cerchio, ovunque tu lo metta.'],
      sorgente: ['(x, y)', (x, y) => [x, y], (x, y) => 0, 'Irrotazionale e definito su tutto il piano: è conservativo, potenziale (x² + y²)/2. Circuitazione sempre 0.'],
      grad: ['(y, x) = ∇(xy)', (x, y) => [y, x], (x, y) => 0, 'È un gradiente: il lavoro lungo ogni curva chiusa è 0.'],
      taglio: ['(y, 0)', (x, y) => [y, 0], (x, y) => -1, 'Frecce parallele ma il campo gira: rotore −1, circuitazione −area.'],
      buco: ['(−y, x)/(x² + y²)', (x, y) => { const r = x * x + y * y; return [-y / r, x / r]; }, (x, y) => 0, 'Rotore nullo fuori dall\'origine, ma attorno all\'origine la circuitazione è 2π: irrotazionale non basta, il dominio non è semplicemente connesso.']
    };
    const L = labLayout(host, ctlSelect(u + 'f', 'Campo F = (P, Q)', Object.entries(FD).map(([k, v]) => [k, v[0]]), p.f || 'buco') + ctlRange(u + 'r', 'Raggio della circonferenza', .2, 1.5, .05, .8)
      + `<div class="verdict" id="${u}v"></div>`, { hint: 'trascina per spostare la circonferenza', compact });
    const st = { f: p.f || 'buco', C: [0, 0], r: .8 }; let pl;
    L.redraw = () => {
      pl = new Plot2D(L.cv, { xr: [-2.5, 2.5], yr: [-1.8, 1.8] }); pl.clear();
      const [, F, rot, note] = FD[st.f];
      pl.field((x, y) => rot(x, y) + 0 * x, { rampName: 'div', levels: 0, zr: [-2.2, 2.2], heat: st.f !== 'buco' && st.f !== 'sorgente' && st.f !== 'grad' });
      pl.grid(1, false);
      for (let x = -2.4; x <= 2.4; x += .3) for (let y = -1.7; y <= 1.7; y += .3) {
        const [a, b] = F(x, y), m = Math.hypot(a, b); if (!isFinite(m) || m < 1e-9) continue; const s = .22 * Math.min(1, .6 + .4 * Math.tanh(m)) / m;
        pl.arrow(x, y, a * s, b * s, 'rgba(244,246,242,.75)', 1.4, 5);
      }
      const [cx, cy] = st.C, R = st.r;
      pl.curve(t => [cx + R * Math.cos(t), cy + R * Math.sin(t)], 0, 2 * Math.PI, 200, NIGHT.amber, 2.8);
      pl.arrow(cx + R, cy, 0, .25, NIGHT.amber, 2.8, 9);
      let circ = 0; const n = 720; for (let k = 0; k < n; k++) { const t = 2 * Math.PI * (k + .5) / n, x = cx + R * Math.cos(t), y = cy + R * Math.sin(t), [P, Qv] = F(x, y); circ += (P * -R * Math.sin(t) + Qv * R * Math.cos(t)) * 2 * Math.PI / n; }
      let rotInt = 0; const m = 80; for (let i = 0; i < m; i++) for (let j = 0; j < m; j++) { const rr = R * (i + .5) / m, tt = 2 * Math.PI * (j + .5) / m; rotInt += rot(cx + rr * Math.cos(tt), cy + rr * Math.sin(tt)) * rr * (R / m) * (2 * Math.PI / m); }
      const inside = st.f === 'buco' && Math.hypot(cx, cy) < R;
      L.ro.innerHTML = `∮ F·dr = <b>${fmt(circ, 3)}</b><br>∬ (Q<sub>x</sub> − P<sub>y</sub>) dx dy = <b>${fmt(rotInt, 3)}</b>${inside ? '<br><span style="color:#FF5446">origine dentro: Green non si applica</span>' : ''}`;
      document.getElementById(u + 'v').innerHTML = `<b>${inside ? 'I due numeri non coincidono' : 'Green: i due numeri coincidono'}</b><span class="small">${esc(note)}</span>`;
    };

/* disegna un grafico SVG alla larghezza reale del contenitore, così il testo resta leggibile anche sul telefono */
function fitChart(host, fn) {
  if (!host) return;
  let last = 0;
  const draw = () => { const w = Math.round(host.clientWidth); if (!w || Math.abs(w - last) < 4) return; last = w; host.innerHTML = fn(Math.max(280, w)); };
  draw();
  const ro = new ResizeObserver(() => { if (!host.isConnected) { ro.disconnect(); return; } draw(); });
  ro.observe(host);
}
function profileChart(W = 640) {
  const H = 210, pl = 34, pr = 10, pt = 16, pb = 30, n = CH.length;
  const X = i => pl + (W - pl - pr) * (i + .5) / n, Y = p => pt + (H - pt - pb) * (1 - p);
  const ms = CH.map(c => mastery(c.n));
  let g = '';
  [0, .25, .5, .75, 1].forEach(p => { g += `<line class="gl" x1="${pl}" x2="${W - pr}" y1="${Y(p)}" y2="${Y(p)}"/><text x="${pl - 6}" y="${Y(p) + 4}" text-anchor="end">${p * 100}%</text>`; });
  g += `<line x1="${pl}" x2="${W - pr}" y1="${Y(.6)}" y2="${Y(.6)}" stroke="var(--amber)" stroke-width="1.5" stroke-dasharray="5 4"/><text x="${W - pr}" y="${Y(.6) - 5}" text-anchor="end" style="fill:var(--amber-ink)">60%: zona sicura</text>`;
  const pts = ms.map((m, i) => [X(i), Y(m ?? 0), m]);
  const poly = `${pl},${Y(0)} ` + pts.map(p => `${p[0]},${p[1]}`).join(' ') + ` ${W - pr},${Y(0)}`;
  g += `<polygon points="${poly}" fill="var(--blue-soft)" stroke="none"/>`;
  g += `<polyline points="${pts.map(p => p[0] + ',' + p[1]).join(' ')}" fill="none" stroke="var(--blue)" stroke-width="2"/>`;
  pts.forEach((p, i) => {
    g += `<circle cx="${p[0]}" cy="${p[1]}" r="${p[2] === null ? 3 : 5}" fill="${p[2] === null ? 'var(--line)' : p[2] >= .6 ? 'var(--ok)' : 'var(--red)'}" stroke="var(--sheet)" stroke-width="2"/>`;
    g += `<text x="${p[0]}" y="${H - 10}" text-anchor="middle">${CH[i].n}</text>`;
    if (p[2] !== null) g += `<text x="${p[0]}" y="${p[1] - 9}" text-anchor="middle" style="fill:var(--ink);font-weight:600">${Math.round(p[2] * 100)}</text>`;
  });
  g += `<line class="ax" x1="${pl}" x2="${W - pr}" y1="${Y(0)}" y2="${Y(0)}"/>`;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Padronanza per capitolo">${g}</svg>`;
}
